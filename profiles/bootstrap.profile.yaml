# The build root used to produce Eternal packages.
#
# Eternal Linux is greenfield, but a distribution still needs a working
# toolchain before it can build itself. This profile borrows Fedora 44 to run
# rpmx build steps and to provide the packages the first recipes need. It is a
# build dependency, not the distribution identity: Eternal owns its release
# package, repository and images.
#
# As packages are brought in-tree, remove them from `packages.install` here and
# add them to `eternal-base` instead. The bootstrap root should shrink over
# time; it must never become the definition of the distribution.
document: rpmx-profile
version: 1
name: bootstrap-fedora-44
releasever: "44"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora:44
repositories:
  - id: eternal
    baseurl: https://rsturla.github.io/eternal-os/rolling/$basearch
    # Only the userland packages that have completed the self-hosting switch
    # are consumed from here. Keep the seed compiler and C library out until
    # their exact-release dependencies are stable.
    exclude: [filesystem, basesystem, eternal-release, eternal-base, eternal-baselayout, glibc-*, gcc-*, ld-linux-*, libc-bin-*, libstdc++-*, libatomic-*, nss-db-*]
  - id: fedora
    metalink: https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch
    # These package names are already produced by Eternal. Hiding the Fedora
    # copies is what makes the build root consume the published Eternal
    # repository instead of only using it for metadata.
    exclude: [bash, bash-binsh, binutils, coreutils, coreutils-single, make]
  - id: updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
    exclude: [bash, bash-binsh, binutils, coreutils, coreutils-single, make]
  - id: eternal-toolchain
    baseurl: file://../.work/toolchain-repo
packages:
  install:
    - openssf-compiler-options
    - bash
    - bash-binsh
    - binutils
    - coreutils
    - findutils
    - gcc
    - make
    - patch
    - tar
    - gzip
    - sed
    - grep
    - gawk
    - diffutils
    - pkgconf-pkg-config
sbom: true
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64

# Distribution policy that is not compiler hardening: optimisation, warnings,
# unwind tables, and the target ISA baseline. The OpenSSF hardening controls
# live in openssf-compiler-options. Its wrapper in /usr/local/bin applies the
# matching GCC spec, so a recipe opts out with
# GCC_SPEC_FILE=no-hardening.spec only when it cannot use the policy.
flags:
  cflags:
    - -O2
    - -g
    - -pipe
    - -Wall
    - -Werror=format-security
    - -fexceptions
    - -fasynchronous-unwind-tables
    - -grecord-gcc-switches
  cxxflags:
    - -O2
    - -g
    - -pipe
    - -Wall
    - -Werror=format-security
    - -fexceptions
    - -fasynchronous-unwind-tables
    - -grecord-gcc-switches
  arch:
    x86_64:
      cflags:
        - -march=x86-64-v2
        - -fcf-protection=full
      cxxflags:
        - -march=x86-64-v2
        - -fcf-protection=full
    aarch64:
      cflags:
        - -mbranch-protection=standard
      cxxflags:
        - -mbranch-protection=standard
