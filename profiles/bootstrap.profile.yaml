# The build root used to produce Eternal packages.
#
# Eternal Linux is greenfield, but a distribution still needs a working
# toolchain before it can build itself. This profile borrows Fedora 44 to run
# rpmx build steps and to provide the packages the first recipes need. The root
# uses Eternal's release package and filesystem alongside adopted Eternal tools
# and Fedora build dependencies. Eternal's release package supplies
# system-release for setup's account data.
#
# As packages are brought in-tree, remove them from `packages.install` here and
# add them to `eternal-base` instead. The bootstrap root should shrink over
# time; it must never become the definition of the distribution.
document: rpmx-profile
version: 1
name: bootstrap-fedora-44
releasever: "44"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora@sha256:f08613fffc95f5c85c019b2f4ac9e9fb9bb84b9cfd59275671b84169567b157e
repositories:
  - id: eternal
    baseurl: https://packages.eternal.sturla.tech/rolling/$basearch
    # Only the userland packages that have completed the self-hosting switch
    # are consumed from here. Keep the seed compiler and C library out until
    # their exact-release dependencies are stable.
    #
    # The recipes added in the first rolling release are published, but their
    # package layouts still overlap the Fedora set: archful/noarch pairs
    # (meson, toml11), the perl and python streams, the curl/openssl/rpm stack
    # and the libxml2/libarchive pair. Keep them on the Fedora side until each
    # integration is validated; shrink this list as the packages are adopted.
    #
    # util-linux and libxml2 stay on the Fedora side until their consumers are
    # in-tree too. Fedora's libarchive still links libxml2.so.2, while Eternal
    # libxml2 2.15 provides libxml2.so.16; the Fedora util-linux packages also
    # require the matching libsmartcols/libuuid release. Mixing both providers
    # makes the offline root transaction fail with file and version conflicts.
    # Keep Eternal's system-release provider available for setup's real
    # account data. Fedora's release chain requires its newer filesystem RPM.
    exclude:
      - basesystem
      - eternal-base
      - eternal-baselayout
      - glibc-*
      - gcc-*
      - ld-linux-*
      - libc-bin-*
      - libstdc++-*
      - libatomic-*
      - nss-db-*
      - expat*
      # New recipes held out of the shared root until their integration lands.
      - autoconf*
      - automake*
      - bison*
      - bzip2*
      - ca-certificates*
      - cmake*
      - curl*
      - dnf5*
      - docbook-style-xsl*
      # Keep file out without also excluding filesystem.
      - file
      - file-*
      - flex*
      - fmt*
      - gettext*
      - glib2*
      - json-c*
      # Fedora CMake needs jsoncpp ABI 26; Eternal currently ships ABI 27.
      - jsoncpp*
      - libarchive*
      - librepo*
      - libsemanage*
      - libsolv*
      - libtool*
      - libunistring*
      - libxml2*
      - libxslt*
      - lua*
      - meson*
      - ninja*
      # Fedora curl requires an architecture-qualified libnghttp2 capability.
      # Keep its matching library until the Eternal provider can replace it.
      - nghttp2*
      - openssl3*
      - perl*
      - popt*
      - python-3.13*
      - python-3.14*
      - readline*
      - rpm*
      - scdoc*
      - shadow-utils*
      - sqlite*
      - texinfo*
      - toml11*
      - tzdata*
      - util-linux*
      - libblkid*
      - libfdisk*
      - libmount*
      - libsmartcols*
      - libuuid*
      - zchunk*
  - id: fedora
    baseurl: https://dl.fedoraproject.org/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/
    # These package names are already produced by Eternal. Hiding the Fedora
    # copies is what makes the build root consume the published Eternal
    # repository instead of only using it for metadata.
    exclude:
      - acl*
      - attr*
      - audit*
      - libacl*
      - libattr*
      - libcap*
      - libselinux*
      - libsepol*
      - libxcrypt*
      - pam*
      - ncurses*
      - zstd*
      - libzstd*
      - xz
      - xz-*
      - gmp*
      - mpfr*
      - libmpc*
      - isl*
      - kernel-headers*
      - bash
      - bash-binsh
      - binutils
      - coreutils
      - coreutils-single
      - diffutils
      - diffutils-*
      - filesystem
      - findutils
      - findutils-*
      - grep
      - grep-*
      - make
      - pcre2
      - pcre2-*
      - tar
      - tar-*
      - pkgconf
      - pkgconf-m4
      - pkgconf-pkg-config
      - libpkgconf
      - zlib
      - zlib-devel
      - zlib-static
      - zlib-ng-compat
      - zlib-ng-compat-devel
      - zlib-ng-compat-static
  - id: updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
    exclude:
      - acl*
      - attr*
      - audit*
      - libacl*
      - libattr*
      - libcap*
      - libselinux*
      - libsepol*
      - libxcrypt*
      - pam*
      - ncurses*
      - zstd*
      - libzstd*
      - xz
      - xz-*
      - gmp*
      - mpfr*
      - libmpc*
      - isl*
      - kernel-headers*
      - bash
      - bash-binsh
      - binutils
      - coreutils
      - coreutils-single
      - diffutils
      - diffutils-*
      - filesystem
      - findutils
      - findutils-*
      - grep
      - grep-*
      - make
      - pcre2
      - pcre2-*
      - tar
      - tar-*
      - pkgconf
      - pkgconf-m4
      - pkgconf-pkg-config
      - libpkgconf
      - zlib
      - zlib-devel
      - zlib-static
      - zlib-ng-compat
      - zlib-ng-compat-devel
      - zlib-ng-compat-static
  - id: eternal-toolchain
    baseurl: file://../.work/toolchain-repo
packages:
  install:
    - openssf-compiler-options
    - bash
    - bash-binsh
    - binutils
    - coreutils
    - findutils
    - gcc
    - make
    - patch
    - tar
    - gzip
    - sed
    - grep
    - gawk
    - diffutils
    - pkgconf
sbom: true
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64
