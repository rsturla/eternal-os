# The distribution profile: the repositories an Eternal system or image sees.
#
# The Eternal repository is versioned by releasever. The bootstrap
# repositories are still required while the base package set is not yet
# self-hosting; they are pinned to Fedora 44 literally so that `$releasever`
# keeps referring to Eternal's release. Remove them once every package in
# `eternal-base` has an in-tree recipe.
document: rpmx-profile
version: 1
name: eternal-rolling
releasever: "rolling"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora@sha256:f08613fffc95f5c85c019b2f4ac9e9fb9bb84b9cfd59275671b84169567b157e
repositories:
  - id: eternal
    # Prefer Eternal packages; Fedora fills gaps during bootstrap.
    priority: 10
    baseurl: https://packages.eternal.sturla.tech/$releasever/$basearch
  # Bootstrap repositories. Delete when self-hosting.
  - id: bootstrap
    baseurl: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/$basearch/os/
    # Use the same adopted package families as the bootstrap build profile.
    # Exact Fedora names can otherwise override versioned Eternal providers.
    exclude:
      - autoconf*
      - automake*
      - libtool*
      - perl*
      - texinfo*
      - glibc*
      - gcc
      - gcc-*
      - cpp
      - cpp-*
      - libgcc*
      - libgomp*
      - libstdc++*
      - libatomic*
      - acl*
      - attr*
      - audit*
      - libacl*
      - libattr*
      - libcap*
      - libselinux*
      - libsepol*
      - libxcrypt*
      - pam*
      - ncurses*
      - zstd*
      - libzstd*
      - xz
      - xz-*
      - gmp*
      - mpfr*
      - libmpc*
      - isl*
      - kernel-headers*
      - bash
      - bash-binsh
      - binutils
      - coreutils
      - coreutils-single
      - diffutils
      - diffutils-*
      - filesystem
      - findutils
      - findutils-*
      - grep
      - grep-*
      - make
      - pcre2
      - pcre2-*
      - tar
      - tar-*
      - pkgconf
      - pkgconf-m4
      - pkgconf-pkg-config
      - libpkgconf
      - zlib
      - zlib-devel
      - zlib-static
      - zlib-ng-compat
      - zlib-ng-compat-devel
      - zlib-ng-compat-static
  - id: bootstrap-updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
    exclude:
      - autoconf*
      - automake*
      - libtool*
      - perl*
      - texinfo*
      - glibc*
      - gcc
      - gcc-*
      - cpp
      - cpp-*
      - libgcc*
      - libgomp*
      - libstdc++*
      - libatomic*
      - acl*
      - attr*
      - audit*
      - libacl*
      - libattr*
      - libcap*
      - libselinux*
      - libsepol*
      - libxcrypt*
      - pam*
      - ncurses*
      - zstd*
      - libzstd*
      - xz
      - xz-*
      - gmp*
      - mpfr*
      - libmpc*
      - isl*
      - kernel-headers*
      - bash
      - bash-binsh
      - binutils
      - coreutils
      - coreutils-single
      - diffutils
      - diffutils-*
      - filesystem
      - findutils
      - findutils-*
      - grep
      - grep-*
      - make
      - pcre2
      - pcre2-*
      - tar
      - tar-*
      - pkgconf
      - pkgconf-m4
      - pkgconf-pkg-config
      - libpkgconf
      - zlib
      - zlib-devel
      - zlib-static
      - zlib-ng-compat
      - zlib-ng-compat-devel
      - zlib-ng-compat-static
packages:
  install:
    - eternal-base
    - openssf-compiler-options
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64
