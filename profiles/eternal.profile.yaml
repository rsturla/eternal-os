# The distribution profile: the repositories an Eternal system or image sees.
#
# The Eternal repository is versioned by releasever. The bootstrap
# repositories are still required while the base package set is not yet
# self-hosting; they are pinned to Fedora 44 literally so that `$releasever`
# keeps referring to Eternal's release. Remove them once every package in
# `eternal-base` has an in-tree recipe.
document: rpmx-profile
version: 1
name: eternal-rolling
releasever: "rolling"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora:44
repositories:
  - id: eternal
    baseurl: https://rsturla.github.io/eternal-os/$releasever/$basearch
  # Bootstrap repositories. Delete when self-hosting.
  - id: bootstrap
    metalink: https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
  - id: bootstrap-updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
packages:
  install:
    - eternal-base
    - openssf-compiler-options
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64

# Distribution policy that is not compiler hardening: optimisation, warnings,
# unwind tables, and the target ISA baseline. The OpenSSF hardening controls
# live in openssf-compiler-options from the Eternal repository. Its wrapper in /usr/local/bin applies the
# matching GCC spec, so a recipe opts out with
# GCC_SPEC_FILE=no-hardening.spec only when it cannot use the policy.
flags:
  cflags:
    - -O2
    - -g
    - -pipe
    - -Wall
    - -Werror=format-security
    - -fexceptions
    - -fasynchronous-unwind-tables
    - -grecord-gcc-switches
  cxxflags:
    - -O2
    - -g
    - -pipe
    - -Wall
    - -Werror=format-security
    - -fexceptions
    - -fasynchronous-unwind-tables
    - -grecord-gcc-switches
  arch:
    x86_64:
      cflags:
        - -march=x86-64-v2
        - -fcf-protection=full
      cxxflags:
        - -march=x86-64-v2
        - -fcf-protection=full
    aarch64:
      cflags:
        - -mbranch-protection=standard
      cxxflags:
        - -mbranch-protection=standard
