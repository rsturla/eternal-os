# The build root for the compiler-options package itself.
#
# This profile deliberately does not install `openssf-compiler-options` or use
# its specs: the package is built before it exists in the toolchain repository.
# It uses the stable Fedora seed shell and coreutils, not the packages that
# are about to be replaced during the self-hosting switch.
document: rpmx-profile
version: 1
name: bootstrap-toolchain
releasever: "44"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora@sha256:f08613fffc95f5c85c019b2f4ac9e9fb9bb84b9cfd59275671b84169567b157e
repositories:
  - id: fedora
    baseurl: https://dl.fedoraproject.org/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/
  - id: updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
packages:
  install:
    - bash
    - coreutils
    - gcc
    - make
sbom: true
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64
