# Repository-wide package metadata.
#
# A recipe inherits these values only when it omits the field. Keep this file
# for facts that are true for every Eternal package, not for upstream identity
# (license, CPE, upstream URL) or package-specific build settings.
schema: 1
package:
  # Fallback for packages with no upstream source of their own. Packages with
  # an archive or git source derive their timestamp from that source instead.
  source-date-epoch: 1704067200
  maintainers:
    - name: Eternal Linux maintainers
      email: maintainers@eternal.sturla.tech
