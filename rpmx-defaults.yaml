# Repository-wide package metadata.
#
# A recipe inherits these values only when it omits the field. Keep this file
# for facts that are true for every Eternal package, not for upstream identity
# (license, CPE, upstream URL) or package-specific build settings.
schema: 1
metadata:
  python:
    # Adding a supported stream does not promote it to the distro default.
    default-stream: "3.14"
package:
  # Fallback for packages with no upstream source of their own. Packages with
  # an archive or git source derive their timestamp from that source instead.
  source-date-epoch: 1704067200
  maintainers:
    - name: Eternal Linux maintainers
      email: maintainers@eternal.sturla.tech
build:
  environment:
    # The compiler policy package installs its wrappers under /usr/libexec.
    # Put that directory before /usr/bin so every build sees the policy.
    PATH: /usr/libexec/eternal/gcc/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

dependencies:
  # Every package installs into the layout, so every output requires it. An
  # output that ships no files drops it with `dependencies.exclude`.
  run: [filesystem]
