# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Disable optional host services and install private helpers under libexec/pam.
# Keep PAM modules separate from the linkable runtime libraries.
schema: 1
package:
  name: pam
  version: 1.7.3
  release: 1
  summary: Pluggable authentication modules
  description: Pluggable authentication modules.
  license: BSD-3-Clause AND GPL-2.0-or-later
  upstream: https://github.com/linux-pam/linux-pam
  cpe:
    vendor: linux-pam
    product: linux-pam
sources:
- name: pam-1.7.3.tar.xz
  kind: archive
  digest: sha512:1f0946461b879886ecade76793377d97d6a3036960196e37bb4fb05d6e30552e17fe1e652c6b0e7b7b1ce159d75c00f35df1c197cfd6b0012e7e3bb1bd42f144
  locators:
  - kind: https
    url: https://github.com/linux-pam/linux-pam/releases/download/v1.7.3/Linux-PAM-1.7.3.tar.xz
  extract:
    format: tar.xz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - meson
  - ninja
  - bash
  - coreutils
  - pkgconf
  - bison
  - flex
  sysroot:
  - libxcrypt-devel
  - audit-libs-devel
  - libselinux-devel
  pipeline:
  - uses: meson/setup
    with:
      args:
      - -Di18n=disabled
      - -Ddocs=disabled
      - -Dexamples=false
      - -Daudit=enabled
      - -Dselinux=enabled
      - -Deconf=disabled
      - -Dlogind=disabled
      - -Delogind=disabled
      - -Dnis=disabled
      - -Dpam_userdb=disabled
      - -Dpwaccess=disabled
      - --sbindir=libexec/pam
      - --sysconfdir=/etc
  - uses: meson/compile
  - uses: meson/install
  - runs: |
      install -d "$STAGE/usr/bin"
      mv "$STAGE/usr/libexec/pam/faillock" "$STAGE/usr/bin/faillock"
      mv "$STAGE/usr/libexec/pam/pam_timestamp_check" "$STAGE/usr/bin/pam_timestamp_check"
      rm -f "$STAGE/usr/lib/systemd/system/pam_namespace.service"
  - uses: license/copy
    with:
      files:
      - Copyright
      - COPYING
      outputs:
      - pam
      - pam-libs
      - pam-devel
  - uses: strip
outputs:
- name: pam
  files:
    license:
    - /usr/share/licenses/pam/**
  dependencies:
    run:
    - pam-libs = ${package.version}-${package.release}
    - bash-binsh
    - audit-libs
    - libselinux
    - libxcrypt
  tests:
  - name: modules
    stage: installed
    script: |
      test -f /usr/lib/security/pam_permit.so || test -f /usr/lib64/security/pam_permit.so
      test -x /usr/libexec/pam/unix_chkpwd
- name: pam-libs
  files:
    license:
    - /usr/share/licenses/pam-libs/**
    include:
    - /usr/lib*/libpam.so.*
    - /usr/lib*/libpam_misc.so.*
    - /usr/lib*/libpamc.so.*
    - /usr/share/licenses/pam-libs/**
  tests:
  - name: runtime-linkage
    stage: installed
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libpam.so.*", "libpam_misc.so.*", "libpamc.so.*"]
- name: pam-devel
  files:
    license:
    - /usr/share/licenses/pam-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/pam-devel/**
    exclude:
    - /usr/lib*/security/**
  dependencies:
    run:
    - pam-libs = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists pam
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags pam) "$TEST_FILES/behavior.c" $(pkg-config --libs pam) -o behavior
      ./behavior
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
    with:
      paths:
      - /usr/lib64/libpam.so.0.85.1
      - /usr/lib/libpam.so.0.85.1
- name: authentication-stacks
  stage: installed
  packages:
  - gcc
  - glibc-devel
  files: tests
  script: |
    gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror "$TEST_FILES/authentication.c" -lpam -o authentication
    ./authentication "$TEST_FILES/pam.d" permit
    ./authentication "$TEST_FILES/pam.d" deny
