# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
schema: 1
package:
  name: automake
  version: '1.20'
  release: 1
  summary: GNU Makefile generator
  description: GNU Makefile generator.
  license: GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-3.0-or-later
    AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Texinfo-exception
    AND GFDL-1.3-or-later AND FSFAP AND FSFUL AND FSFULLR AND FSFULLRWD AND X11 AND LicenseRef-Public-Domain
  upstream: https://www.gnu.org/software/automake/
  cpe:
    vendor: gnu
    product: automake
sources:
- name: automake-1.20.tar.xz
  kind: archive
  digest: sha512:10a1836e4dc50b2b75da8892ce0a21451d2c001e46344c69d29c7d0c26d4910ba035c115aca55b9913761f7ff6d861db0619a0ff9c23be833d84c101867efadd
  locators:
  - kind: https
    url: https://ftp.gnu.org/gnu/automake/automake-1.20.tar.xz
  - kind: https
    url: https://mirrors.kernel.org/gnu/automake/automake-1.20.tar.xz
  extract:
    format: tar.xz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  dependencies:
    tools:
    - bash
    - coreutils
    - make
    - m4
    - perl
    - autoconf
  pipeline:
  - uses: autotools/configure
  - uses: autotools/build
  - uses: autotools/install
  - runs: |
      find "$STAGE" -name "*.la" -delete
      rm -f "$STAGE/usr/share/info/dir"
  - uses: license/copy
    with:
      files:
      - COPYING
      outputs:
      - automake
      - automake-doc
outputs:
- name: automake
  files:
    license:
    - /usr/share/licenses/automake/**
  dependencies:
    run:
    - autoconf
    - perl
    - filesystem
  tests:
  - name: generate
    stage: installed
    environment:
      contents:
        packages:
        - make
        - tar
        - gzip
    argv:
    - bash
    - -eu
    - -c
    - |
      mkdir /tmp/automake-test
      cd /tmp/automake-test
      printf 'AC_INIT([smoke], [1])\nAM_INIT_AUTOMAKE([foreign])\nAC_CONFIG_FILES([Makefile])\nAC_OUTPUT\n' > configure.ac
      printf 'EXTRA_DIST = configure.ac\n' > Makefile.am
      aclocal
      autoconf
      automake --add-missing --copy
      ./configure
      make dist
- name: automake-doc
  files:
    license:
    - /usr/share/licenses/automake-doc/**
    include:
    - '@doc'
    - '@man'
    - '@info'
    - /usr/share/licenses/automake-doc/**
  dependencies:
    run:
    - filesystem
