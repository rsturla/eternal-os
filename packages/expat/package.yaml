# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# XML parser library. A build dependency for gettext and other tooling in the
# minimal Eternal userland.
schema: 2

package:
  name: expat
  version: "2.10.0"
  release: 1
  summary: XML parser library
  description: |
    Expat is a stream-oriented XML parser library written in C.
  license: MIT
  upstream: https://libexpat.github.io/
  cpe:
    vendor: libexpat_project
    product: libexpat

sources:
  - name: expat-2.10.0.tar.xz
    kind: archive
    digest: "sha512:bd61f361d823f67586dad246fa4d4abbe3d22f5a0f9a28401e7a2fc96753d5bae33fbe4068fae72f016998d0da9d8c92edc4abd2fe8a8e4aafc775a8ab547c44"
    locators:
      - kind: https
        url: https://github.com/libexpat/libexpat/releases/download/R_2_10_0/expat-2.10.0.tar.xz
      - kind: https
        url: https://downloads.sourceforge.net/project/expat/expat/2.10.0/expat-2.10.0.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, gcc-c++, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --without-docbook
          - --without-examples
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [expat, expat-libs, expat-devel, expat-doc]
    - uses: strip

  tests:
    - name: upstream
      packages:
        - diffutils
      artifacts:
        - test-suite.log
        - tests/test-suite.log
      pipeline:
        - uses: make/check

outputs:
  - name: expat
    summary: XML parser tools
    files:
      license:
        - /usr/share/licenses/expat/COPYING
    dependencies:
      run:
        - expat-libs = ${package.version}-${package.release}
    tests:
      - name: installed
        script: |
          trap 'printf "line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          xmlwf -v
          printf '<root/>' | xmlwf
          printf '<root><child></root>' > malformed.xml
          status=0
          xmlwf malformed.xml > diagnostic 2>&1 || status=$?
          test "$status" = 2
          diagnostic=$(<diagnostic)
          [[ $diagnostic == *'mismatched tag'* ]]
  - name: expat-libs
    summary: Expat runtime library
    files:
      include:
        - /usr/lib*/libexpat.so.*
        - /usr/share/licenses/expat-libs/COPYING
      license:
        - /usr/share/licenses/expat-libs/COPYING
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libexpat.so.*"]
  - name: expat-devel
    summary: Expat development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/expat-devel/COPYING
      license:
        - /usr/share/licenses/expat-devel/COPYING
    dependencies:
      run:
        - expat-libs = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists expat
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags expat) "$TEST_FILES/behavior.c" $(pkg-config --libs expat) -o behavior
          ./behavior
  - name: expat-doc
    summary: Expat documentation
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/expat-doc/COPYING
      license:
        - /usr/share/licenses/expat-doc/COPYING
