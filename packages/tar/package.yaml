# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GNU tar archiver. Part of the minimal Eternal userland and the
# bootstrap tool set. The source is the upstream release tarball.
schema: 1

package:
  name: tar
  version: "1.35"
  release: 1
  summary: GNU tar archiver
  description: |
    GNU tar creates, lists and extracts tar archives.
  license: GPL-3.0-or-later
  upstream: https://www.gnu.org/software/tar/
  cpe:
    vendor: gnu
    product: tar

sources:
  - name: tar-1.35.tar.xz
    kind: archive
    digest: "sha512:8b84ed661e6c878fa33eb5c1808d20351e6f40551ac63f96014fb0d0b9c72d5d94d8865d39e36bcb184fd250f84778a3b271bbd8bd2ceb69eece0c3568577510"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/tar/tar-1.35.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  dependencies:
    tools: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
    - uses: autotools/build
    - uses: autotools/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [tar, tar-doc]
    - uses: strip

outputs:
  - name: tar
    summary: GNU tar archiver
    files:
      license:
        - /usr/share/licenses/tar/COPYING
    tests:
      - name: installed
        stage: installed
        argv:
          - sh
          - -c
          - |
            mkdir -p tree
            printf 'content\n' > tree/file
            tar -cf archive.tar tree
            tar -tf archive.tar > list
            test "$(wc -l < list)" -eq 2
            mkdir out
            tar -xf archive.tar -C out
            test "$(cat out/tree/file)" = content

  - name: tar-doc
    summary: GNU tar archiver documentation
    files:
      include:
        - "@man"
        - "@info"
        - "@doc"
        - /usr/share/licenses/tar-doc/COPYING
      license:
        - /usr/share/licenses/tar-doc/COPYING
    dependencies:
      run:
        - filesystem
