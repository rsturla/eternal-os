# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GNU Bison parser generator. glibc, GCC, binutils and bash all run bison (or
# ship a parser that was generated by it), so it belongs to the toolchain wave.
# Its only build dependency is m4, which Eternal already produces.
#
# The release tarball ships the pre-generated parser and the info page, so the
# build does not need flex, texinfo or help2man. Those belong to a git
# checkout, not to the artifact upstream publishes.
schema: 1

package:
  name: bison
  version: "3.8.2"
  release: 1
  summary: The GNU general-purpose parser generator
  description: |
    GNU Bison is a general-purpose parser generator that converts an
    annotated context-free grammar into a deterministic LR or GLR parser.
    It is backward compatible with yacc.
  license: GPL-3.0-or-later
  upstream: https://www.gnu.org/software/bison/
  cpe:
    vendor: gnu
    product: bison

sources:
  - name: bison-3.8.2.tar.xz
    kind: archive
    digest: "sha512:d4d23af6671406e97257892f90651b67f2ab95219831372be032190b7156c10a3435d457857e677445df8b2327aacccc15344acbbc3808a6f332a93cce23b444"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/bison/bison-3.8.2.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, m4, sed, grep, diffutils]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-nls
    - uses: make/build
    - uses: make/install
    - runs: |
        set -eu
        rm -f "$STAGE/usr/share/info/dir"
        # The yacc compatibility command is kept, but its `-ly` static archive
        # is not: a static link needs a -devel/-static output pair and nothing
        # in Eternal links it. A later user adds both outputs.
        rm -f "$STAGE"/usr/lib*/liby.a
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [bison, bison-doc]
    - uses: strip

outputs:
  - name: bison
    summary: The GNU general-purpose parser generator
    files:
      license:
        - /usr/share/licenses/bison/COPYING
    dependencies:
      run:
        - filesystem
        - m4
    tests:
      - name: installed
        stage: installed
        packages: [bash-binsh, coreutils, gcc, m4]
        argv:
          - sh
          - -c
          - |
            bison --version | head -1 | grep -q '3\.8\.2'
            cat > calc.y <<'EOF'
            %token NUMBER
            %%
            exp: NUMBER;
            %%
            EOF
            bison -o calc.c calc.y
            test -s calc.c
            yacc -o yacc.c calc.y
            test -s yacc.c

  - name: bison-doc
    summary: GNU Bison documentation
    files:
      include:
        - "@man"
        - "@info"
        - "@doc"
        - /usr/share/licenses/bison-doc/COPYING
      license:
        - /usr/share/licenses/bison-doc/COPYING
    dependencies:
      run:
        - filesystem

tests:
  - name: hardening
    stage: build
    pipeline:
      - uses: test/hardening-check
