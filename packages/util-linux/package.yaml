# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Random collection of Linux utilities. This recipe builds the base tools and
# the libblkid, libfdisk, libmount, libsmartcols and libuuid runtime libraries.
# Login and su-like tools are left to shadow so the two packages do not fight
# over /usr/bin.
schema: 2

package:
  name: util-linux
  version: "2.42.4"
  release: 1
  summary: Collection of Linux utilities
  description: |
    util-linux provides the standard Linux system utilities for mounting,
    block devices, namespaces, terminals and process control, together with
    the libblkid, libfdisk, libmount, libsmartcols and libuuid libraries.
  license: GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause AND MIT
  upstream: https://github.com/util-linux/util-linux
  cpe:
    vendor: kernel
    product: util-linux

sources:
  - name: util-linux-2.42.4.tar.xz
    kind: archive
    digest: "sha512:3aea9ebd835b353e0c73356f0e4543ba4c3ad448e4f50a386c35cfaac81cbf45425b1a6c7552ed5673580acf2b58f8af2792f5b3019ffe478edd77c7ebf444dc"
    locators:
      - kind: https
        url: https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf]
  sysroot: [libselinux-devel, ncurses-devel, pam-devel, zlib-devel]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --disable-nls
          - --disable-tls
          - --disable-kill
          - --disable-wall
          - --disable-makeinstall-chown
          - --disable-makeinstall-setuid
          - --disable-makeinstall-tty-setgid
          - --disable-pam-lastlog2
          - --without-python
          - --without-econf
          - --without-systemd
          - --without-udev
          - --disable-libmount-udev-support
          - --with-selinux
          - --bindir=/usr/bin
          - --sbindir=/usr/bin
    - uses: make/build
    - uses: make/install
    - runs: |
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files:
          - COPYING
          - Documentation/licenses/COPYING.LGPL-2.1-or-later
          - Documentation/licenses/COPYING.BSD-3-Clause
        outputs:
          - util-linux
          - libblkid
          - libfdisk
          - libmount
          - libsmartcols
          - libuuid
          - util-linux-devel
          - util-linux-doc
    - uses: strip

outputs:
  - name: util-linux
    summary: Collection of Linux utilities
    files:
      license:
        - /usr/share/licenses/util-linux/**
    dependencies:
      run:
        - libblkid = ${package.version}-${package.release}
        - libmount = ${package.version}-${package.release}
        - libsmartcols = ${package.version}-${package.release}
        - libuuid = ${package.version}-${package.release}
        - pam
    tests:
      - name: offline-utilities
        packages:
          - coreutils
        files: tests
        script: |
          bash "$TEST_FILES/offline-utilities.sh"

  - name: libblkid
    summary: Block device identification library
    files:
      include:
        - /usr/lib*/libblkid.so.*
        - /usr/share/licenses/libblkid/**
      license:
        - /usr/share/licenses/libblkid/**
    tests:
      - name: minimal-runtime-dependencies
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libblkid.so.[0-9]*"]
      - name: blkid-runtime
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/blkid-runtime.py"

  - name: libfdisk
    summary: Partitioning library
    files:
      include:
        - /usr/lib*/libfdisk.so.*
        - /usr/share/licenses/libfdisk/**
      license:
        - /usr/share/licenses/libfdisk/**
    tests:
      - name: minimal-runtime-dependencies
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libfdisk.so.[0-9]*"]
      - name: fdisk-runtime
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/fdisk-runtime.py"

  - name: libmount
    summary: Block device mounting library
    files:
      include:
        - /usr/lib*/libmount.so.*
        - /usr/share/licenses/libmount/**
      license:
        - /usr/share/licenses/libmount/**
    tests:
      - name: minimal-runtime-dependencies
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libmount.so.[0-9]*"]
      - name: mount-runtime
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/mount-runtime.py"

  - name: libsmartcols
    summary: Table formatting library
    files:
      include:
        - /usr/lib*/libsmartcols.so.*
        - /usr/share/licenses/libsmartcols/**
      license:
        - /usr/share/licenses/libsmartcols/**
    tests:
      - name: minimal-runtime-dependencies
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libsmartcols.so.[0-9]*"]
      - name: smartcols-runtime
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/smartcols-runtime.py"

  - name: libuuid
    summary: Universally unique identifier library
    files:
      include:
        - /usr/lib*/libuuid.so.*
        - /usr/share/licenses/libuuid/**
      license:
        - /usr/share/licenses/libuuid/**
    tests:
      - name: minimal-runtime-dependencies
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libuuid.so.[0-9]*"]
      - name: uuid-runtime
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/uuid-runtime.py"

  - name: util-linux-devel
    summary: Development files for util-linux libraries
    files:
      include:
        - "@dev"
        - /usr/share/licenses/util-linux-devel/**
      license:
        - /usr/share/licenses/util-linux-devel/**
    dependencies:
      run:
        - libblkid = ${package.version}-${package.release}
        - libfdisk = ${package.version}-${package.release}
        - libmount = ${package.version}-${package.release}
        - libsmartcols = ${package.version}-${package.release}
        - libuuid = ${package.version}-${package.release}
      provides:
        - libblkid-devel = ${package.version}-${package.release}
        - libfdisk-devel = ${package.version}-${package.release}
        - libmount-devel = ${package.version}-${package.release}
        - libsmartcols-devel = ${package.version}-${package.release}
        - libuuid-devel = ${package.version}-${package.release}
    tests:
      - name: libraries-api
        packages:
          - gcc
          - glibc-devel
          - coreutils
          - pkgconf
        files: tests
        script: |
          bash "$TEST_FILES/libraries-api.sh"

  - name: util-linux-doc
    summary: Documentation for util-linux
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/util-linux-doc/**
      license:
        - /usr/share/licenses/util-linux-doc/**
