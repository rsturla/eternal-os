# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Extended attribute utilities and the libattr runtime. Coreutils and tar use
# libattr when copying extended attributes.
schema: 1

package:
  name: attr
  version: "2.6.0"
  release: 1
  summary: Utilities for managing filesystem extended attributes
  description: |
    The attr package contains the getfattr and setfattr utilities and the
    libattr library used to manipulate filesystem extended attributes.
  license: GPL-2.0-or-later AND LGPL-2.1-or-later
  upstream: https://savannah.nongnu.org/projects/attr/
  cpe:
    vendor: attr_project
    product: attr

sources:
  - name: attr-2.6.0.tar.gz
    kind: archive
    digest: "sha512:ad1f8a11bc7e9f119b213e62c35beb0d2f0a114c9fad9833158bd3ccafe223277f9e69502e72a9e20b10ef04fd1b74153ae75e2979bcb452981ae567fff6795b"
    locators:
      - kind: https
        url: https://download.savannah.nongnu.org/releases/attr/attr-2.6.0.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, gettext, libtool]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --disable-nls
    - uses: make/build
    - uses: make/install
    - runs: |
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files: [doc/COPYING, doc/COPYING.LGPL]
        outputs: [attr, libattr, libattr-devel, attr-doc]
    - uses: strip

outputs:
  - name: attr
    summary: Extended attribute utilities
    files:
      license:
        - /usr/share/licenses/attr/**
    dependencies:
      run:
        - libattr = ${package.version}-${package.release}
    tests:
      - name: extended-attributes
        stage: installed
        packages:
          - coreutils
        files: tests
        script: |
          bash "$TEST_FILES/extended-attributes.sh"

  - name: libattr
    summary: Extended attribute runtime library
    files:
      include:
        - /usr/lib*/libattr.so.*
        - /usr/share/licenses/libattr/**
      license:
        - /usr/share/licenses/libattr/**
    tests:
      - name: minimal-runtime-dependencies
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libattr.so.[0-9]*"]
      - name: runtime
        stage: installed
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/runtime.py"

  - name: libattr-devel
    summary: Development files for libattr
    files:
      include:
        - "@dev"
        - /usr/share/licenses/libattr-devel/**
      license:
        - /usr/share/licenses/libattr-devel/**
    dependencies:
      run:
        - libattr = ${package.version}-${package.release}
    tests:
      - name: attr-api
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - coreutils
        files: tests
        script: |
          bash "$TEST_FILES/attr-api.sh"

  - name: attr-doc
    summary: Documentation for attr
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/attr-doc/**
      license:
        - /usr/share/licenses/attr-doc/**
