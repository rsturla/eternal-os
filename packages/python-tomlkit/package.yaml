# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/py3-tomlkit.yaml
schema: 1
package:
  name: python-tomlkit
  version: 0.15.2
  release: 2
  summary: TOML parser and writer that preserves formatting
  license: MIT
  upstream: https://github.com/python-poetry/tomlkit
sources:
- name: tomlkit-0.15.2.tar.gz
  kind: archive
  digest: sha512:9b566b30d7e5c21bbfd6b2b0002b2bf668628401f6596f0df73747efc170e93fb9e0b2e9304cedcc28bd7a8776e09ab9fc5c9425fb55b68773db39251277cd52
  locators:
  - kind: https
    url: https://files.pythonhosted.org/packages/08/72/fc01563df95c189a9f65850096bdc205bc2fe37da6c740cd64afaf18d07e/tomlkit-0.15.2.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
matrix:
  axes:
    python:
    - value: '3.11'
      version: '3.11'
      slug: py311
      package: python-3.11
    - value: '3.12'
      version: '3.12'
      slug: py312
      package: python-3.12
    - value: '3.13'
      version: '3.13'
      slug: py313
      package: python-3.13
    - value: '3.14'
      version: '3.14'
      slug: py314
      package: python3.14
    - value: '3.15'
      version: '3.15'
      slug: py315
      package: python-3.15
  max-cells: 5
  release-suffix: true
build:
  root:
    profile: ../../profiles/bootstrap-python.profile.yaml
  packages:
  - bash
  - coreutils
  - python3.14
  - ${matrix.python.package}
  - python-3.14-poetry-core
  pipeline:
  - uses: python/build-wheel
    with:
      python: python3.14
      build-package: python-3.14-build
  - uses: python/install-wheel
    with:
      python: /usr/bin/python${matrix.python.version}
      pip-python: python3.14
      script-version: ${matrix.python.version}
      pip-package: python-3.14-pip
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - python-${matrix.python.version}-tomlkit
outputs:
- name: python-${matrix.python.version}-tomlkit
  arch: noarch
  files:
    license:
    - /usr/share/licenses/python-${matrix.python.version}-tomlkit/**
  tests:
  - name: behavior
    stage: installed
    files: tests
    script: |
      /usr/bin/python${matrix.python.version} -I "$TEST_FILES/test_behavior.py" "${matrix.python.version}" "tomlkit" "${package.version}"
