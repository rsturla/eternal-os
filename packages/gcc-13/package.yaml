# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GCC 13, one of the supported side-by-side compiler streams. The version
# is part of the package name so streams can be installed alongside each
# other. `gcc-13-default` provides the unversioned `gcc` capability and the
# stable command names; only one default package can own those links.
#
# The compiler is built without bootstrap (the seed compiler is the build
# compiler) and without Fortran for the first import. The runtime libraries are
# split the same way Wolfi splits them: libstdc++, libatomic and the compiler
# proper are independent outputs.
schema: 2

package:
  name: gcc-13
  version: "13.5.0"
  release: 2
  summary: The GNU Compiler Collection, version 13
  description: |
    GCC 13 provides the C and C++ compilers, the GNU runtime libraries and the
    compiler support files used to build Eternal Linux.
  license: GPL-3.0-or-later WITH GCC-exception-3.1
  upstream: https://gcc.gnu.org/
  cpe:
    vendor: gnu
    product: gcc

sources:
  - name: gcc-13.5.0.tar.xz
    kind: archive
    digest: "sha512:709237ff8f10d46eb10cad53a71bdcacbd3d56f4559e9a5bb3323f743fdba78b7e505586135560b27e88320927a065ec4f5e45273d5504b542f67c7326eb683c"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/gcc/gcc-13.5.0/gcc-13.5.0.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/gcc/gcc-13.5.0/gcc-13.5.0.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - gcc-c++
    - make
    - bash
    - coreutils
    - bison
    - flex
    - file
    - gawk
    - sed
    - grep
    - diffutils
    - findutils
    - gettext
    - python3
    - texinfo
    - patch
    - tar
    - gzip
  sysroot:
    - libstdc++-devel
    - gmp-devel
    - mpfr-devel
    - libmpc-devel
    - isl-devel
    - zlib-devel
    - kernel-headers
    - glibc-devel
  environment:
    # Build this compiler with the policy it will itself apply, but keep its
    # own diagnostics non-fatal. The wrapper applies the arch baseline too.
    GCC_SPEC_FILE: openssf-soft-format-13.spec
  pipeline:
    - runs: |
        mkdir build
    - uses: autotools/configure
      with:
        dir: build
        configure: ../configure
        args:
          - --program-suffix=-13
          - '--with-pkgversion="Eternal gcc-13-2"'
          - --with-glibc-version=2.44
          - --with-sysroot=/
          - --enable-languages=c,c++
          - --disable-bootstrap
          - --disable-nls
          - --disable-werror
          - --disable-multilib
          - --disable-libsanitizer
          - --disable-libquadmath
          - --enable-shared
          - --enable-threads=posix
          - --enable-tls
          - --enable-default-pie
          - --enable-default-ssp
          # The in-tree compiler builds target CRT objects outside the wrapper.
          - '$(if [ "$RPMX_TARGET_ARCH" = aarch64 ]; then printf %s --enable-standard-branch-protection; fi)'
          - --enable-initfini-array
          - --enable-gnu-indirect-function
          - --enable-gnu-unique-object
          - --with-system-zlib
          - --with-linker-hash-style=gnu
    - uses: make/build
      with:
        dir: build
    - uses: make/install
      with:
        dir: build
    - runs: |
        # Like Wolfi and Fedora, drop libtool archives. They embed build paths
        # and are not needed at runtime or link time.
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files: [COPYING3, COPYING3.LIB, COPYING.RUNTIME]
        outputs: [gcc-13, gcc-13-default, libstdc++-13, libstdc++-13-devel, libstdc++-13-static, libatomic-13, gcc-13-doc]
    - runs: |
        # The default package owns the stable command names. The versioned
        # names stay with gcc-13.
        install -d "$STAGE/usr/bin"
        for name in cpp gcc g++ gcc-ar gcc-nm gcc-ranlib gcov gcov-dump gcov-tool lto-dump; do
          ln -sf "$name-13" "$STAGE/usr/bin/$name"
        done
        # GCC does not install cc-13 or c++-13; point the generic names at the
        # compilers that actually exist.
        ln -sf gcc-13 "$STAGE/usr/bin/cc"
        ln -sf g++-13 "$STAGE/usr/bin/c++"
        ln -sf gcc-13 "$STAGE/usr/bin/c89"
        ln -sf gcc-13 "$STAGE/usr/bin/c99"
    - uses: strip

  tests:
    - name: upstream
      environment:
        USER: rpmx-test
        LOGNAME: rpmx-test
      packages:
        - dejagnu
        - expect
      pipeline:
        - runs: |
            status=0
            make -C build -j2 -k check-gcc check-target-libstdc++-v3 || status=$?
            mkdir -p upstream-reports
            find build -type f \( -name '*.sum' -o -name '*.log' \) -exec cp --parents '{}' upstream-reports/ \;
            test "$status" = 0
            for suite in gcc g++ libstdc++; do
              find build -type f -name "$suite.sum" -exec cat '{}' + > "upstream-reports/$suite.summary"
              grep -E '# of expected passes[[:space:]]+[1-9][0-9]*' "upstream-reports/$suite.summary"
              if grep -E '^(FAIL|XPASS|ERROR|UNRESOLVED):' "upstream-reports/$suite.summary"; then
                echo "unexpected DejaGNU result in $suite" >&2
                exit 1
              fi
            done
      artifacts:
        - upstream-reports
      timeout: 4h

outputs:
  - name: gcc-13
    summary: GCC 13 compiler and runtime
    # Main package: driver, cc1/cc1plus, runtime libraries, compiler
    # static archives and the license. libgcc.a and friends stay here because
    # GCC needs them at link time, even in the main package.
    files:
      license:
        - /usr/share/licenses/gcc-13/COPYING3
        - /usr/share/licenses/gcc-13/COPYING3.LIB
        - /usr/share/licenses/gcc-13/COPYING.RUNTIME
    lint:
      allow:
        - static-archive
    dependencies:
      run:
        - binutils
        - glibc-devel
        - libstdc++-13 = ${package.version}-${package.release}
      provides:
        - gcc-13 = ${package.version}-${package.release}

    tests:
      - name: c-runtime
        packages:
          - bash
          - coreutils
          - grep
        files: tests
        script: |
          for optimization in -O0 -O2 -O3 -Os; do
            gcc-13 -std=c11 "$optimization" -Wall -Wextra -Werror -pthread "$TEST_FILES/runtime.c" -o runtime
            ./runtime
          done
          gcc-13 -fopenmp -O2 "$TEST_FILES/openmp.c" -o openmp
          ./openmp
          cp "$TEST_FILES/runtime.c" coverage.c
          gcc-13 --coverage -pthread coverage.c -o coverage
          ./coverage
          gcov-13 coverage.c
          grep -E '^[[:space:]]*1:[[:space:]]*[0-9]+:.*puts\("c-runtime-ok"\)' coverage.c.gcov
        artifacts:
          - coverage.c.gcov
      - name: linker-lto-and-diagnostics
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          gcc-13 -O2 -flto -c "$TEST_FILES/library.c" -o library.o
          gcc-ar-13 rcs libprobe.a library.o
          gcc-ranlib-13 libprobe.a
          gcc-13 -flto "$TEST_FILES/main.c" libprobe.a -o linked
          ./linked
          gcc-13 -fPIC -shared "$TEST_FILES/library.c" -o libprobe.so
          gcc-13 "$TEST_FILES/main.c" -L. -lprobe -Wl,-rpath,'$ORIGIN' -o dynamic
          ./dynamic
          if gcc-13 -Werror -c "$TEST_FILES/invalid.c" -o invalid.o >invalid.stdout 2>invalid.stderr; then
            echo 'invalid C unexpectedly compiled'; exit 1
          fi
          case "$(<invalid.stderr)" in
            *missing_identifier*) ;;
            *) echo 'compiler did not diagnose missing_identifier' >&2; exit 1 ;;
          esac
          gcc-13 -E "$TEST_FILES/main.c" > preprocessed.c
          gcc-13 preprocessed.c libprobe.a -o preprocessed
          ./preprocessed
        artifacts:
          - invalid.stderr
      - name: target-runtime-branch-protection
        packages: [bash, binutils, coreutils, grep]
        files: tests
        script: |
          bash "$TEST_FILES/branch-protection.sh" /usr/bin/gcc-13
        artifacts:
          - branch-protection
      - name: runtime-closure
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libgcc_s.so.*", "libgomp.so.*", "libitm.so.*"]
  - name: gcc-13-default
    summary: Stable command names for GCC 13
    files:
      include:
        - /usr/bin/c++
        - /usr/bin/c89
        - /usr/bin/c99
        - /usr/bin/cc
        - /usr/bin/cpp
        - /usr/bin/g++
        - /usr/bin/gcc
        - /usr/bin/gcc-ar
        - /usr/bin/gcc-nm
        - /usr/bin/gcc-ranlib
        - /usr/bin/gcov
        - /usr/bin/gcov-dump
        - /usr/bin/gcov-tool
        - /usr/bin/lto-dump
        - /usr/share/licenses/gcc-13-default/**
      license:
        - /usr/share/licenses/gcc-13-default/COPYING3
        - /usr/share/licenses/gcc-13-default/COPYING3.LIB
        - /usr/share/licenses/gcc-13-default/COPYING.RUNTIME
    dependencies:
      run:
        - gcc-13 = ${package.version}-${package.release}
        - libstdc++-13-devel = ${package.version}-${package.release}
      conflicts:
        - gcc-14-default
        - gcc-15-default
        - gcc-16-default
      provides:
        - gcc = ${package.version}-${package.release}
        - gcc-c++ = ${package.version}-${package.release}
        - cpp = ${package.version}-${package.release}
        - cc = ${package.version}-${package.release}

    tests:
      - name: default-command-links
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          for command in gcc cc c89 c99; do
           test "$(readlink /usr/bin/$command)" = gcc-13
           "$command" -std=c11 -pthread "$TEST_FILES/runtime.c" -o "probe-$command"
           ./"probe-$command"
          done
          for command in g++ c++; do
           test "$(readlink /usr/bin/$command)" = g++-13
           "$command" -std=c++17 -pthread "$TEST_FILES/containers.cc" -o "probe-$command"
           output=$(./"probe-$command")
           test "$output" = cxx-runtime-ok
          done
  - name: libstdc++-13
    summary: GNU Standard C++ Library
    files:
      include:
        - /usr/lib*/libstdc++.so.*
        - /usr/share/licenses/libstdc++-13/**
      license:
        - /usr/share/licenses/libstdc++-13/COPYING3
        - /usr/share/licenses/libstdc++-13/COPYING3.LIB
        - /usr/share/licenses/libstdc++-13/COPYING.RUNTIME
    dependencies:
      provides:
        - libstdc++ = ${package.version}-${package.release}
        - libstdc++-13 = ${package.version}-${package.release}

    tests:
      - name: containers-exceptions-and-threads
        packages:
          - bash
          - gcc-13
          - libstdc++-13-devel
        files: tests
        script: |
          g++-13 -std=c++17 -O2 -Wall -Wextra -Werror -pthread "$TEST_FILES/containers.cc" -o containers
          ./containers
      - name: runtime-closure
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libstdc++.so.*"]
  - name: libstdc++-13-devel
    summary: GNU Standard C++ Library development files
    files:
      include:
        - /usr/include/c++/**
        - /usr/lib*/libstdc++.so
        - /usr/lib/gcc/**/libstdc++*
        - /usr/lib/gcc/**/include/c++/**
        - /usr/share/gcc-13/**
        - /usr/share/licenses/libstdc++-13-devel/**
      exclude:
        - /usr/lib*/lib*.a
        - /usr/lib/gcc/**/libstdc++*.a
        - /usr/lib/gcc/**/libsupc++.a
      license:
        - /usr/share/licenses/libstdc++-13-devel/COPYING3
        - /usr/share/licenses/libstdc++-13-devel/COPYING3.LIB
        - /usr/share/licenses/libstdc++-13-devel/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++-13 = ${package.version}-${package.release}
        - glibc-devel
      provides:
        - libstdc++-devel = ${package.version}-${package.release}

    tests:
      - name: containers-exceptions-and-threads
        packages:
          - bash
          - gcc-13
        files: tests
        script: |
          g++-13 -std=c++17 -O2 -Wall -Wextra -Werror -pthread "$TEST_FILES/containers.cc" -o containers
          ./containers
  - name: libstdc++-13-static
    summary: GNU Standard C++ Library static archives
    files:
      include:
        - /usr/lib*/libstdc++.a
        - /usr/lib/gcc/**/libstdc++*.a
        - /usr/lib/gcc/**/libsupc++.a
        - /usr/share/licenses/libstdc++-13-static/**
      license:
        - /usr/share/licenses/libstdc++-13-static/COPYING3
        - /usr/share/licenses/libstdc++-13-static/COPYING3.LIB
        - /usr/share/licenses/libstdc++-13-static/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++-13-devel = ${package.version}-${package.release}
      provides:
        - libstdc++-static = ${package.version}-${package.release}

    tests:
      - name: static-cxx-runtime
        packages:
          - bash
          - gcc-13
          - binutils
          - grep
        files: tests
        script: |
          g++-13 -std=c++17 -pthread -static-libstdc++ -static-libgcc "$TEST_FILES/containers.cc" -o containers
          ./containers
          readelf -d containers > dynamic.txt
          if grep -F 'libstdc++' dynamic.txt; then exit 1; fi
  - name: libatomic-13
    summary: GCC atomic operations runtime
    files:
      include:
        - /usr/lib*/libatomic.so.*
        - /usr/lib/gcc/**/libatomic*
        - /usr/share/licenses/libatomic-13/**
      license:
        - /usr/share/licenses/libatomic-13/COPYING3
        - /usr/share/licenses/libatomic-13/COPYING3.LIB
        - /usr/share/licenses/libatomic-13/COPYING.RUNTIME
    dependencies:
      provides:
        - libatomic = ${package.version}-${package.release}

    tests:
      - name: non-lock-free-atomics
        packages:
          - bash
          - gcc-13
        files: tests
        script: |
          gcc-13 "$TEST_FILES/atomic.c" -latomic -o atomic
          ./atomic
      - name: runtime-closure
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libatomic.so.*"]
  - name: gcc-13-doc
    summary: GCC 13 documentation
    files:
      include:
        - "@info"
        - "@man"
        - /usr/share/licenses/gcc-13-doc/**
      license:
        - /usr/share/licenses/gcc-13-doc/COPYING3
        - /usr/share/licenses/gcc-13-doc/COPYING3.LIB
        - /usr/share/licenses/gcc-13-doc/COPYING.RUNTIME
