# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# SELinux userspace library. rpm, libdnf5 and the base userland link against
# libselinux; the utilities are split so the library can be installed without
# the policy management tools.
schema: 2

package:
  name: libselinux
  version: "3.11"
  release: 1
  summary: SELinux library and utilities
  description: |
    libselinux provides the userspace API for SELinux policy enforcement,
    labelling and context management, plus the standard command-line tools.
  license: libselinux-1.0
  upstream: https://github.com/SELinuxProject/selinux
  cpe:
    vendor: selinuxproject
    product: libselinux

sources:
  - name: libselinux-3.11.tar.gz
    kind: archive
    digest: "sha512:49eb0b180b77b4b61505117ecd98ab9fdd79a36801b6d2216813ea370a02ba4f58a0f87a18e92a2d4eeffc11d9df67e4692d2d8f5d3ee77a2abd3f606196aaad"
    locators:
      - kind: https
        url: https://github.com/SELinuxProject/selinux/releases/download/3.11/libselinux-3.11.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf, python3]
  sysroot: [libsepol-devel, pcre2-devel]
  pipeline:
    - runs: |
        make -j"$(nproc)" \
          PREFIX=/usr LIBDIR=/usr/lib64 SHLIBDIR=/usr/lib64 \
          SBINDIR=/usr/bin USE_PCRE2=y
    - runs: |
        make \
          PREFIX=/usr LIBDIR=/usr/lib64 SHLIBDIR=/usr/lib64 \
          SBINDIR=/usr/bin USE_PCRE2=y \
          DESTDIR="$STAGE" install
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [libselinux, libselinux-utils, libselinux-devel, libselinux-static, libselinux-doc]
    - uses: strip

outputs:
  - name: libselinux
    summary: SELinux runtime library
    files:
      include:
        - /usr/lib*/libselinux.so.*
        - /usr/share/licenses/libselinux/**
      license:
        - /usr/share/licenses/libselinux/**
    dependencies:
      run:
        - libsepol
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libselinux.so.*"]
  - name: libselinux-utils
    summary: SELinux command-line utilities
    files:
      include:
        - /usr/bin/avcstat
        - /usr/bin/compute_av
        - /usr/bin/compute_create
        - /usr/bin/compute_member
        - /usr/bin/compute_relabel
        - /usr/bin/getconlist
        - /usr/bin/getdefaultcon
        - /usr/bin/getenforce
        - /usr/bin/getfilecon
        - /usr/bin/getpidcon
        - /usr/bin/getpidprevcon
        - /usr/bin/getpolicyload
        - /usr/bin/getsebool
        - /usr/bin/getseuser
        - /usr/bin/matchpathcon
        - /usr/bin/policyvers
        - /usr/bin/sefcontext_compile
        - /usr/bin/selabel_compare
        - /usr/bin/selabel_digest
        - /usr/bin/selabel_get_digests_all_partial_matches
        - /usr/bin/selabel_lookup
        - /usr/bin/selabel_lookup_best_match
        - /usr/bin/selabel_partial_match
        - /usr/bin/selinux_check_access
        - /usr/bin/selinux_check_securetty_context
        - /usr/bin/selinuxenabled
        - /usr/bin/selinuxexeccon
        - /usr/bin/setenforce
        - /usr/bin/setfilecon
        - /usr/bin/togglesebool
        - /usr/bin/validatetrans
        - /usr/share/licenses/libselinux-utils/**
      license:
        - /usr/share/licenses/libselinux-utils/**
    dependencies:
      run:
        - libselinux = ${package.version}-${package.release}
    tests:
      - name: installed
        script: |
          trap 'printf "line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          mode=$(getenforce)
          case "$mode" in
            Enforcing|Permissive) expected=0 ;;
            Disabled) expected=1 ;;
            *) echo "unexpected getenforce response: $mode" >&2; exit 1 ;;
          esac
          status=0
          selinuxenabled || status=$?
          test "$status" = "$expected"
          printf '/fixture(/.*)? system_u:object_r:tmp_t:s0\n' > file_contexts
          test "$(matchpathcon -N -n -f file_contexts /fixture/file)" = system_u:object_r:tmp_t:s0
          test "$(matchpathcon -N -n -f file_contexts /unmatched)" = '<<none>>'
          status=0
          setenforce > diagnostic 2>&1 || status=$?
          test "$status" = 1
          diagnostic=$(<diagnostic)
          [[ $diagnostic == *'setenforce'* ]]
  - name: libselinux-devel
    summary: Development files for libselinux
    files:
      include:
        - "@dev"
        - /usr/share/licenses/libselinux-devel/**
      license:
        - /usr/share/licenses/libselinux-devel/**
    dependencies:
      run:
        - libselinux = ${package.version}-${package.release}
        - libsepol-devel
        - pcre2-devel

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists libselinux
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libselinux) "$TEST_FILES/behavior.c" $(pkg-config --libs libselinux) -o behavior
          ./behavior
  - name: libselinux-static
    summary: Static library for libselinux
    files:
      include:
        - "@static"
        - /usr/share/licenses/libselinux-static/**
      license:
        - /usr/share/licenses/libselinux-static/**
    dependencies:
      run:
        - libselinux-devel = ${package.version}-${package.release}

    tests:
      - name: static-api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
          - binutils
          - grep
        files: tests
        script: |
          pkg-config --exists libselinux
          private_libs=()
          for flag in $(pkg-config --static --libs libselinux); do
            if test "$flag" != -lselinux; then private_libs+=("$flag"); fi
          done
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libselinux) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir libselinux)/libselinux.a" "$${private_libs[@]}" -o behavior
          ./behavior
          readelf -d behavior > dynamic.txt
          if grep -E 'NEEDED.*\[libselinux\.so' dynamic.txt; then
            echo "static test linked the shared library" >&2
            exit 1
          fi
  - name: libselinux-doc
    summary: Documentation for libselinux
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/libselinux-doc/**
      license:
        - /usr/share/licenses/libselinux-doc/**
