# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# PAM login and account management utilities. This is the provider of
# useradd/groupadd/passwd and the /etc/login.defs defaults.
schema: 1

package:
  name: shadow-utils
  version: "4.20.3"
  release: 1
  summary: Utilities for managing user and group accounts
  description: |
    shadow-utils provides the standard tools for creating and maintaining
    user and group accounts, passwords, shadow files and subordinate ID
    ranges.
  license: BSD-3-Clause
  upstream: https://github.com/shadow-maint/shadow
  cpe:
    vendor: shadow_project
    product: shadow

sources:
  - name: shadow-4.20.3.tar.gz
    kind: archive
    digest: "sha512:bac8358064019ae8dea4a66e739dc39d4d5dff245a3df979d526d183e0889854587534ad91b70cbd905fa30260930f903a1ecd4eb8380570c1d94b0b88780c66"
    locators:
      - kind: https
        url: https://github.com/shadow-maint/shadow/archive/refs/tags/4.20.3.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

patches:
  - file: patches/fix-nscd-flush-cache-signature.patch
    strip: 1
    reason: "fix the nscd_flush_cache stub signature when nscd support is disabled"

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf, pkgconf-devel, autoconf, automake, gettext, gettext-devel, libtool]
  sysroot:
    - audit-libs-devel
    - libcap-devel
    - libselinux-devel
    - libsemanage-devel
    - libxcrypt-devel
    - libxslt
    - docbook-style-xsl
    - pam-devel
  pipeline:
    - runs: |
        autoreconf -fi
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --disable-account-tools-setuid
          - --disable-nls
          - --disable-logind
          - --enable-lastlog
          - --enable-man
          - --with-audit
          - --with-libpam
          - --with-selinux
          - --with-yescrypt
          - --without-fcaps
          - --without-su
          - --without-acl
          - --without-attr
          - --without-libbsd
          - --without-tcb
          - --without-nscd
          - --without-group-name-max-length
          - --bindir=/usr/bin
          - --sbindir=/usr/bin
    - uses: make/build
    - uses: make/install
    - runs: |
        find "$STAGE" -name '*.la' -delete
        # rpmx does not permit setuid/setgid payloads in packages.  Account
        # tools are expected to rely on PAM and file capabilities instead.
        find "$STAGE" -type f -perm /6000 -exec chmod 0755 {} +
        # Fedora and Wolfi put login, su, chfn and chsh in util-linux.
        for f in login sulogin chfn chsh; do
          rm -f "$STAGE/usr/bin/$f"
        done
        rm -f "$STAGE"/usr/share/man/man1/{login,sulogin,chfn,chsh}.1*
        rm -f "$STAGE"/etc/pam.d/{login,su,chfn,chsh}
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [shadow-utils, shadow-utils-devel, shadow-utils-doc]
    - uses: strip

outputs:
  - name: shadow-utils
    summary: Utilities for managing user and group accounts
    files:
      exclude:
        - /usr/include/**
        - /usr/lib*/libsubid.so
      license:
        - /usr/share/licenses/shadow-utils/**
      config:
        - /etc/login.defs
        - /etc/default/useradd
        - /etc/pam.d/chpasswd
        - /etc/pam.d/newusers
        - /etc/pam.d/passwd
    dependencies:
      run:
        - audit-libs
        - libcap
        - libselinux
        - libsemanage
        - libxcrypt
        - pam
    tests:
      - name: account-lifecycle
        stage: transaction
        packages:
          - bash
          - coreutils
          - grep
          - libc-bin
        script: |
          # Minimal test roots may have no entry for the namespace's root caller.
          if ! getent passwd 0; then
            printf 'root:x:0:0:root:/root:/bin/bash\n' >> /etc/passwd
          fi
          for database in /etc/shadow /etc/gshadow; do
            if test ! -e "$database"; then install -m 0600 /dev/null "$database"; fi
          done
          groupadd --gid 24567 rpmx-probe-group
          useradd --uid 24567 --gid rpmx-probe-group --no-create-home --shell /bin/sh rpmx-probe
          getent passwd rpmx-probe > passwd.txt
          grep '^rpmx-probe:[^:]*:24567:24567:' passwd.txt
          if useradd --uid 24568 --no-create-home rpmx-probe; then exit 1; fi
          usermod --comment 'rpmx account test' --shell /bin/false rpmx-probe
          getent passwd rpmx-probe > modified.txt
          grep 'rpmx account test:.*:/bin/false$' modified.txt
          usermod --lock rpmx-probe
          passwd -S rpmx-probe > status.txt
          grep '^rpmx-probe L' status.txt
          chage -M 90 -W 7 rpmx-probe
          chage -l rpmx-probe > aging.txt
          grep -E '^Maximum number of days between password change[[:space:]]*:[[:space:]]*90$' aging.txt
          grep -E '^Number of days of warning before password expires[[:space:]]*:[[:space:]]*7$' aging.txt
          userdel rpmx-probe
          if getent passwd rpmx-probe; then exit 1; fi
          groupdel rpmx-probe-group
          if getent group rpmx-probe-group; then exit 1; fi
        artifacts:
          - passwd.txt
          - modified.txt
          - status.txt
          - aging.txt
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libsubid.so.*"]
  - name: shadow-utils-devel
    summary: Development files for shadow-utils
    files:
      include:
        - "@dev"
        - /usr/share/licenses/shadow-utils-devel/**
      license:
        - /usr/share/licenses/shadow-utils-devel/**
    dependencies:
      run:
        - shadow-utils = ${package.version}-${package.release}
    tests:
      - name: subordinate-id-api
        stage: transaction
        packages:
          - bash
          - gcc
        files: tests
        script: |
          printf 'root:x:0:0:root:/root:/bin/sh\nrpmx-owner:x:24567:24567::/:/bin/false\nrpmx-empty:x:24568:24568::/:/bin/false\n' > /etc/passwd
          printf '24567:200000:100\n24567:300000:200\n' > /etc/subuid
          printf '24567:500000:50\n' > /etc/subgid
          gcc -Wall -Wextra -Werror "$TEST_FILES/subid.c" -lsubid -o subid
          ./subid
  - name: shadow-utils-doc
    summary: Documentation for shadow-utils
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/shadow-utils-doc/**
      license:
        - /usr/share/licenses/shadow-utils-doc/**
