# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Python 3.14, one of the supported interpreter streams. The toolchain needs it twice
# over: glibc and GCC run Python scripts in their build, and several
# recipes in this repository generate files with it.
#
# The version is part of the package name, like glibc and Lua, and the
# installed tree carries it as well: the standard library lives in
# `/usr/lib/python3.14`, the shared library is `libpython3.14.so.1.0` and the
# headers are under `/usr/include/python3.14`. Multiple streams can be
# installed at once, and `python-3.14-default` is the only output that owns the
# unversioned `/usr/bin/python3`.
#
# The interpreter is built against the system copy of every optional module
# library (expat, libffi, readline, sqlite, OpenSSL, zlib, bzip2, xz, zstd) so
# that a rebuild never links a vendored copy, and without the static library
# and the test modules, which a container distribution does not ship.
schema: 2

package:
  name: python-3.14
  version: "3.14.10"
  release: 4
  summary: The Python programming language (version 3.14)
  description: |
    Python is an interpreted, interactive, object-oriented programming
    language. This package provides the 3.14 language stream with a versioned
    interpreter, standard library, shared library and development files so
    several Python versions can be installed side by side.
  license: PSF-2.0
  upstream: https://www.python.org/
  cpe:
    vendor: python
    product: python

sources:
  - name: Python-3.14.10.tar.xz
    kind: archive
    digest: "sha512:730ea64f7e8815a5e1a4280b1205d77719875de630e6807b3140987b44e7b91215918cf75ed77250cf6feb5de98ff4175555cbba96eaf32564d2f421e723994a"
    locators:
      - kind: https
        url: https://www.python.org/ftp/python/3.14.10/Python-3.14.10.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf, sed, grep, diffutils, findutils]
  sysroot:
    - bzip2-devel
    - expat-devel
    - libffi-devel
    - zstd-devel
    - ncurses-devel
    - openssl-devel
    - readline-devel
    - sqlite-devel
    - xz-devel
    - zlib-devel
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-shared
          - --without-static-libpython
          - --disable-test-modules
          - --without-ensurepip
          - --with-system-expat
          - --with-platlibdir=lib
          - --enable-loadable-sqlite-extensions
    - uses: make/build
    - uses: make/install
    - runs: |
        set -eu
        # The unversioned interpreter name belongs to the -default output.
        ln -sfn python3.14 "$STAGE/usr/bin/python3"
        # `make install` also writes unversioned development names. They would
        # be claimed by the streams' -devel outputs, and a tree that builds
        # extensions for two interpreters has to install both. Every consumer
        # takes the version: `python3.14-config`, `pkg-config python3.14`.
        rm -f "$STAGE/usr/bin/python3-config" "$STAGE$LIBDIR/pkgconfig/python3.pc"
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [python-3.14, python-3.14-libs, python-3.14-default, python-3.14-devel, python-3.14-doc]
    - uses: strip

outputs:
  - name: python-3.14
    summary: The Python programming language (version 3.14)
    files:
      license:
        - /usr/share/licenses/python-3.14/LICENSE
    dependencies:
      run:
        - python-3.14-libs = ${package.version}-${package.release}
      provides:
        - python-3.14 = ${package.version}-${package.release}
        - python3.14 = ${package.version}-${package.release}
    tests:
      - name: stdlib-and-native-modules
        packages:
          - bash
        files: tests
        script: |
          python3.14 -I "$TEST_FILES/runtime.py" 3.14
      - name: syntax-error
        packages:
          - bash
          - coreutils
        script: |
          status=0
          python3.14 -I -c 'def broken(' >stdout.log 2>syntax.stderr || status=$?
          test "$status" = 1
          case "$(<syntax.stderr)" in
            *SyntaxError*) ;;
            *) echo 'Python did not report the expected syntax error' >&2; exit 1 ;;
          esac
        artifacts:
          - syntax.stderr
  - name: python-3.14-libs
    summary: Python 3.14 runtime library
    files:
      include:
        - /usr/lib*/libpython3.14.so.*
        - /usr/share/licenses/python-3.14-libs/LICENSE
      license:
        - /usr/share/licenses/python-3.14-libs/LICENSE
    tests:
      - name: load-runtime
        packages:
          - bash
          - python-3.14
        script: |
          python3.14 -I -c 'import ctypes; lib=ctypes.CDLL("libpython3.14.so.1.0"); lib.Py_GetVersion.restype=ctypes.c_char_p; assert lib.Py_GetVersion().startswith(b"3.14.")'
      - name: runtime-closure
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libpython3.14.so.*"]
  - name: python-3.14-default
    summary: Unversioned Python 3.14 command names
    files:
      include:
        - /usr/bin/python3
        - /usr/bin/pydoc3
        - /usr/bin/idle3
        - /usr/share/licenses/python-3.14-default/LICENSE
      license:
        - /usr/share/licenses/python-3.14-default/LICENSE
    dependencies:
      run:
        - python-3.14 = ${package.version}-${package.release}
      provides:
        - python3 = ${package.version}-${package.release}
      conflicts:
        - python-3.11-default
        - python-3.12-default
        - python-3.13-default
        - python-3.15-default
    tests:
      - name: default-interpreter
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          test "$(readlink /usr/bin/python3)" = python3.14
          python3 -I "$TEST_FILES/runtime.py" 3.14
          pydoc3 json > json-help.txt
          test -s json-help.txt
  - name: python-3.14-devel
    summary: Development files for Python 3.14
    files:
      include:
        - "@dev"
        - /usr/include/python3.14/**
        - /usr/lib*/python3.14/config-3.14/**
        - /usr/bin/python3.14-config
        - /usr/share/licenses/python-3.14-devel/LICENSE
      license:
        - /usr/share/licenses/python-3.14-devel/LICENSE
    dependencies:
      run:
        - python-3.14-libs = ${package.version}-${package.release}
    tests:
      - name: embed-and-extension
        packages:
          - bash
          - gcc
          - pkgconf
          - python-3.14
        files: tests
        script: |
          gcc "$TEST_FILES/embed.c" $(python3.14-config --embed --cflags --ldflags) -o embed
          ./embed
          gcc -shared -fPIC "$TEST_FILES/extension.c" $(python3.14-config --cflags --ldflags) -o "probe$(python3.14-config --extension-suffix)"
          python3.14 -c 'import probe; assert probe.answer() == 42'
          pkg-config --exists python-3.14-embed
  - name: python-3.14-doc
    summary: Documentation for Python 3.14
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/python-3.14-doc/LICENSE
      license:
        - /usr/share/licenses/python-3.14-doc/LICENSE

tests:
  - name: hardening
    pipeline:
      # The launcher only forwards to Py_BytesMain: it has no stack buffer and
      # no libc call to fortify, so those two properties cannot appear in it.
      # They are checked on the library, where the interpreter actually lives.
      - uses: test/hardening-check
        with:
          paths: [/usr/bin/python3.14]
          skip: [stack-protector, fortify]
      - uses: test/hardening-check
        with:
          paths: [/usr/lib64/libpython3.14.so.1.0]
          skip: [pie]
