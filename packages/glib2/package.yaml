# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GLib core application support library. libdnf5 links against glib-2.0 and
# gobject-2.0, so the container build keeps the core libraries and development
# files but disables documentation, tests, introspection and optional system
# integrations.
schema: 1

package:
  name: glib2
  version: "2.90.1"
  release: 1
  summary: A library of handy utility functions
  description: |
    GLib is the low-level core library that forms the basis for projects such
    as GTK and GNOME. It provides data structure handling for C, portability
    wrappers and interfaces for runtime functionality such as event loops,
    threads and dynamic loading.
  license: LGPL-2.1-or-later
  upstream: https://gitlab.gnome.org/GNOME/glib
  cpe:
    vendor: gnome
    product: glib

sources:
  - name: glib-2.90.1.tar.xz
    kind: archive
    digest: "sha512:d2d76deaad64e307034b09635c64a60537b0d625d1695b314bc33e9e3c9b20284270d2105333474eb1fbe5afcaa814d4c52ded3a1c2a46b4b2652f7b66a211c3"
    locators:
      - kind: https
        url: https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [meson, ninja, gcc, bash, coreutils, pkgconf, python3]
  sysroot: [libffi-devel, libmount-devel, pcre2-devel, zlib-devel]
  pipeline:
    - uses: meson/setup
      with:
        args:
          - -Dtests=false
          - -Dinstalled_tests=false
          - -Ddocumentation=false
          - -Dman=false
          - -Dgtk_doc=false
          - -Dintrospection=disabled
          - -Dselinux=disabled
          - -Dlibmount=enabled
          - -Dsystemtap=disabled
          - -Ddtrace=disabled
          - -Dglib_debug=disabled
          - -Dnls=disabled
          - -Dlibexecdir=/usr/libexec/glib2
    - uses: meson/compile
    - uses: meson/install
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [glib2, glib2-devel]
    - uses: strip

outputs:
  - name: glib2
    summary: GLib core libraries and tools
    files:
      include:
        - /usr/bin/gdbus
        - /usr/bin/glib-compile-schemas
        - /usr/bin/glib-compile-resources
        - /usr/lib*/libglib-2.0.so.*
        - /usr/lib*/libgobject-2.0.so.*
        - /usr/lib*/libgmodule-2.0.so.*
        - /usr/lib*/libgio-2.0.so.*
        - /usr/share/licenses/glib2/**
      license:
        - /usr/share/licenses/glib2/**
    dependencies:
      run:
        - libffi
        - libmount
        - pcre2
        - zlib
    tests:
      - name: runtime-linkage
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libglib-2.0.so.*", "libgobject-2.0.so.*", "libgio-2.0.so.*", "libgmodule-2.0.so.*"]
      - name: schema-compile-and-query
        stage: installed
        files: tests
        script: |
          glib-compile-schemas --strict "$TEST_FILES"
          test "$(gsettings --schemadir "$TEST_FILES" get org.eternal.fixture answer)" = 42
          if glib-compile-schemas --strict "$TEST_FILES/invalid"; then
            echo "accepted invalid schema" >&2
            exit 1
          fi
  - name: glib2-devel
    summary: Development files for GLib
    files:
      include:
        - "@dev"
        - /usr/share/licenses/glib2-devel/**
      license:
        - /usr/share/licenses/glib2-devel/**
    dependencies:
      run:
        - glib2 = ${package.version}-${package.release}
    tests:
      - name: api-behavior
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists glib-2.0 gobject-2.0 gio-2.0
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags glib-2.0 gobject-2.0 gio-2.0) "$TEST_FILES/behavior.c" $(pkg-config --libs glib-2.0 gobject-2.0 gio-2.0) -o behavior
          ./behavior
