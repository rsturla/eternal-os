# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
schema: 1
package:
  name: cmake
  version: 4.4.5
  release: 1
  summary: Cross-platform build system generator
  description: Cross-platform build system generator.
  license: BSD-3-Clause AND MIT-open-group AND Zlib
  upstream: https://cmake.org/
  cpe:
    vendor: kitware
    product: cmake
sources:
- name: cmake-4.4.5.tar.gz
  kind: archive
  digest: sha512:f4b467b78ac097737a7e46aec352e5aa40a6ebee2d422bec6ee02e86d7f2fc2a600aa8d662f2ad641e0fab8dcd015452d23fc40dcab90eba5a1de9cb106be47b
  locators:
  - kind: https
    url: https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5.tar.gz
  - kind: https
    url: https://cmake.org/files/v4.4/cmake-4.4.5.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - gcc-c++
  - make
  - bash
  - coreutils
  - cmake
  - pkgconf
  sysroot:
  - libcurl-devel
  - libarchive-devel
  - expat-devel
  - zlib-devel
  - bzip2-devel
  - xz-devel
  - libzstd-devel
  - libuv-devel
  - jsoncpp-devel
  - rhash-devel
  pipeline:
  - uses: cmake/configure
    with:
      args:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_USE_SYSTEM_CURL=ON
      - -DCMAKE_USE_SYSTEM_LIBARCHIVE=ON
      - -DCMAKE_USE_SYSTEM_EXPAT=ON
      - -DCMAKE_USE_SYSTEM_ZLIB=ON
      - -DCMAKE_USE_SYSTEM_BZIP2=ON
      - -DCMAKE_USE_SYSTEM_LIBLZMA=ON
      - -DCMAKE_USE_SYSTEM_ZSTD=ON
      - -DCMAKE_USE_SYSTEM_LIBUV=ON
      - -DCMAKE_USE_SYSTEM_JSONCPP=ON
      - -DCMAKE_USE_SYSTEM_LIBRHASH=ON
      - -DCMake_ENABLE_DEBUGGER=OFF
      - -DCMAKE_DOC_DIR=share/doc/cmake
      - -DCMAKE_USE_SYSTEM_LIBRARIES=ON
      - -DCMAKE_USE_SYSTEM_CPPDAP=OFF
      - -DCMAKE_USE_SYSTEM_KWIML=OFF
      - -DCMAKE_USE_SYSTEM_FORM=OFF
      - -DBUILD_CursesDialog=OFF
      - -DBUILD_QtDialog=OFF
      - -DCMake_TEST_NO_NETWORK=ON
  - uses: cmake/build
  - uses: cmake/install
  - uses: license/copy
    with:
      files:
      - LICENSE.rst
      outputs:
      - cmake
      - cmake-doc
  - uses: strip
outputs:
- name: cmake
  files:
    license:
    - /usr/share/licenses/cmake/**
  dependencies:
    run:
    - bash-binsh
    - libarchive
    - libcurl
    - expat
    - libuv
    - jsoncpp
    - rhash
    - libstdc++
    - libgcc
  tests:
  - name: build-project
    stage: installed
    packages:
      - gcc
      - glibc-devel
      - make
    argv:
    - bash
    - -eu
    - -c
    - |
      mkdir /tmp/cmake-test
      cd /tmp/cmake-test
      printf 'cmake_minimum_required(VERSION 3.20)\nproject(smoke C)\nadd_executable(smoke main.c)\n' > CMakeLists.txt
      printf 'int main(void) { return 0; }\n' > main.c
      cmake -S . -B build
      cmake --build build
      ./build/smoke
- name: cmake-doc
  files:
    license:
    - /usr/share/licenses/cmake-doc/**
    include:
    - '@doc'
    - /usr/share/cmake-*/Help/**
    - '@man'
    - /usr/share/emacs/**
    - /usr/share/vim/**
    - /usr/share/licenses/cmake-doc/**
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
