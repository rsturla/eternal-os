# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Build only the policy library. Container library consumers do not need the policy tools.
schema: 1
package:
  name: libsepol
  version: '3.11'
  release: 1
  summary: SELinux policy library
  description: SELinux policy library.
  license: LGPL-2.1-or-later
  upstream: https://github.com/SELinuxProject/selinux
  cpe:
    vendor: selinuxproject
    product: libsepol
sources:
- name: libsepol-3.11.tar.gz
  kind: archive
  digest: sha512:38335292be8b8ce8b22bb2a0e481f92e2bbf532d9a2ee5319ada0b3fd294df487e5eba8041bac2a09ef7b048fee13ca0520c34cb3283fea1f95fcc5752f66b81
  locators:
  - kind: https
    url: https://github.com/SELinuxProject/selinux/releases/download/3.11/libsepol-3.11.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - flex
  - bison
  - pkgconf
  pipeline:
  - uses: make/build
    with:
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
      dir: src
  - uses: make/install
    with:
      dir: include
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
  - uses: make/install
    with:
      dir: src
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
  - uses: make/install
    with:
      dir: man
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - libsepol
      - libsepol-devel
      - libsepol-static
      - libsepol-doc
  - uses: strip
outputs:
- name: libsepol
  files:
    license:
    - /usr/share/licenses/libsepol/**
  tests:
  - name: runtime-linkage
    stage: installed
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libsepol.so.*"]
- name: libsepol-devel
  files:
    license:
    - /usr/share/licenses/libsepol-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/libsepol-devel/**
  dependencies:
    run:
    - libsepol = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists libsepol
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libsepol) "$TEST_FILES/behavior.c" $(pkg-config --libs libsepol) -o behavior
      ./behavior
      gcc -std=c17 -Wall -Wextra -Werror "$TEST_FILES/policy.c" $(pkg-config --cflags --libs libsepol) -o policy
      ./policy "$TEST_FILES/minimal.cil"
- name: libsepol-static
  files:
    license:
    - /usr/share/licenses/libsepol-static/**
    include:
    - '@static'
    - /usr/share/licenses/libsepol-static/**
  dependencies:
    run:
    - libsepol-devel = ${package.version}-${package.release}
  tests:
  - name: static-api-behavior
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    - binutils
    - grep
    files: tests
    script: |
      pkg-config --exists libsepol
      private_libs=()
      for flag in $(pkg-config --static --libs libsepol); do
        if test "$flag" != -lsepol; then private_libs+=("$flag"); fi
      done
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libsepol) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir libsepol)/libsepol.a" "$${private_libs[@]}" -o behavior
      ./behavior
      readelf -d behavior > dynamic.txt
      if grep -E 'NEEDED.*\[libsepol\.so' dynamic.txt; then
        echo "static test linked the shared library" >&2
        exit 1
      fi
      gcc -std=c17 -Wall -Wextra -Werror "$TEST_FILES/policy.c" "$(pkg-config --variable=libdir libsepol)/libsepol.a" "$${private_libs[@]}" -o policy
      ./policy "$TEST_FILES/minimal.cil"
- name: libsepol-doc
  files:
    license:
    - /usr/share/licenses/libsepol-doc/**
    include:
    - '@man'
    - /usr/share/licenses/libsepol-doc/**
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
    with:
      paths:
      - /usr/lib64/libsepol.so.2
      - /usr/lib/libsepol.so.2
