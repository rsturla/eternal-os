# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# POSIX capabilities library and tools. rpm and libdnf5 link against libcap,
# and coreutils uses it for capability-aware ls colouring.
schema: 2

package:
  name: libcap
  version: "2.78"
  release: 2
  summary: POSIX 1003.1e capabilities
  description: |
    libcap implements the POSIX 1003.1e capabilities API, the capsh, getcap,
    getpcaps and setcap utilities, and the pam_cap module.
  license: BSD-3-Clause OR GPL-2.0-only
  upstream: https://sites.google.com/site/fullycapable/
  cpe:
    vendor: kernel
    product: libcap

sources:
  - name: libcap-2.78.tar.xz
    kind: archive
    digest: "sha512:a156a8708dd59f13400f701f4e1ddc81f915fe4e7b32f93a328f7d6f030b7a004fb985fa9ac60812dfffeb8ad860d2e1f59895485497350250efd9378682626b"
    locators:
      - kind: https
        url: https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.78.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - runs: |
        make -j"$(nproc)" \
          BUILD_CC=gcc CC=gcc \
          prefix=/usr lib=lib64 sbindir=bin \
          PAM_CAP=no GOLANG=no RAISE_SETFCAP=no
    - runs: |
        make \
          prefix=/usr lib=lib64 sbindir=bin \
          PAM_CAP=no GOLANG=no RAISE_SETFCAP=no \
          DESTDIR="$STAGE" install
        chmod 0755 "$STAGE"/usr/lib64/libcap.so.*
    - uses: license/copy
      with:
        files: [License]
        outputs: [libcap, libcap-utils, libcap-devel, libcap-static, libcap-doc]
    - uses: strip

outputs:
  - name: libcap
    summary: Library for getting and setting POSIX capabilities
    files:
      include:
        - /usr/lib*/libcap.so.*
        - /usr/lib*/libpsx.so.*
        - /usr/share/licenses/libcap/**
      license:
        - /usr/share/licenses/libcap/**
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libcap.so.*", "libpsx.so.*"]
  - name: libcap-utils
    summary: Utilities for manipulating POSIX capabilities
    files:
      include:
        - /usr/bin/capsh
        - /usr/bin/getcap
        - /usr/bin/getpcaps
        - /usr/bin/setcap
        - /usr/share/licenses/libcap-utils/**
      license:
        - /usr/share/licenses/libcap-utils/**
    dependencies:
      run:
        - libcap = ${package.version}-${package.release}
    tests:
      - name: installed
        script: |
          trap 'printf "line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2' ERR
          decoded=$(capsh --decode=3)
          [[ $decoded == *'cap_chown,cap_dac_override'* ]]
          process=$(getpcaps $$)
          [[ $process == "$$:"* ]]
          printf 'private fixture\n' > ordinary-file
          test -z "$(getcap ordinary-file)"
          status=0
          capsh --supports=cap_eternal_invalid > diagnostic 2>&1 || status=$?
          test "$status" = 1
          diagnostic=$(<diagnostic)
          [[ $diagnostic == *cap_eternal_invalid* ]]
  - name: libcap-devel
    summary: Development files for libcap
    files:
      include:
        - "@dev"
        - /usr/share/licenses/libcap-devel/**
      license:
        - /usr/share/licenses/libcap-devel/**
    dependencies:
      run:
        - libcap = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists libcap
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libcap) "$TEST_FILES/behavior.c" $(pkg-config --libs libcap) -o behavior
          ./behavior
  - name: libcap-static
    summary: Static libraries for libcap
    files:
      include:
        - "@static"
        - /usr/share/licenses/libcap-static/**
      license:
        - /usr/share/licenses/libcap-static/**
    dependencies:
      run:
        - libcap-devel = ${package.version}-${package.release}

    tests:
      - name: static-api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
          - binutils
          - grep
        files: tests
        script: |
          pkg-config --exists libcap
          private_libs=()
          for flag in $(pkg-config --static --libs libcap); do
            if test "$flag" != -lcap; then private_libs+=("$flag"); fi
          done
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libcap) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir libcap)/libcap.a" "$${private_libs[@]}" -o behavior
          ./behavior
          readelf -d behavior > dynamic.txt
          if grep -E 'NEEDED.*\[libcap\.so' dynamic.txt; then
            echo "static test linked the shared library" >&2
            exit 1
          fi
  - name: libcap-doc
    summary: Documentation for libcap
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/libcap-doc/**
      license:
        - /usr/share/licenses/libcap-doc/**
