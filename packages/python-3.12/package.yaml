# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
schema: 1

package:
  name: python-3.12
  version: "3.12.16"
  release: 1
  summary: The Python programming language (version 3.12)
  description: |
    Python is an interpreted, interactive, object-oriented programming
    language. This package provides the 3.12 language stream with a versioned
    interpreter, standard library, shared library and development files so
    several Python versions can be installed side by side.
  license: PSF-2.0
  upstream: https://www.python.org/
  cpe:
    vendor: python
    product: python

sources:
  - name: Python-3.12.16.tar.xz
    kind: archive
    digest: "sha512:adc13563d138248e5049e3d71f6497ff645e5fb3713fc14146fef8809608f447c7d205a6fa468434239504e56b9f826554e1a02c31c9e123e65b17030a7c2afc"
    locators:
      - kind: https
        url: https://www.python.org/ftp/python/3.12.16/Python-3.12.16.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf, sed, grep, diffutils, findutils]
  sysroot:
    - bzip2-devel
    - expat-devel
    - libffi-devel
    - ncurses-devel
    - openssl-devel
    - readline-devel
    - sqlite-devel
    - xz-devel
    - zlib-devel
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-shared
          - --without-static-libpython
          - --disable-test-modules
          - --without-ensurepip
          - --with-system-expat
          - --with-platlibdir=lib
          - --enable-loadable-sqlite-extensions
    - uses: make/build
    - uses: make/install
    - runs: |
        set -eu
        # The unversioned interpreter name belongs to the -default output.
        ln -sfn python3.12 "$STAGE/usr/bin/python3"
        # `make install` also writes unversioned development names. They would
        # be claimed by both streams' -devel outputs, and a tree that builds
        # extensions for two interpreters has to install both. Every consumer
        # takes the version: `python3.12-config`, `pkg-config python3.12`.
        rm -f "$STAGE/usr/bin/python3-config" "$STAGE$LIBDIR/pkgconfig/python3.pc"
        # cgi.py is an importable module, not an executable command.
        chmod a-x "$STAGE/usr/lib/python3.12/cgi.py"
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [python-3.12, python-3.12-libs, python-3.12-default, python-3.12-devel, python-3.12-doc]
    - uses: strip

outputs:
  - name: python-3.12
    summary: The Python programming language (version 3.12)
    files:
      license:
        - /usr/share/licenses/python-3.12/LICENSE
    dependencies:
      run:
        - python-3.12-libs = ${package.version}-${package.release}
      provides:
        - python-3.12 = ${package.version}-${package.release}
        - python3.12 = ${package.version}-${package.release}
    tests:
      - name: installed
        stage: installed
        packages: [bzip2-libs, expat, libffi, libzstd, ncurses-libs, openssl-libs, readline, sqlite-libs, xz-libs, zlib, bash-binsh, coreutils, gcc, grep]
        argv:
          - sh
          - -c
          - |
            python3.12 -c 'import sys; print("%d.%d" % sys.version_info[:2])' | grep -qx 3.12
            python3.12 -c 'import bz2, ctypes, decimal, hashlib, json, lzma, sqlite3, unicodedata, zlib; print("modules ok")'
            python3.12 -c 'import cgi'
            test ! -x /usr/lib/python3.12/cgi.py
            python3.12 -c 'import ssl; print(ssl.OPENSSL_VERSION)'
            python3.12 -c 'import readline; print("readline ok")'
            python3.12 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])' | grep -qx /usr/lib/python3.12
      - name: coinstall-default
        stage: installed
        packages: [python3]
        argv:
          - bash
          - -eu
          - -c
          - |
            python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 13)'
            python3 -c 'import sys; assert sys.version_info[:2] == (3, 14)'

  - name: python-3.12-libs
    summary: Python 3.12 runtime library
    files:
      include:
        - /usr/lib*/libpython3.12.so.*
        - /usr/share/licenses/python-3.12-libs/LICENSE
      license:
        - /usr/share/licenses/python-3.12-libs/LICENSE
    tests:
      - name: installed
        stage: installed
        packages: [bash-binsh]
        argv:
          - sh
          - -c
          - |
            for lib in /usr/lib64/libpython3.12.so.* /usr/lib/libpython3.12.so.*; do
              test -e "$lib" && exit 0
            done
            exit 1

  - name: python-3.12-default
    summary: Unversioned Python 3.12 command names
    files:
      include:
        - /usr/bin/python3
        - /usr/bin/pydoc3
        - /usr/share/licenses/python-3.12-default/LICENSE
      license:
        - /usr/share/licenses/python-3.12-default/LICENSE
    dependencies:
      run:
        - python-3.12 = ${package.version}-${package.release}
      provides:
        - python3 = 0
      conflicts:
        - python-3.11-default
        - python-3.13-default
        - python-3.14-default
        - python-3.15-default
    tests:
      - name: installed
        stage: installed
        packages: [bzip2-libs, expat, libffi, libzstd, ncurses-libs, openssl-libs, readline, sqlite-libs, xz-libs, zlib, bash-binsh, coreutils, gcc, grep]
        argv:
          - sh
          - -c
          - |
            python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])' | grep -qx 3.12
            pydoc3 -h >/dev/null

  - name: python-3.12-devel
    summary: Development files for Python 3.12
    files:
      include:
        - "@dev"
        - /usr/include/python3.12/**
        - /usr/lib*/python3.12/config-3.12/**
        - /usr/bin/python3.12-config
        - /usr/share/licenses/python-3.12-devel/LICENSE
      license:
        - /usr/share/licenses/python-3.12-devel/LICENSE
    dependencies:
      run:
        - python-3.12-libs = ${package.version}-${package.release}
    tests:
      - name: embed
        stage: installed
        packages: [gcc, glibc-devel, grep, sed, bash-binsh, coreutils]
        argv:
          - sh
          - -c
          - |
            cat > /tmp/embed.c <<'EOF'
            #include <Python.h>
            int main(void) {
              Py_Initialize();
              PyRun_SimpleString("print('embedded')");
              return Py_FinalizeEx() == 0 ? 0 : 1;
            }
            EOF
            gcc /tmp/embed.c $(python3.12-config --embed --cflags --ldflags) -o /tmp/embed
            /tmp/embed | grep -qx embedded

  - name: python-3.12-doc
    summary: Documentation for Python 3.12
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/python-3.12-doc/LICENSE
      license:
        - /usr/share/licenses/python-3.12-doc/LICENSE

tests:
  - name: hardening
    stage: build
    pipeline:
      # The launcher only forwards to Py_BytesMain: it has no stack buffer and
      # no libc call to fortify, so those two properties cannot appear in it.
      # They are checked on the library, where the interpreter actually lives.
      - uses: test/hardening-check
        with:
          paths: [/usr/bin/python3.12]
          skip: [stack-protector, fortify]
      - uses: test/hardening-check
        with:
          paths: [/usr/lib64/libpython3.12.so.1.0]
          skip: [pie]
