# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GNU binutils provides the assembler, linker and binary utilities used by the
# rest of the bootstrap. Gold and gprofng are disabled for the first pass; the
# default BFD linker is enough to build glibc and GCC.
#
# The runtime package contains only the tools and linker scripts. Headers,
# static libraries and man pages are separate subpackages, so a minimal image
# does not pull development files just to get `ld` or `as`.
#
# The bootstrap variant lives in bootstrap/recipes/binutils/package.yaml.
schema: 2

package:
  name: binutils
  version: "2.46.1"
  release: 2
  summary: A GNU collection of binary utilities
  description: |
    The GNU binutils are a collection of binary tools: the linker, assembler,
    archiver, symbol table tools and related utilities.
  license: GPL-3.0-or-later
  upstream: https://www.gnu.org/software/binutils/
  cpe:
    vendor: gnu
    product: binutils

sources:
  - name: binutils-2.46.1.tar.xz
    kind: archive
    digest: "sha512:a5c65e56e400ed3fb8906a995dbb93eb5bea54b16344244653d7f44ef29ceb60270da263b19d25302c37759784e14fcb4b9421b29e0e2c7f450bd99f6bb4595c"
    locators:
      - kind: https
        url: https://sourceware.org/pub/binutils/releases/binutils-2.46.1.tar.xz
      - kind: https
        url: https://ftp.gnu.org/gnu/binutils/binutils-2.46.1.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - make
    - bash
    - coreutils
    - texinfo
    - bison
    - flex
    - zlib-devel
    - gawk
    - sed
    - grep
    - diffutils
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --with-sysroot=/
          - --disable-werror
          - --disable-gold
          - --disable-gprofng
          - --disable-nls
          - --disable-shared
          - --enable-install-libiberty
    - uses: make/build
      with:
        args: [tooldir=/usr]
    - uses: make/install
      with:
        args: [tooldir=/usr]
    - runs: |
        # Like Wolfi and Fedora, drop libtool archives. They embed build paths
        # and are not needed at runtime or link time.
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files: [COPYING3, COPYING3.LIB]
        outputs: [binutils, binutils-devel, binutils-static, binutils-doc]
    - uses: strip

  tests:
    - name: upstream
      environment:
        USER: rpmx-test
        LOGNAME: rpmx-test
      packages:
        - dejagnu
        - expect
      pipeline:
        - runs: |
            status=0
            make -j2 -k check || status=$?
            mkdir -p upstream-reports
            find . -path ./upstream-reports -prune -o -type f \( -name '*.sum' -o -name '*.log' \) -exec cp --parents '{}' upstream-reports/ \;
            test "$status" = 0
            for suite in binutils gas ld; do
              find "$suite" -type f -name '*.sum' -exec cat '{}' + > "upstream-reports/$suite.summary"
              grep -E '# of expected passes[[:space:]]+[1-9][0-9]*' "upstream-reports/$suite.summary"
              if grep -E '^(FAIL|XPASS|ERROR|UNRESOLVED):' "upstream-reports/$suite.summary"; then
                echo "unexpected DejaGNU result in $suite" >&2
                exit 1
              fi
            done
      artifacts:
        - upstream-reports
      timeout: 2h

outputs:
  - name: binutils
    summary: A GNU collection of binary utilities
    # Main package: linker scripts, binaries and runtime data.
    files:
      license:
        - /usr/share/licenses/binutils/COPYING3
        - /usr/share/licenses/binutils/COPYING3.LIB
    tests:
      - name: assembler-archive-link-and-inspection
        packages:
          - bash
          - gcc
          - coreutils
          - grep
        files: tests
        script: |
          gcc -S "$TEST_FILES/library.c" -o library.s
          as library.s -o library.o
          ar rcs libanswer.a library.o
          ranlib libanswer.a
          gcc "$TEST_FILES/main.c" -L. -lanswer -o probe
          ./probe
          nm libanswer.a > symbols.txt
          grep ' T answer$' symbols.txt
          readelf -h probe > elf.txt
          grep 'ELF64' elf.txt
          objdump -d probe > disassembly.txt
          grep '<answer>:' disassembly.txt
          objcopy --only-keep-debug probe debug
          cp probe stripped
          strip --strip-unneeded stripped
          ./stripped
          objcopy --add-gnu-debuglink=debug stripped
          readelf --string-dump=.gnu_debuglink stripped > debuglink.txt
          grep 'debug' debuglink.txt
          if ld --definitely-invalid >invalid.stdout 2>invalid.stderr; then exit 1; fi
          case "$(<invalid.stderr)" in
            *'unrecognized option'*'--definitely-invalid'*) ;;
            *) echo 'ld did not diagnose --definitely-invalid' >&2; exit 1 ;;
          esac
        artifacts:
          - invalid.stderr
  - name: binutils-devel
    summary: Binutils development headers and libraries
    files:
      include:
        - "@dev"
        - /usr/lib*/bfd-plugins/**
        - /usr/share/licenses/binutils-devel/**
      license:
        - /usr/share/licenses/binutils-devel/COPYING3
        - /usr/share/licenses/binutils-devel/COPYING3.LIB
    lint:
      allow:
        - static-archive
    dependencies:
      run:
        - binutils = ${package.version}-${package.release}
    tests:
      - name: bfd-headers
        packages:
          - bash
          - gcc
        files: tests
        script: |
          gcc -Wall -Wextra -Werror -c "$TEST_FILES/bfd.c" -o bfd-probe.o
          test -s bfd-probe.o
  - name: binutils-static
    summary: Binutils static libraries
    files:
      include:
        - "@static"
        - /usr/share/licenses/binutils-static/**
      license:
        - /usr/share/licenses/binutils-static/COPYING3
        - /usr/share/licenses/binutils-static/COPYING3.LIB
    dependencies:
      run:
        - binutils-devel = ${package.version}-${package.release}
        # libbfd.a retains zlib references; consumers need the -lz link interface.
        - zlib-devel
    tests:
      - name: static-bfd-api
        packages:
          - bash
          - gcc
          - binutils
          - grep
        files: tests
        script: |
          archive="$LIBDIR/libbfd.a"
          test -f "$archive" || { echo "missing static BFD archive: $archive" >&2; exit 1; }
          gcc "$TEST_FILES/bfd.c" "$archive" -lsframe -liberty -lz -ldl -o bfd-static
          ./bfd-static ./bfd-static
          printf 'not an ELF object\n' > invalid-object
          if ./bfd-static invalid-object; then
            echo 'BFD unexpectedly accepted an invalid object' >&2
            exit 1
          fi
          readelf -d bfd-static > dynamic.txt
          if grep -F libbfd dynamic.txt; then
            echo 'static BFD consumer unexpectedly depends on shared libbfd' >&2
            exit 1
          fi
  - name: binutils-doc
    summary: Binutils documentation
    files:
      include:
        - "@info"
        - "@man"
        - /usr/share/licenses/binutils-doc/**
      license:
        - /usr/share/licenses/binutils-doc/COPYING3
        - /usr/share/licenses/binutils-doc/COPYING3.LIB

tests:
  - name: hardening
    pipeline:
      - uses: test/hardening-check
