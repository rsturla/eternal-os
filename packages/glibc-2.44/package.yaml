  - name: glibc-2.44-locale-extra
    summary: Other locale data for glibc
    files:
      include:
        - /usr/lib*/locale/**
        - /usr/share/licenses/glibc-2.44-locale-extra/**
      exclude:
        - /usr/lib*/locale/C.utf8*/**
        - /usr/lib*/locale/ca*/**
        - /usr/lib*/locale/de*/**
        - /usr/lib*/locale/en*/**
        - /usr/lib*/locale/es*/**
        - /usr/lib*/locale/fr*/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-extra/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-extra/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-extra = ${package.version}-${package.release}

    tests:
