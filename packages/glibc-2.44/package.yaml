        - /usr/share/licenses/glibc-2.44-locale-fr/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-fr = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
