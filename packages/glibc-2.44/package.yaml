            found=1
            break
          done
          test "$found" = 1
          export LOCPATH="$PWD/locale"
          test "$(LC_ALL=es_ES.utf8 locale charmap)" = UTF-8
          test "$(LC_ALL=es_ES.utf8 locale decimal_point)" = ','
          test "$(LC_ALL=es_ES.utf8 date -u -d @946684800 +%B)" = 'enero'
  - name: glibc-2.44-locale-fr
    summary: FR locale data for glibc
    files:
      include:
        - /usr/lib*/locale/fr*/**
        - /usr/share/licenses/glibc-2.44-locale-fr/**
      license:
