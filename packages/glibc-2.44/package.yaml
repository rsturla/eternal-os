# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# The GNU C Library, versioned the same way Wolfi versions glibc. The package
# name carries the ABI stream; `glibc` is provided as an unversioned capability
# so packages can depend on the stable name without pinning a recipe path.
#
# The loader, binaries, iconv modules and development files are separate
# outputs. `glibc-2.44` is the runtime library set; `ld-linux-2.44` owns the
# ELF interpreter and loader configuration; `libc-bin-2.44` owns the utilities.
schema: 1

package:
  name: glibc-2.44
  version: "2.44"
  release: 5
  summary: The GNU C Library
  description: |
    The GNU C Library provides the C runtime, dynamic loader interfaces,
    name-service switch modules and the POSIX C library used by the rest of
    Eternal Linux.
  license: LGPL-2.1-or-later
  upstream: https://www.gnu.org/software/libc/
  cpe:
    vendor: gnu
    product: glibc

sources:
  # Upstream publishes 2.MINOR releases, not patch-level tarballs. Pin
  # release/2.44/master so post-release fixes are part of the source, and
  # update the commit deliberately instead of tracking the branch.
  - name: glibc-2.44
    kind: git
    digest: "sha512:271d1326ad9ac9fcc02ea3ca77abd5f499d3a6ef73dd20be4dcccd78f8cca02daa1f49ecd6273a92738ad07bfda1cb788a838d8e8b5b4da43b854d532fea64c5"
    locators:
      - kind: git
        url: https://sourceware.org/git/glibc.git
        commit: c5c6fc6f449dbc95e3a68cacd61852dc0a48e57c
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - make
    - bash
    - coreutils
    - bison
    - flex
    - gawk
    - sed
    - grep
    - diffutils
    - findutils
    - gettext
    - python3
    - texinfo
    - patch
    - tar
    - gzip
  sysroot:
    - kernel-headers
  environment:
    # glibc has its own fortify and stack-protector configuration. The
    # distribution spec would apply them to the bootstrap compiler as well.
    GCC_SPEC_FILE: no-hardening.spec
  pipeline:
    - runs: |
        mkdir build
        # The ELF interpreter path is fixed by the architecture ABI.
        rtlddir=$LIBDIR
        if [ "${arch}" = aarch64 ]; then
          rtlddir=/usr/lib
        fi
        cat > build/configparms <<EOF
        slibdir=$LIBDIR
        libdir=$LIBDIR
        rtlddir=$rtlddir
        rootsbindir=/usr/bin
        user-defined-trusted-dirs=/usr/local/lib:/usr/local/lib64:/usr/lib:/usr/lib64:/lib:/lib64
        EOF
    - uses: autotools/configure
      with:
        dir: build
        configure: ../configure
        args:
          - --datadir=/usr/share
          - --includedir=/usr/include
          - --sbindir=/usr/bin
          - --enable-bind-now
          - --enable-fortify-source
          - --enable-stackguard-randomization
          - --enable-stack-protector=strong
          - --enable-cet
          - '--with-pkgversion="Eternal glibc-2.44-1"'
          - --disable-werror
          - --disable-crypt
          - --enable-kernel=4.9
    - uses: make/build
      with:
        dir: build
    - uses: make/install
      with:
        dir: build
    - runs: |
        # Generate locale files with the glibc built in this recipe.
        make -C build -j"$JOBS" localedata/install-locale-files DESTDIR="$STAGE"
    - runs: |
        # ld.so.cache is host state, not package payload.
        rm -f "$STAGE/etc/ld.so.cache"

    - runs: |
        # Pin the development linker inputs to this glibc stream. The runtime
        # owns the real SONAMEs; the -devel output gets copies so a build
        # against 2.44 headers keeps using 2.44 symbols even when a newer
        # glibc runtime is installed.
        libdir="$STAGE$LIBDIR"
        ver=2.44

        for so in "$libdir"/*.so; do
          [ -L "$so" ] || continue
          case "$so" in
            */libc.so | */libm.so | */libmemusage.so) continue ;;
          esac
          target=$(readlink "$so")
          rm -f "$so"
          cp -p "$libdir/$target" "$so"
        done

        cp -p "$libdir/libc.so.6" "$libdir/libc.so-$ver"
        cp -p "$libdir/libm.so.6" "$libdir/libm.so-$ver"
        sed -i "s|$LIBDIR/libc\.so\.6|$LIBDIR/libc.so-$ver|g" "$libdir/libc.so"
        sed -i "s|$LIBDIR/libm\.so\.6|$LIBDIR/libm.so-$ver|g" "$libdir/libm.so"
        sed -i "s|$LIBDIR/libmvec\.so\.1|$LIBDIR/libmvec.so|g" "$libdir/libm.so"

    - uses: license/copy
      with:
        files: [COPYINGv2, COPYING.LIB]
        outputs: [glibc-2.44, ld-linux-2.44, libc-bin-2.44, glibc-2.44-iconv, glibc-2.44-locales, glibc-2.44-locale-posix, glibc-2.44-locale-ca, glibc-2.44-locale-de, glibc-2.44-locale-en,
              glibc-2.44-locale-es, glibc-2.44-locale-fr, glibc-2.44-locale-extra, nss-db-2.44, glibc-2.44-devel, glibc-2.44-static, glibc-2.44-doc]
    - runs: |
        # The loader configuration is owned by ld-linux-2.44, not by the
        # library package.
        install -d "$STAGE/etc/ld.so.conf.d"
        printf '%s\n' \
          'include ld.so.conf.d/*.conf' \
          '/usr/local/lib' \
          '/usr/local/lib64' \
          '/usr/lib' \
          '/usr/lib64' \
          > "$STAGE/etc/ld.so.conf"
    - uses: strip

outputs:
  - name: glibc-2.44
    summary: The GNU C Library runtime
    # Main package: runtime libraries, /etc/rpc and the license.
    files:
      license:
        - /usr/share/licenses/glibc-2.44/COPYINGv2
        - /usr/share/licenses/glibc-2.44/COPYING.LIB
    dependencies:
      run:
        - ld-linux-2.44 = ${package.version}-${package.release}
        - glibc-2.44-locale-posix = ${package.version}-${package.release}
      conflicts:
        - glibc-2.43
      provides:
        - glibc = ${package.version}-${package.release}
        - glibc-2.44 = ${package.version}-${package.release}

    tests:
      - name: posix-runtime
        stage: installed
        packages:
          - bash
          - gcc
          - binutils
          - grep
          - glibc-2.44-devel
        files: tests
        script: |
          gcc -O2 -Wall -Wextra -Werror -pthread "$TEST_FILES/runtime.c" -lm -o runtime
          version=$(./runtime)
          test "$version" = 2.44
          readelf -d runtime > dynamic.txt
          if grep -F '.so-' dynamic.txt; then exit 1; fi
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libc.so.*", "libm.so.*", "libresolv.so.*"]
  - name: ld-linux-2.44
    summary: The GNU C Library ELF interpreter
    files:
      include:
        - /usr/lib*/ld-linux*
        - /etc/ld.so.conf
        - /etc/ld.so.conf.d/**
        - /usr/share/licenses/ld-linux-2.44/**
      license:
        - /usr/share/licenses/ld-linux-2.44/COPYINGv2
        - /usr/share/licenses/ld-linux-2.44/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - ld-linux = ${package.version}-${package.release}
        - rtld(GNU_HASH)

    tests:
      - name: loader-resolution
        stage: installed
        packages:
          - bash
          - coreutils
          - grep
        script: |
          case "$(uname -m)" in
            x86_64) name=ld-linux-x86-64.so.2 ;;
            aarch64) name=ld-linux-aarch64.so.1 ;;
            *) exit 1 ;;
          esac
          loader=/usr/lib64/$name
          if test ! -x "$loader"; then loader=/usr/lib/$name; fi
          "$loader" --verify /usr/bin/bash
          "$loader" --list /usr/bin/bash > dependencies.txt
          if grep -F 'not found' dependencies.txt; then exit 1; fi
          "$loader" /usr/bin/bash --noprofile --norc -c 'test "$((6 * 7))" = 42'
  - name: libc-bin-2.44
    summary: GNU C Library binaries
    files:
      include:
        - /usr/bin/**
        - /usr/libexec/**
        - /usr/lib*/audit/**
        - /usr/share/licenses/libc-bin-2.44/**
      exclude:
        - /usr/bin/iconv
        - /usr/bin/iconvconfig
        - /usr/lib*/gconv/**
      license:
        - /usr/share/licenses/libc-bin-2.44/COPYINGv2
        - /usr/share/licenses/libc-bin-2.44/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
        # localedef decompresses the shipped .gz charmaps through this helper.
        - gzip
      provides:
        - libc-bin = ${package.version}-${package.release}

    tests:
      - name: utilities
        stage: installed
        packages:
          - bash
          - coreutils
          - grep
        script: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.44'
          test "$(getconf LONG_BIT)" = 64
          test "$(LC_ALL=C locale charmap)" = ANSI_X3.4-1968
          getent rpc portmapper > rpc.txt
          grep '^portmapper' rpc.txt
          printf 'hello\n' > input
          printf 'hello\n' > expected
          getconf PAGESIZE > page-size
          test "$(cat page-size)" -ge 4096
  - name: glibc-2.44-iconv
    summary: GNU C Library iconv modules
    files:
      include:
        - /usr/bin/iconv
        - /usr/bin/iconvconfig
        - /usr/lib*/gconv/**
        - /usr/share/licenses/glibc-2.44-iconv/**
      license:
        - /usr/share/licenses/glibc-2.44-iconv/COPYINGv2
        - /usr/share/licenses/glibc-2.44-iconv/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-iconv = ${package.version}-${package.release}

    tests:
      - name: character-conversion
        stage: installed
        packages:
          - bash
          - coreutils
          - diffutils
        script: |
          printf '\303\251\342\202\254\n' > utf8
          iconv -f UTF-8 -t UTF-16LE utf8 > utf16
          iconv -f UTF-16LE -t UTF-8 utf16 > roundtrip
          cmp utf8 roundtrip
          printf '\351\n' > latin1
          iconv -f ISO-8859-1 -t UTF-8 latin1 > converted
          printf '\303\251\n' > expected
          cmp expected converted
          printf '\377' > invalid
          if iconv -f UTF-8 -t UTF-16LE invalid >invalid.out 2>invalid.err; then exit 1; fi
          test -s invalid.err
  - name: glibc-2.44-locale-posix
    summary: POSIX UTF-8 locale data for glibc
    files:
      include:
        - /usr/lib*/locale/C.utf8/**
        - /usr/share/licenses/glibc-2.44-locale-posix/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-posix/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-posix/COPYING.LIB
    dependencies:
      provides:
        - glibc-locale-posix = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
          mkdir locale
          found=0
          for directory in /usr/lib/locale/C.utf8 /usr/lib64/locale/C.utf8; do
            test -d "$directory" || continue
            cp -R "$directory" locale/C.utf8
            found=1
            break
          done
          test "$found" = 1
          export LOCPATH="$PWD/locale"
          test "$(LC_ALL=C.utf8 locale charmap)" = UTF-8
          test "$(LC_ALL=C.utf8 locale decimal_point)" = '.'
          test "$(LC_ALL=C.utf8 date -u -d @946684800 +%B)" = 'January'
  - name: glibc-2.44-locale-ca
    summary: CA locale data for glibc
    files:
      include:
        - /usr/lib*/locale/ca*/**
        - /usr/share/licenses/glibc-2.44-locale-ca/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-ca/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-ca/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-ca = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
          mkdir locale
          found=0
          for directory in /usr/lib/locale/ca_ES.utf8 /usr/lib64/locale/ca_ES.utf8; do
            test -d "$directory" || continue
            cp -R "$directory" locale/ca_ES.utf8
            found=1
            break
          done
          test "$found" = 1
          export LOCPATH="$PWD/locale"
          test "$(LC_ALL=ca_ES.utf8 locale charmap)" = UTF-8
          test "$(LC_ALL=ca_ES.utf8 locale decimal_point)" = ','
          test "$(LC_ALL=ca_ES.utf8 date -u -d @946684800 +%B)" = 'de gener'
  - name: glibc-2.44-locale-de
    summary: DE locale data for glibc
    files:
      include:
        - /usr/lib*/locale/de*/**
        - /usr/share/licenses/glibc-2.44-locale-de/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-de/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-de/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-de = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
          mkdir locale
          found=0
          for directory in /usr/lib/locale/de_DE.utf8 /usr/lib64/locale/de_DE.utf8; do
            test -d "$directory" || continue
            cp -R "$directory" locale/de_DE.utf8
            found=1
            break
          done
          test "$found" = 1
          export LOCPATH="$PWD/locale"
          test "$(LC_ALL=de_DE.utf8 locale charmap)" = UTF-8
          test "$(LC_ALL=de_DE.utf8 locale decimal_point)" = ','
          test "$(LC_ALL=de_DE.utf8 date -u -d @946684800 +%B)" = 'Januar'
  - name: glibc-2.44-locale-en
    summary: EN locale data for glibc
    files:
      include:
        - /usr/lib*/locale/en*/**
        - /usr/share/licenses/glibc-2.44-locale-en/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-en/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-en/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-en = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
          mkdir locale
          found=0
          for directory in /usr/lib/locale/en_US.utf8 /usr/lib64/locale/en_US.utf8; do
            test -d "$directory" || continue
            cp -R "$directory" locale/en_US.utf8
            found=1
            break
          done
          test "$found" = 1
          export LOCPATH="$PWD/locale"
          test "$(LC_ALL=en_US.utf8 locale charmap)" = UTF-8
          test "$(LC_ALL=en_US.utf8 locale decimal_point)" = '.'
          test "$(LC_ALL=en_US.utf8 date -u -d @946684800 +%B)" = 'January'
  - name: glibc-2.44-locale-es
    summary: ES locale data for glibc
    files:
      include:
        - /usr/lib*/locale/es*/**
        - /usr/share/licenses/glibc-2.44-locale-es/**
      license:
        - /usr/share/licenses/glibc-2.44-locale-es/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locale-es/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-locale-es = ${package.version}-${package.release}

    tests:
      - name: locale-encoding-numbers-and-dates
        stage: installed
        packages:
          - bash
          - coreutils
          - libc-bin-2.44
        script: |
          mkdir locale
          found=0
          for directory in /usr/lib/locale/es_ES.utf8 /usr/lib64/locale/es_ES.utf8; do
