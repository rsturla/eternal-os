# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# The GNU C Library, versioned the same way Wolfi versions glibc. The package
# name carries the ABI stream; `glibc` is provided as an unversioned capability
# so packages can depend on the stable name without pinning a recipe path.
#
# The loader, binaries, iconv modules and development files are separate
# outputs. `glibc-2.44` is the runtime library set; `ld-linux-2.44` owns the
# ELF interpreter and loader configuration; `libc-bin-2.44` owns the utilities.
schema: 1

package:
  name: glibc-2.44
  version: "2.44"
  release: 2
  summary: The GNU C Library
  description: |
    The GNU C Library provides the C runtime, dynamic loader interfaces,
    name-service switch modules and the POSIX C library used by the rest of
    Eternal Linux.
  license: LGPL-2.1-or-later
  upstream: https://www.gnu.org/software/libc/
  cpe:
    vendor: gnu
    product: glibc

sources:
  # Upstream publishes 2.MINOR releases, not patch-level tarballs. Pin
  # release/2.44/master so post-release fixes are part of the source, and
  # update the commit deliberately instead of tracking the branch.
  - name: glibc-2.44
    kind: git
    digest: "sha512:271d1326ad9ac9fcc02ea3ca77abd5f499d3a6ef73dd20be4dcccd78f8cca02daa1f49ecd6273a92738ad07bfda1cb788a838d8e8b5b4da43b854d532fea64c5"
    locators:
      - kind: git
        url: https://sourceware.org/git/glibc.git
        commit: c5c6fc6f449dbc95e3a68cacd61852dc0a48e57c
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - make
    - bash
    - coreutils
    - bison
    - flex
    - gawk
    - sed
    - grep
    - diffutils
    - findutils
    - gettext
    - python3
    - texinfo
    - patch
    - tar
    - gzip
  sysroot:
    - kernel-headers
  environment:
    # glibc has its own fortify and stack-protector configuration. The
    # distribution spec would apply them to the bootstrap compiler as well.
    GCC_SPEC_FILE: no-hardening.spec
  pipeline:
    - runs: |
        mkdir build
        cat > build/configparms <<EOF
        slibdir=$LIBDIR
        libdir=$LIBDIR
        rtlddir=$LIBDIR
        rootsbindir=/usr/bin
        user-defined-trusted-dirs=/usr/local/lib:/usr/local/lib64:/usr/lib:/usr/lib64:/lib:/lib64
        EOF
    - uses: autotools/configure
      with:
        dir: build
        configure: ../configure
        args:
          - --datadir=/usr/share
          - --includedir=/usr/include
          - --sbindir=/usr/bin
          - --enable-bind-now
          - --enable-fortify-source
          - --enable-stackguard-randomization
          - --enable-stack-protector=strong
          - --enable-cet
          - '--with-pkgversion="Eternal glibc-2.44-1"'
          - --disable-werror
          - --disable-crypt
          - --enable-kernel=4.9
    - uses: make/build
      with:
        dir: build
    - uses: make/install
      with:
        dir: build
    - runs: |
        # ld.so.cache is host state, not package payload.
        rm -f "$STAGE/etc/ld.so.cache"

    - runs: |
        # Pin the development linker inputs to this glibc stream. The runtime
        # owns the real SONAMEs; the -devel output gets copies so a build
        # against 2.44 headers keeps using 2.44 symbols even when a newer
        # glibc runtime is installed.
        libdir="$STAGE$LIBDIR"
        ver=2.44

        for so in "$libdir"/*.so; do
          [ -L "$so" ] || continue
          case "$so" in
            */libc.so | */libm.so | */libmemusage.so) continue ;;
          esac
          target=$(readlink "$so")
          rm -f "$so"
          cp -p "$libdir/$target" "$so"
        done

        cp -p "$libdir/libc.so.6" "$libdir/libc.so-$ver"
        cp -p "$libdir/libm.so.6" "$libdir/libm.so-$ver"
        sed -i "s|$LIBDIR/libc\.so\.6|$LIBDIR/libc.so-$ver|g" "$libdir/libc.so"
        sed -i "s|$LIBDIR/libm\.so\.6|$LIBDIR/libm.so-$ver|g" "$libdir/libm.so"
        sed -i "s|$LIBDIR/libmvec\.so\.1|$LIBDIR/libmvec.so|g" "$libdir/libm.so"

    - uses: license/copy
      with:
        files: [COPYINGv2, COPYING.LIB]
        outputs: [glibc-2.44, ld-linux-2.44, libc-bin-2.44, glibc-2.44-iconv, glibc-2.44-locales, nss-db-2.44, glibc-2.44-devel, glibc-2.44-static, glibc-2.44-doc]
    - runs: |
        # The loader configuration is owned by ld-linux-2.44, not by the
        # library package.
        install -d "$STAGE/etc/ld.so.conf.d"
        printf '%s\n' \
          'include ld.so.conf.d/*.conf' \
          '/usr/local/lib' \
          '/usr/local/lib64' \
          '/usr/lib' \
          '/usr/lib64' \
          > "$STAGE/etc/ld.so.conf"
    - uses: strip

outputs:
  - name: glibc-2.44
    summary: The GNU C Library runtime
    # Main package: runtime libraries, /etc/rpc and the license.
    files:
      license:
        - /usr/share/licenses/glibc-2.44/COPYINGv2
        - /usr/share/licenses/glibc-2.44/COPYING.LIB
    dependencies:
      run:
        - ld-linux-2.44 = ${package.version}-${package.release}
      conflicts:
        - glibc-2.43
      provides:
        - glibc = ${package.version}-${package.release}
        - glibc-2.44 = ${package.version}-${package.release}

  - name: ld-linux-2.44
    summary: The GNU C Library ELF interpreter
    files:
      include:
        - /usr/lib*/ld-linux*
        - /etc/ld.so.conf
        - /etc/ld.so.conf.d/**
        - /usr/share/licenses/ld-linux-2.44/**
      license:
        - /usr/share/licenses/ld-linux-2.44/COPYINGv2
        - /usr/share/licenses/ld-linux-2.44/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - ld-linux = ${package.version}-${package.release}
        - rtld(GNU_HASH)

  - name: libc-bin-2.44
    summary: GNU C Library binaries
    files:
      include:
        - /usr/bin/**
        - /usr/libexec/**
        - /usr/lib*/audit/**
        - /usr/share/licenses/libc-bin-2.44/**
      exclude:
        - /usr/bin/iconv
        - /usr/bin/iconvconfig
        - /usr/lib*/gconv/**
      license:
        - /usr/share/licenses/libc-bin-2.44/COPYINGv2
        - /usr/share/licenses/libc-bin-2.44/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - libc-bin = ${package.version}-${package.release}

  - name: glibc-2.44-iconv
    summary: GNU C Library iconv modules
    files:
      include:
        - /usr/bin/iconv
        - /usr/bin/iconvconfig
        - /usr/lib*/gconv/**
        - /usr/share/licenses/glibc-2.44-iconv/**
      license:
        - /usr/share/licenses/glibc-2.44-iconv/COPYINGv2
        - /usr/share/licenses/glibc-2.44-iconv/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - glibc-iconv = ${package.version}-${package.release}

  - name: glibc-2.44-locales
    summary: GNU C Library locale data and translations
    files:
      include:
        - "@locales"
        - /usr/share/licenses/glibc-2.44-locales/**
      license:
        - /usr/share/licenses/glibc-2.44-locales/COPYINGv2
        - /usr/share/licenses/glibc-2.44-locales/COPYING.LIB
    dependencies:
      provides:
        - glibc-locales = ${package.version}-${package.release}

  - name: nss-db-2.44
    summary: GNU C Library NSS database support
    files:
      include:
        - /var/db/**
        - /usr/share/licenses/nss-db-2.44/**
      license:
        - /usr/share/licenses/nss-db-2.44/COPYINGv2
        - /usr/share/licenses/nss-db-2.44/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44 = ${package.version}-${package.release}
      provides:
        - nss-db = ${package.version}-${package.release}

  - name: glibc-2.44-devel
    summary: GNU C Library development headers and libraries
    files:
      include:
        - "@dev"
        - /usr/lib*/*.o
        - /usr/lib*/libc.so-*
        - /usr/lib*/libm.so-*
        - /usr/lib*/libc_nonshared.a
        - /usr/lib*/libanl.a
        - /usr/lib*/libdl.a
        - /usr/lib*/libpthread.a
        - /usr/lib*/librt.a
        - /usr/lib*/libutil.a
        - /usr/share/licenses/glibc-2.44-devel/**
      exclude:
        - /usr/lib*/libmemusage.so
      license:
        - /usr/share/licenses/glibc-2.44-devel/COPYINGv2
        - /usr/share/licenses/glibc-2.44-devel/COPYING.LIB
    lint:
      allow:
        - static-archive
    generators:
      # The pinned copies have the runtime SONAMEs. They are linker inputs,
      # not runtime providers; the runtime package owns those provides.
      elf: false
    dependencies:
      run:
        - glibc >= ${package.version}
        - kernel-headers
      provides:
        - glibc-devel = ${package.version}-${package.release}
    tests:
      - name: installed
        stage: installed
        packages:
          - binutils
          - gcc
          - grep
        argv:
          - sh
          - -c
          - |
            set -eu
            libdir=/usr/lib64
            [ -d "$libdir" ] || libdir=/usr/lib
            test -f "$libdir/libc.so-2.44"
            test -f "$libdir/libm.so-2.44"
            test ! -L "$libdir/libc.so-2.44"
            test ! -L "$libdir/libm.so-2.44"
            case "$(cat "$libdir/libc.so")" in
              *"$libdir/libc.so-2.44"*) ;;
              *) echo "libc.so is not pinned"; exit 1 ;;
            esac
            case "$(cat "$libdir/libm.so")" in
              *"$libdir/libm.so-2.44"*) ;;
              *) echo "libm.so is not pinned"; exit 1 ;;
            esac
            test -f "$libdir/libc_nonshared.a"
            test -f "$libdir/libpthread.a"
            for so in libanl.so libBrokenLocale.so libc_malloc_debug.so \
                      libmvec.so libnss_compat.so libnss_db.so libnss_hesiod.so \
                      libresolv.so libthread_db.so; do
              [ -e "$libdir/$so" ] || continue
              test -f "$libdir/$so" || { echo "$libdir/$so is not a regular file"; exit 1; }
              test ! -L "$libdir/$so" || { echo "$libdir/$so is still a symlink"; exit 1; }
            done
            cat >/tmp/glibc-devel-test.c <<'EOF'
            #define _GNU_SOURCE
            #include <gnu/libc-version.h>
            #include <math.h>
            #include <pthread.h>
            #include <stdio.h>
            #include <string.h>

            static void *worker(void *arg) {
              (void)arg;
              return NULL;
            }

            int main(void) {
              pthread_t thread;
              if (pthread_create(&thread, NULL, worker, NULL) != 0) return 1;
              pthread_join(thread, NULL);

              char buf[8];
              if (strlcpy(buf, "abc", sizeof buf) != 3) return 1;
              if (strcmp(buf, "abc") != 0) return 1;

              double x = log(exp(2.0));
              if (fabs(x - 2.0) > 1e-9) return 1;

              printf("%s\n", gnu_get_libc_version());
              return 0;
            }
            EOF
            gcc -O2 -Wall -Wextra -Werror -fstack-protector-all -pthread \
              -Wl,--hash-style=gnu \
              -o /tmp/glibc-devel-test /tmp/glibc-devel-test.c -lm
            readelf -d /tmp/glibc-devel-test | grep -q GNU_HASH
            /tmp/glibc-devel-test
            if readelf -d /tmp/glibc-devel-test |
                grep -q '\.so-'; then
              echo "test binary links a pinned library soname"; exit 1
            fi

  - name: glibc-2.44-static
    summary: GNU C Library static libraries
    files:
      include:
        - "@static"
        - /usr/share/licenses/glibc-2.44-static/**
      exclude:
        - /usr/lib*/libc_nonshared.a
        - /usr/lib*/libanl.a
        - /usr/lib*/libdl.a
        - /usr/lib*/libpthread.a
        - /usr/lib*/librt.a
        - /usr/lib*/libutil.a
      license:
        - /usr/share/licenses/glibc-2.44-static/COPYINGv2
        - /usr/share/licenses/glibc-2.44-static/COPYING.LIB
    dependencies:
      run:
        - glibc-2.44-devel = ${package.version}-${package.release}
      provides:
        - glibc-static = ${package.version}-${package.release}

  - name: glibc-2.44-doc
    summary: GNU C Library documentation
    files:
      include:
        - "@doc"
        - "@info"
        - "@man"
        - /usr/share/licenses/glibc-2.44-doc/**
      license:
        - /usr/share/licenses/glibc-2.44-doc/COPYINGv2
        - /usr/share/licenses/glibc-2.44-doc/COPYING.LIB

tests:
  - name: build
    stage: build
    argv:
      - sh
      - -c
      - |
        case "${arch}" in
          x86_64) loader="$STAGE/usr/lib64/ld-linux-x86-64.so.2" ;;
          aarch64) loader="$STAGE/usr/lib/ld-linux-aarch64.so.1" ;;
          *) echo "unsupported arch"; exit 1 ;;
        esac
        test -x "$loader"
        test -f "$STAGE/usr/lib64/libc.so.6" || test -f "$STAGE/usr/lib/libc.so.6"
        test -f "$STAGE/etc/ld.so.conf"
        test -f "$STAGE/etc/rpc"
        test -f "$STAGE/usr/share/i18n/locales/C"
        test -f "$STAGE/var/db/Makefile"
