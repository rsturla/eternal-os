# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# XML parsing and toolkit library.
schema: 2

package:
  name: libxml2
  version: "2.15.4"
  release: 1
  summary: Library providing XML and HTML support
  description: |
    libxml2 is a library for parsing XML and HTML documents. It includes
    xmllint and xmlcatalog as well as the development headers and pkg-config
    metadata needed to build applications against it.
  license: MIT
  upstream: https://gitlab.gnome.org/GNOME/libxml2
  cpe:
    vendor: gnome
    product: libxml2

sources:
  - name: libxml2-2.15.4.tar.xz
    kind: archive
    digest: "sha512:e162ed16ad6fb6c6ef1c40c6bed66a5f76db177fc24410cc261c9ddc6b19e9b003315db67f67cbcadaf08e546f0672de87bf6f297014af50fe544a781647f584"
    locators:
      - kind: https
        url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf]
  sysroot: [zlib-devel]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --with-legacy
          - --with-http
          - --with-zlib
          - --without-python
    - uses: make/build
    - uses: make/install
    - runs: |
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files: [Copyright]
        outputs: [libxml2, libxml2-devel, libxml2-doc]
    - uses: strip

outputs:
  - name: libxml2
    summary: XML and HTML parsing library
    files:
      include:
        - /usr/bin/xmlcatalog
        - /usr/bin/xmllint
        - /usr/lib*/libxml2.so.*
        - /usr/share/licenses/libxml2/**
      license:
        - /usr/share/licenses/libxml2/**
    dependencies:
      run:
        - xz-libs
        - zlib
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libxml2.so.*"]
      - name: xml-cli
        files: tests
        script: |
          xmllint --nonet --noout "$TEST_FILES/valid.xml"
          test "$(xmllint --nonet --xpath 'sum(/root/item)' "$TEST_FILES/valid.xml")" = 42
          if xmllint --nonet --noout "$TEST_FILES/invalid.xml"; then
            echo "accepted malformed XML" >&2
            exit 1
          fi
  - name: libxml2-devel
    summary: Development files for libxml2
    files:
      include:
        - "@dev"
        - /usr/share/licenses/libxml2-devel/**
      license:
        - /usr/share/licenses/libxml2-devel/**
    dependencies:
      run:
        - libxml2 = ${package.version}-${package.release}
    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists libxml-2.0
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libxml-2.0) "$TEST_FILES/behavior.c" $(pkg-config --libs libxml-2.0) -o behavior
          ./behavior
  - name: libxml2-doc
    summary: Documentation for libxml2
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/libxml2-doc/**
      license:
        - /usr/share/licenses/libxml2-doc/**
