# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/libuv.yaml
# Use upstream CMake support for the release archive. Keep static archives separate.
schema: 2
package:
  name: libuv
  version: 1.53.0
  release: 1
  summary: Asynchronous I/O library
  description: Asynchronous I/O library.
  license: MIT AND ISC
  upstream: https://libuv.org/
sources:
- name: libuv-1.53.0.tar.gz
  kind: archive
  digest: sha512:751837a07bc92e7938c3ebd94535461e65eec918e6ef9591481063107fc3b103dc0ea63e1192178b5107765492a0feb8012afcd984d98b2514afb7cdb0e4014e
  locators:
  - kind: https
    url: https://dist.libuv.org/dist/v1.53.0/libuv-v1.53.0.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - cmake
  - gcc
  - make
  - bash
  - coreutils
  - pkgconf
  pipeline:
  - uses: cmake/configure
    with:
      args:
      - -DLIBUV_BUILD_SHARED=ON
      - -DBUILD_TESTING=OFF
      - -DLIBUV_BUILD_TESTS=OFF
      - -DLIBUV_BUILD_BENCH=OFF
      - -DENABLE_CLANG_TIDY=OFF
  - uses: cmake/build
  - uses: cmake/install
  - uses: license/copy
    with:
      files:
      - LICENSE
      - LICENSE-extra
      outputs:
      - libuv
      - libuv-devel
      - libuv-static
  - uses: strip
outputs:
- name: libuv
  files:
    license:
    - /usr/share/licenses/libuv/**
  tests:
  - name: runtime-linkage
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libuv.so.*"]
- name: libuv-devel
  files:
    include:
    - '@dev'
    - /usr/share/licenses/libuv-devel/**
    license:
    - /usr/share/licenses/libuv-devel/**
  dependencies:
    run:
    - libuv = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists libuv
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libuv) "$TEST_FILES/behavior.c" $(pkg-config --libs libuv) -o behavior
      ./behavior
- name: libuv-static
  files:
    include:
    - '@static'
    - /usr/share/licenses/libuv-static/**
    license:
    - /usr/share/licenses/libuv-static/**
  dependencies:
    run:
    - libuv-devel = ${package.version}-${package.release}
  tests:
  - name: static-api-behavior
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    - binutils
    - grep
    files: tests
    script: |
      pkg-config --exists libuv
      private_libs=()
      for flag in $(pkg-config --static --libs libuv); do
        if test "$flag" != -luv; then private_libs+=("$flag"); fi
      done
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libuv) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir libuv)/libuv.a" "$${private_libs[@]}" -o behavior
      ./behavior
      readelf -d behavior > dynamic.txt
      if grep -E 'NEEDED.*\[libuv\.so' dynamic.txt; then
        echo "static test linked the shared library" >&2
        exit 1
      fi
tests:
- name: hardening
  pipeline:
  - uses: test/hardening-check
