# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/py3-pathspec.yaml
schema: 1
package:
  name: python-pathspec
  version: 1.1.1
  release: 2
  summary: Git ignore pattern matching for file paths
  license: MPL-2.0
  upstream: https://python-path-specification.readthedocs.io/
sources:
- name: pathspec-1.1.1.tar.gz
  kind: archive
  digest: sha512:e115d3828085b3fc268a14e3362f067ae38ce8317340b6e32841f05d0480cc41970dfe4ac90b05a524fa408220f40911e430ac0a468c469bd366e8a0e39e7bb6
  locators:
  - kind: https
    url: https://files.pythonhosted.org/packages/5a/82/42f767fc1c1143d6fd36efb827202a2d997a375e160a71eb2888a925aac1/pathspec-1.1.1.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
matrix:
  axes:
    python:
    - value: '3.11'
      version: '3.11'
      slug: py311
      package: python-3.11
    - value: '3.12'
      version: '3.12'
      slug: py312
      package: python-3.12
    - value: '3.13'
      version: '3.13'
      slug: py313
      package: python-3.13
    - value: '3.14'
      version: '3.14'
      slug: py314
      package: python3.14
    - value: '3.15'
      version: '3.15'
      slug: py315
      package: python-3.15
  max-cells: 5
  release-suffix: true
build:
  root:
    profile: ../../profiles/bootstrap-python.profile.yaml
  packages:
  - bash
  - coreutils
  - python3.14
  - ${matrix.python.package}
  - python-3.14-flit-core
  pipeline:
  - uses: python/build-wheel
    with:
      python: python3.14
      build-package: python-3.14-build
  - uses: python/install-wheel
    with:
      python: /usr/bin/python${matrix.python.version}
      pip-python: python3.14
      script-version: ${matrix.python.version}
      pip-package: python-3.14-pip
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - python-${matrix.python.version}-pathspec
outputs:
- name: python-${matrix.python.version}-pathspec
  arch: noarch
  files:
    license:
    - /usr/share/licenses/python-${matrix.python.version}-pathspec/**
  tests:
  - name: functional
    stage: installed
    argv:
    - /usr/bin/python${matrix.python.version}
    - -c
    - from pathspec import PathSpec; p = PathSpec.from_lines("gitwildmatch", ["*.py"]); assert p.match_file("demo.py");
      assert not p.match_file("demo.c")
