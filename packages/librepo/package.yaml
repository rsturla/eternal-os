# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Library for downloading and verifying rpm repository metadata.
schema: 1

package:
  name: librepo
  version: "1.22.0"
  release: 1
  summary: Repodata downloading library
  description: |
    librepo is a library for downloading and verifying rpm repository
    metadata. It handles metalinks, mirrors, checksums, OpenPGP signatures and
    zchunk downloads for dnf5 and libdnf5.
  license: LGPL-2.1-or-later
  upstream: https://github.com/rpm-software-management/librepo
  cpe:
    vendor: rpm-software-management
    product: librepo

sources:
  - name: librepo-1.22.0.tar.gz
    kind: archive
    digest: "sha512:1a2c1753721196753ebb4af5eef483fba28b06a26ebff764accaee3e5b153327c181f04869e98fccc9b9a085f171e367f129511616549a25efd4530d38e9bedf"
    locators:
      - kind: https
        url: https://github.com/rpm-software-management/librepo/archive/refs/tags/1.22.0.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [cmake, make, gcc, bash, coreutils, pkgconf]
  sysroot: [glib2-devel, libcurl-devel, libxml2-devel, openssl-devel, rpm-devel, zchunk-devel]
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -DENABLE_TESTS=OFF
          - -DENABLE_DOCS=OFF
          - -DENABLE_EXAMPLES=OFF
          - -DENABLE_PYTHON=OFF
          - -DENABLE_SELINUX=OFF
          - -DENABLE_STATIC=OFF
          - -DUSE_GPGME=OFF
          - -DWITH_ZCHUNK=ON
    - uses: cmake/build
    - uses: cmake/install
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [librepo, librepo-devel]
    - uses: strip

outputs:
  - name: librepo
    summary: Repodata downloading library
    files:
      include:
        - /usr/lib*/librepo.so.*
        - /usr/share/licenses/librepo/**
      license:
        - /usr/share/licenses/librepo/**
    dependencies:
      run:
        - glib2
        - libcurl
        - libxml2
        - openssl-libs
        - rpm-libs
        - zchunk-libs
        - filesystem
    tests:
      - name: installed
        stage: installed
        packages: [bash-binsh, coreutils, gcc, pkgconf]
        argv:
          - sh
          - -c
          - |
            for lib in /usr/lib64/librepo.so.* /usr/lib/librepo.so.*; do
              test -e "$lib" && exit 0
            done
            exit 1

  - name: librepo-devel
    summary: Development files for librepo
    files:
      include:
        - "@dev"
        - /usr/share/licenses/librepo-devel/**
      license:
        - /usr/share/licenses/librepo-devel/**
    dependencies:
      run:
        - librepo = ${package.version}-${package.release}
        - filesystem
    tests:
      - name: link
        stage: installed
        packages: [bash-binsh, coreutils, gcc, pkgconf]
        argv:
          - sh
          - -c
          - |
            printf '#include <librepo/librepo.h>\nint main(void){return 0;}\n' > /tmp/librepo.c
            gcc /tmp/librepo.c $(pkg-config --cflags --libs librepo) -o /tmp/librepo-test
            /tmp/librepo-test
