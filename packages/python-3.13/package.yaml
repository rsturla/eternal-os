# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Python 3.13, one of the supported interpreter streams. Part of the Python
# ecosystem still targets 3.13. The toolchain needs
# it twice over: glibc and GCC run Python scripts in their build, and several
# recipes in this repository generate files with it.
#
# The version is part of the package name, like glibc and Lua, and the
# installed tree carries it as well: the standard library lives in
# `/usr/lib/python3.13`, the shared library is `libpython3.13.so.1.0` and the
# headers are under `/usr/include/python3.13`. Multiple streams can be
# installed at once, and `python-3.13-default` is the only output that owns the
# unversioned `/usr/bin/python3`. The `-default` outputs conflict, so a root
# installs exactly one of them.
#
# The interpreter is built against the system copy of every optional module
# library (expat, libffi, readline, sqlite, OpenSSL, zlib, bzip2, xz) so
# that a rebuild never links a vendored copy, and without the static library
# and the test modules, which a container distribution does not ship.
schema: 1

package:
  name: python-3.13
  version: "3.13.18"
  release: 4
  summary: The Python programming language (version 3.13)
  description: |
    Python is an interpreted, interactive, object-oriented programming
    language. This package provides the 3.13 language stream with a versioned
    interpreter, standard library, shared library and development files so
    several Python versions can be installed side by side.
  license: PSF-2.0
  upstream: https://www.python.org/
  cpe:
    vendor: python
    product: python

sources:
  - name: Python-3.13.18.tar.xz
    kind: archive
    digest: "sha512:ef5cd2e1f31411cddb0f1ee8fe64cdcd94b6a3ab260d42e57182859d45345f447b0c0b0be0cd3302fad653e919af39881cd8368e0cb7932df6d90999b5335953"
    locators:
      - kind: https
        url: https://www.python.org/ftp/python/3.13.18/Python-3.13.18.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf, sed, grep, diffutils, findutils]
  sysroot:
    - bzip2-devel
    - expat-devel
    - libffi-devel
    - ncurses-devel
    - openssl-devel
    - readline-devel
    - sqlite-devel
    - xz-devel
    - zlib-devel
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-shared
          - --without-static-libpython
          - --disable-test-modules
          - --without-ensurepip
          - --with-system-expat
          - --with-platlibdir=lib
          - --enable-loadable-sqlite-extensions
    - uses: make/build
    - uses: make/install
    - runs: |
        set -eu
        # The unversioned interpreter name belongs to the -default output.
        ln -sfn python3.13 "$STAGE/usr/bin/python3"
        # `make install` also writes unversioned development names. They would
        # be claimed by the streams' -devel outputs, and a tree that builds
        # extensions for two interpreters has to install both. Every consumer
        # takes the version: `python3.13-config`, `pkg-config python3.13`.
        rm -f "$STAGE/usr/bin/python3-config" "$STAGE$LIBDIR/pkgconfig/python3.pc"
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [python-3.13, python-3.13-libs, python-3.13-default, python-3.13-devel, python-3.13-doc]
    - uses: strip

outputs:
  - name: python-3.13
    summary: The Python programming language (version 3.13)
    files:
      license:
        - /usr/share/licenses/python-3.13/LICENSE
    dependencies:
      run:
        - python-3.13-libs = ${package.version}-${package.release}
      provides:
        - python-3.13 = ${package.version}-${package.release}
        - python3.13 = ${package.version}-${package.release}
    tests:
      - name: stdlib-and-native-modules
        stage: installed
        packages:
          - bash
        files: tests
        script: |
          python3.13 -I "$TEST_FILES/runtime.py" 3.13
      - name: syntax-error
        stage: installed
        packages:
          - bash
          - coreutils
        script: |
          status=0
          python3.13 -I -c 'def broken(' >stdout.log 2>syntax.stderr || status=$?
          test "$status" = 1
          case "$(<syntax.stderr)" in
            *SyntaxError*) ;;
            *) echo 'Python did not report the expected syntax error' >&2; exit 1 ;;
          esac
        artifacts:
          - syntax.stderr
      - name: coexistence
        stage: installed
        packages: [bash, coreutils, python-3.14-default]
        script: |
          test "$(readlink /usr/bin/python3)" = python3.14
          python3.13 -I -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 14)'
  - name: python-3.13-libs
    summary: Python 3.13 runtime library
    files:
      include:
        - /usr/lib*/libpython3.13.so.*
        - /usr/share/licenses/python-3.13-libs/LICENSE
      license:
        - /usr/share/licenses/python-3.13-libs/LICENSE
    tests:
      - name: load-runtime
        stage: installed
        packages:
          - bash
          - python-3.13
        script: |
          python3.13 -I -c 'import ctypes; lib=ctypes.CDLL("libpython3.13.so.1.0"); lib.Py_GetVersion.restype=ctypes.c_char_p; assert lib.Py_GetVersion().startswith(b"3.13.")'
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libpython3.13.so.*"]
  - name: python-3.13-default
    summary: Unversioned Python 3.13 command names
    files:
      include:
        - /usr/bin/python3
        - /usr/bin/pydoc3
        - /usr/bin/idle3
        - /usr/share/licenses/python-3.13-default/LICENSE
      license:
        - /usr/share/licenses/python-3.13-default/LICENSE
    dependencies:
      run:
        - python-3.13 = ${package.version}-${package.release}
      provides:
        - python3 = ${package.version}-${package.release}
      conflicts:
        - python-3.11-default
        - python-3.12-default
        - python-3.14-default
        - python-3.15-default
    tests:
      - name: default-interpreter
        stage: installed
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          test "$(readlink /usr/bin/python3)" = python3.13
          python3 -I "$TEST_FILES/runtime.py" 3.13
          pydoc3 json > json-help.txt
          test -s json-help.txt
  - name: python-3.13-devel
    summary: Development files for Python 3.13
    files:
      include:
        - "@dev"
        - /usr/include/python3.13/**
        - /usr/lib*/python3.13/config-3.13/**
        - /usr/bin/python3.13-config
        - /usr/share/licenses/python-3.13-devel/LICENSE
      license:
        - /usr/share/licenses/python-3.13-devel/LICENSE
    dependencies:
      run:
        - python-3.13-libs = ${package.version}-${package.release}
    tests:
      - name: embed-and-extension
        stage: installed
        packages:
          - bash
          - gcc
          - pkgconf
          - python-3.13
        files: tests
        script: |
          gcc "$TEST_FILES/embed.c" $(python3.13-config --embed --cflags --ldflags) -o embed
          ./embed
          gcc -shared -fPIC "$TEST_FILES/extension.c" $(python3.13-config --cflags --ldflags) -o "probe$(python3.13-config --extension-suffix)"
          python3.13 -c 'import probe; assert probe.answer() == 42'
          pkg-config --exists python-3.13-embed
  - name: python-3.13-doc
    summary: Documentation for Python 3.13
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/python-3.13-doc/LICENSE
      license:
        - /usr/share/licenses/python-3.13-doc/LICENSE

tests:
  - name: hardening
    stage: build
    pipeline:
      # The launcher only forwards to Py_BytesMain: it has no stack buffer and
      # no libc call to fortify, so those two properties cannot appear in it.
      # They are checked on the library, where the interpreter actually lives.
      - uses: test/hardening-check
        with:
          paths: [/usr/bin/python3.13]
          skip: [stack-protector, fortify]
      - uses: test/hardening-check
        with:
          paths: [/usr/lib64/libpython3.13.so.1.0]
          skip: [pie]
