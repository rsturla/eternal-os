# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# A library implementing the zlib compression algorithms. A dependency for the minimal Eternal build root.
schema: 1

package:
  name: zlib
  version: "1.4"
  release: 1
  summary: A library implementing the zlib compression algorithms
  description: |
    zlib is a massively spiffy yet delicately unobtrusive compression library.
  license: Zlib
  upstream: https://zlib.net/
  cpe:
    vendor: zlib
    product: zlib

sources:
  - name: zlib-1.4.tar.xz
    kind: archive
    digest: "sha512:c6701ef216f2ea451056466794c520df62af0a7ddf57c907c3263678dc625f3d6466e0187106dec0d7721ad6fc6cf105e0f93a4cac82fbcc2ba919eebd29c0b0"
    locators:
      - kind: https
        url: https://zlib.net/zlib-1.4.tar.xz
      - kind: https
        url: https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args: [--shared]
    - uses: make/build
    - uses: make/install
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [zlib, zlib-devel, zlib-static, zlib-doc]
    - uses: strip

outputs:
  - name: zlib
    summary: A library implementing the zlib compression algorithms
    files:
      license:
        - /usr/share/licenses/zlib/LICENSE
    dependencies:
      provides:
        - zlib-ng-compat = ${package.version}-${package.release}
    tests:
      - name: runtime-linkage
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libz.so.*"]
  - name: zlib-devel
    summary: zlib development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/zlib-devel/LICENSE
      exclude:
        - /usr/lib*/lib*.a
      license:
        - /usr/share/licenses/zlib-devel/LICENSE
    dependencies:
      run:
        - zlib = ${package.version}-${package.release}
      provides:
        - zlib-ng-compat-devel = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists zlib
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags zlib) "$TEST_FILES/behavior.c" $(pkg-config --libs zlib) -o behavior
          ./behavior
  - name: zlib-static
    summary: zlib static library
    files:
      include:
        - "@static"
        - /usr/share/licenses/zlib-static/LICENSE
      license:
        - /usr/share/licenses/zlib-static/LICENSE
    dependencies:
      run:
        - zlib-devel = ${package.version}-${package.release}
      provides:
        - zlib-ng-compat-static = ${package.version}-${package.release}
    tests:
      - name: static-api-behavior
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - pkgconf
          - binutils
          - grep
        files: tests
        script: |
          pkg-config --exists zlib
          private_libs=()
          for flag in $(pkg-config --static --libs zlib); do
            if test "$flag" != -lz; then private_libs+=("$flag"); fi
          done
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags zlib) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir zlib)/libz.a" "$${private_libs[@]}" -o behavior
          ./behavior
          readelf -d behavior > dynamic.txt
          if grep -E 'NEEDED.*\[libz\.so' dynamic.txt; then
            echo "static test linked the shared library" >&2
            exit 1
          fi
  - name: zlib-doc
    summary: zlib documentation
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/zlib-doc/LICENSE
      license:
        - /usr/share/licenses/zlib-doc/LICENSE

tests:
  - name: upstream
    stage: build
    packages:
      - diffutils
    artifacts:
      - test-suite.log
      - tests/test-suite.log
    pipeline:
      - uses: make/check
