# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# RPM package manager. Built with the sqlite rpmdb, Sequoia OpenPGP backend and
# the compression libraries needed to read rpm-md repositories.
schema: 1

package:
  name: rpm
  version: "6.1.0"
  release: 3
  summary: The RPM package manager
  description: |
    RPM is a powerful command line driven package management system capable of
    installing, uninstalling, verifying, querying and updating software
    packages. This build provides the runtime libraries and tools used by
    dnf5 and libdnf5.
  license: GPL-2.0-or-later AND LGPL-2.1-or-later
  upstream: https://rpm.org/
  cpe:
    vendor: rpm
    product: rpm

context: files

sources:
  - name: rpm-6.1.0.tar.gz
    kind: archive
    digest: "sha512:988f57c3bcfb4b33e271d00dc4992e0cf0867b775f72864256f02e2996d00456d8aaa15c94428517e29b297e93fb68d173e3f7068dba7653d8eb226857868c09"
    locators:
      - kind: https
        url: https://github.com/rpm-software-management/rpm/archive/refs/tags/rpm-6.1.0-release.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [cmake, make, gcc, gcc-c++, bash, coreutils, pkgconf, python3, scdoc]
  sysroot:
    - bzip2-devel
    - file-devel
    - libacl-devel
    - libarchive-devel
    - libcap-devel
    - libselinux-devel
    - lua-devel
    - popt-devel
    - rpm-sequoia-devel
    - sqlite-devel
    - xz-devel
    - zlib-devel
    - zstd-devel
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -DENABLE_NLS=OFF
          - -DENABLE_OPENMP=OFF
          - -DENABLE_PYTHON=OFF
          - -DENABLE_PLUGINS=OFF
          - -DENABLE_SQLITE=ON
          - -DENABLE_NDB=OFF
          - -DENABLE_BDB_RO=OFF
          - -DENABLE_TESTSUITE=OFF
          - -DWITH_CAP=ON
          - -DWITH_ACL=ON
          - -DWITH_SELINUX=ON
          - -DWITH_DBUS=OFF
          - -DWITH_AUDIT=OFF
          - -DWITH_FSVERITY=OFF
          - -DWITH_IMAEVM=OFF
          - -DWITH_FAPOLICYD=OFF
          - -DWITH_SEQUOIA=ON
          - -DWITH_READLINE=OFF
          - -DWITH_BZIP2=ON
          - -DWITH_ICONV=ON
          - -DWITH_ZSTD=ON
          - -DWITH_LIBDW=OFF
          - -DWITH_LIBELF=OFF
          - -DWITH_LIBLZMA=ON
    - uses: cmake/build
    - uses: cmake/install
    - runs: |
        install -Dm0644 macros.eternal "$STAGE/usr/lib/rpm/macros.d/macros.eternal"
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [rpm, rpm-libs, rpm-build-libs, rpm-devel, rpm-doc]
    - uses: strip

outputs:
  - name: rpm
    summary: RPM package manager tools
    files:
      include:
        - /usr/bin/*
        - /usr/lib/rpm/**
        - /usr/share/licenses/rpm/**
      exclude:
        - /usr/lib/rpm/rpmrc
        - /usr/lib/rpm/macros
        - /usr/lib/rpm/macros.d/**
        - /usr/lib/rpm/platform/**
      license:
        - /usr/share/licenses/rpm/**
    dependencies:
      run:
        - rpm-libs = ${package.version}-${package.release}
        - rpm-build-libs = ${package.version}-${package.release}
        - popt
    tests:
      - name: macros-and-query
        stage: installed
        packages:
          - bash
        script: |
          rpm --version
          rpmbuild --version
          rpm -q rpm
          test "$(rpm --eval '%{expr:6*7}')" = 42
          test "$(rpm --eval '%{_prefix}')" = /usr
          if rpm -q eternal-rpmx-deliberately-absent; then exit 1; fi
      - name: openpgp-signatures
        stage: installed
        packages: [coreutils, grep]
        files: tests
        script: |
          bash "$TEST_FILES/signatures.sh"
        artifacts:
          - untrusted.verify
          - trusted.verify
          - tampered.verify
      - name: build-install-upgrade-verify-erase
        stage: transaction
        packages:
          - bash
          - coreutils
          - grep
        files: tests
        script: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          for version in 1 2; do
           rpmbuild -bb "$TEST_FILES/probe.spec" --define "_topdir $PWD/rpmbuild" \
             --define "probe_version $version" --define '__os_install_post %{nil}'
          done
          rpm -K --nosignature rpmbuild/RPMS/noarch/eternal-rpmx-probe-1-1.noarch.rpm
          cp rpmbuild/RPMS/noarch/eternal-rpmx-probe-1-1.noarch.rpm corrupt.rpm
          size=$(stat -c %s corrupt.rpm)
          last=$(od -An -tu1 -j "$((size - 1))" -N1 corrupt.rpm)
          printf -v octal '%03o' "$((last ^ 255))"
          printf '%b' "\\$octal" | dd of=corrupt.rpm bs=1 seek="$((size - 1))" conv=notrunc status=none
          if rpm -K --nosignature corrupt.rpm > corrupt.verify 2>&1; then
            echo 'RPM accepted a corrupted payload' >&2
            exit 1
          fi
          test -s corrupt.verify
          rpm -i --nosignature rpmbuild/RPMS/noarch/eternal-rpmx-probe-1-1.noarch.rpm
          test "$(rpm -q --qf '%{VERSION}' eternal-rpmx-probe)" = 1
          test "$(cat /usr/share/eternal-rpmx-probe/payload)" = payload-1
          rpm -V eternal-rpmx-probe
          printf 'operator setting\n' > /etc/eternal-rpmx-probe.conf
          if rpm -V eternal-rpmx-probe > modified.txt; then exit 1; fi
          grep '/etc/eternal-rpmx-probe.conf' modified.txt
          rpm -U --nosignature rpmbuild/RPMS/noarch/eternal-rpmx-probe-2-1.noarch.rpm
          test "$(rpm -q --qf '%{VERSION}' eternal-rpmx-probe)" = 2
          test "$(cat /usr/share/eternal-rpmx-probe/payload)" = payload-2
          test "$(cat /etc/eternal-rpmx-probe.conf)" = 'operator setting'
          test "$(cat /etc/eternal-rpmx-probe.conf.rpmnew)" = default-2
          rpm -e eternal-rpmx-probe
          if rpm -q eternal-rpmx-probe; then exit 1; fi
          test ! -e /usr/share/eternal-rpmx-probe/payload
          test "$(cat /etc/eternal-rpmx-probe.conf.rpmsave)" = 'operator setting'
        artifacts:
          - modified.txt
          - corrupt.verify
  - name: rpm-libs
    summary: Libraries for manipulating RPM packages
    files:
      include:
        - /usr/lib*/librpm.so.*
        - /usr/lib*/librpmio.so.*
        - /usr/lib*/librpmsign.so.*
        # librpm consumers initialize these defaults without the rpm CLI.
        - /usr/lib/rpm/rpmrc
        - /usr/lib/rpm/macros
        - /usr/lib/rpm/macros.d/**
        - /usr/lib/rpm/platform/**
        - /usr/share/licenses/rpm-libs/**
      license:
        - /usr/share/licenses/rpm-libs/**
    dependencies:
      run:
        - bzip2-libs
        - file-libs
        - libacl
        - libarchive
        - libcap
        - libselinux
        - libstdc++
        - lua-libs
        - popt
        - rpm-sequoia >= 1.9.0
        - sqlite-libs
        - xz-libs
        - zlib
        - zstd-libs
    tests:
      - name: runtime-loader
        stage: installed
        packages:
          - bash
          - python3
        script: |
          python3 -I - <<'PYTHON'
          import ctypes, glob, os
          for name in ['librpm', 'librpmio', 'librpmsign']:
              paths=glob.glob('/usr/lib*/' + name + '.so.*')
              assert paths, name
              ctypes.CDLL(paths[0], mode=os.RTLD_NOW)
          PYTHON
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["librpm.so.*", "librpmio.so.*", "librpmsign.so.*"]
      - name: runtime-configuration
        stage: installed
        packages:
          - python3
        files: tests
        script: |
          python3 -I "$TEST_FILES/runtime-configuration.py"
  - name: rpm-build-libs
    summary: Libraries for building RPM packages
    files:
      include:
        - /usr/lib*/librpmbuild.so.*
        - /usr/share/licenses/rpm-build-libs/**
      license:
        - /usr/share/licenses/rpm-build-libs/**
    dependencies:
      run:
        - rpm-libs = ${package.version}-${package.release}
    tests:
      - name: runtime-loader
        stage: installed
        packages:
          - bash
          - python3
        script: |
          python3 -I - <<'PYTHON'
          import ctypes, glob, os
          for name in ['librpmbuild']:
              paths=glob.glob('/usr/lib*/' + name + '.so.*')
              assert paths, name
              ctypes.CDLL(paths[0], mode=os.RTLD_NOW)
          PYTHON
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["librpmbuild.so.*"]
  - name: rpm-devel
    summary: Development files for RPM
    files:
      include:
        - "@dev"
        - /usr/share/licenses/rpm-devel/**
      license:
        - /usr/share/licenses/rpm-devel/**
    dependencies:
      run:
        - rpm-libs = ${package.version}-${package.release}
        - rpm-build-libs = ${package.version}-${package.release}
        - bzip2-devel
        - libacl-devel
        - libcap-devel
        - libselinux-devel
        - lua-devel
        - popt-devel
        - sqlite-devel
        - xz-devel
        - zlib-devel
        - zstd-devel
    tests:
      - name: macro-and-transaction-api
        stage: installed
        packages:
          - bash
          - gcc
          - pkgconf
        files: tests
        script: |
          gcc "$TEST_FILES/api.c" $(pkg-config --cflags --libs rpm) -o api
          ./api
  - name: rpm-doc
    summary: Documentation for RPM
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/rpm-doc/**
      license:
        - /usr/share/licenses/rpm-doc/**
