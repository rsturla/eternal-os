# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/py3-calver.yaml
schema: 2
package:
  name: python-calver
  version: 2025.10.20
  release: 2
  summary: Setuptools support for calendar versioning
  license: Apache-2.0
  upstream: https://github.com/di/calver
sources:
- name: calver-2025.10.20.tar.gz
  kind: archive
  digest: sha512:7fd26bc607328ee62b4bc8f19eb356c2b5f3d604c4ed7ea7a345b48e452e4cb3c64db9100ed8087c00e03b0cb0bee7aa69b93cca0f1ed9fa1dc1150a63799743
  locators:
  - kind: https
    url: https://files.pythonhosted.org/packages/4a/96/0c57e3e228ffc54074867406b659b197678674f1f0bf600d114965289834/calver-2025.10.20.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
matrix:
  axes:
    python:
    - value: '3.11'
      version: '3.11'
      slug: py311
      package: python-3.11
    - value: '3.12'
      version: '3.12'
      slug: py312
      package: python-3.12
    - value: '3.13'
      version: '3.13'
      slug: py313
      package: python-3.13
    - value: '3.14'
      version: '3.14'
      slug: py314
      package: python3.14
    - value: '3.15'
      version: '3.15'
      slug: py315
      package: python-3.15
  max-cells: 5
  release-suffix: true
build:
  root:
    profile: ../../profiles/bootstrap-python.profile.yaml
  packages:
  - bash
  - coreutils
  - python3.14
  - ${matrix.python.package}
  - python-3.14-setuptools
  pipeline:
  - uses: python/build-wheel
    with:
      python: python3.14
      build-package: python-3.14-build
  - uses: python/install-wheel
    with:
      python: /usr/bin/python${matrix.python.version}
      pip-python: python3.14
      script-version: ${matrix.python.version}
      pip-package: python-3.14-pip
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - python-${matrix.python.version}-calver
outputs:
- name: python-${matrix.python.version}-calver
  arch: noarch
  files:
    license:
    - /usr/share/licenses/python-${matrix.python.version}-calver/**
  tests:
  - name: offline-behavior
    files: tests
    script: |
      /usr/bin/python${matrix.python.version} -I "$TEST_FILES/check.py" "${matrix.python.version}" "calver" "${package.version}"
