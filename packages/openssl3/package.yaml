# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Use the supported 3.5 LTS series to retain the libssl.so.3 ABI.
# Install the software and configuration without the optional documentation.
schema: 1
package:
  name: openssl3
  version: 3.5.9
  release: 2
  summary: TLS tools and cryptographic libraries
  description: TLS tools and cryptographic libraries.
  license: Apache-2.0
  upstream: https://openssl-library.org/
  cpe:
    vendor: openssl
    product: openssl
sources:
- name: openssl-3.5.9.tar.gz
  kind: archive
  digest: sha512:c4c8136fd2c98d13bb85a57bfb0def25c906f47f1fe97675cd114594944eab957b5b81a3e0f48826e1a0f093afff5e83766b539d49768f6db68310fd678d7de6
  locators:
  - kind: https
    url: https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
  - kind: https
    url: https://www.openssl.org/source/openssl-3.5.9.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - perl
  pipeline:
  - runs: |
      # AF_ALG is an optional kernel engine; engines-3 is not shipped below.
      perl ./Configure --prefix="$PREFIX" --libdir="$LIBDIR" --openssldir=/etc/ssl shared no-afalgeng no-zlib no-ssl3 no-weak-ssl-ciphers enable-pie
  - uses: make/build
  - uses: make/build
    with:
      args:
      - DESTDIR="$STAGE"
      - install_sw
      - install_ssldirs
  - runs: |
      rm -f "$STAGE/usr/bin/c_rehash"
      rm -rf "$STAGE/etc/ssl/misc"
      rm -f "$STAGE"/usr/lib*/libssl.a "$STAGE"/usr/lib*/libcrypto.a
      rm -rf "$STAGE$LIBDIR/engines-3"
      rm -f "$STAGE$LIBDIR/ossl-modules/legacy.so"
  - uses: license/copy
    with:
      files:
      - LICENSE.txt
      outputs:
      - openssl3
      - openssl3-libs
      - openssl3-devel
  - uses: strip
outputs:
- name: openssl3
  files:
    license:
    - /usr/share/licenses/openssl3/**
  dependencies:
    run:
    - openssl3-libs = ${package.version}-${package.release}
    provides:
    - openssl = ${package.version}-${package.release}
  tests:
  - name: digest
    stage: installed
    packages:
    - grep
    script: |
      printf abc | openssl dgst -sha256 > /tmp/digest
      grep -q ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad /tmp/digest
  - name: signatures-and-certificates
    stage: installed
    script: |
      printf 'signed payload\n' > payload
      openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out key.pem
      openssl pkey -in key.pem -pubout -out public.pem
      openssl dgst -sha256 -sign key.pem -out signature payload
      openssl dgst -sha256 -verify public.pem -signature signature payload
      printf 'tampered payload\n' > payload
      if openssl dgst -sha256 -verify public.pem -signature signature payload; then
        echo "signature verification accepted tampered data" >&2
        exit 1
      fi
      openssl req -new -x509 -key key.pem -subj /CN=eternal-test -days 1 -out certificate.pem
      openssl verify -CAfile certificate.pem certificate.pem
      openssl x509 -in certificate.pem -noout -checkhost eternal-test
      if openssl x509 -in certificate.pem -noout -checkhost wrong.example; then
        echo "certificate matched wrong hostname" >&2
        exit 1
      fi
- name: openssl3-libs
  files:
    license:
    - /usr/share/licenses/openssl3-libs/**
    include:
    - /usr/lib*/libssl.so.*
    - /usr/lib*/libcrypto.so.*
    - /etc/ssl/**
    - /usr/share/licenses/openssl3-libs/**
    config:
    - /etc/ssl/openssl.cnf
    - /etc/ssl/ct_log_list.cnf
    noreplace:
    - /etc/ssl/openssl.cnf
    - /etc/ssl/ct_log_list.cnf
  dependencies:
    provides:
    - openssl-libs = ${package.version}-${package.release}
  tests:
  - name: runtime-linkage
    stage: installed
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libssl.so.*", "libcrypto.so.*"]
  - name: python-tls-consumer
    stage: installed
    packages:
    - python-3.14
    files: tests
    script: |
      python3.14 "$TEST_FILES/python_tls.py"
- name: openssl3-devel
  files:
    license:
    - /usr/share/licenses/openssl3-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/openssl3-devel/**
  dependencies:
    run:
    - openssl3-libs = ${package.version}-${package.release}
    provides:
    - openssl-devel = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists openssl
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags openssl) "$TEST_FILES/behavior.c" $(pkg-config --libs openssl) -o behavior
      ./behavior
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
- name: upstream
  stage: build
  packages:
  - make
  - perl
  - diffutils
  - nss_wrapper-libs
  files: tests
  artifacts:
  - test-runs
  - test/test-runs
  - upstream-hosts
  script: |
    bash "$TEST_FILES/upstream.sh"
