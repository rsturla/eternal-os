# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Omit the migration script, which needs optional Python bindings.
schema: 2
package:
  name: libsemanage
  version: '3.11'
  release: 1
  summary: SELinux policy management library
  description: SELinux policy management library.
  license: LGPL-2.1-or-later
  upstream: https://github.com/SELinuxProject/selinux
  cpe:
    vendor: selinuxproject
    product: libsemanage
sources:
- name: libsemanage-3.11.tar.gz
  kind: archive
  digest: sha512:cafcdac9ba9a65f7940929f3e36e7e35ece6ef5cb97723e459ba7fdaaf937708873cb1c273733830f7fc54679c4cf6ae0189322231748d318a6db2851db1d11a
  locators:
  - kind: https
    url: https://github.com/SELinuxProject/selinux/releases/download/3.11/libsemanage-3.11.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - flex
  - bison
  - pkgconf
  sysroot:
  - libselinux-devel
  - libsepol-devel
  - audit-libs-devel
  - bzip2-devel
  pipeline:
  - uses: make/build
    with:
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
  - uses: make/install
    with:
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
      dir: include
  - uses: make/install
    with:
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
      dir: src
  - uses: make/install
    with:
      args:
      - PREFIX="$PREFIX"
      - LIBDIR="$LIBDIR"
      - SHLIBDIR="$LIBDIR"
      dir: man
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - libsemanage
      - libsemanage-devel
      - libsemanage-static
      - libsemanage-doc
  - uses: strip
outputs:
- name: libsemanage
  files:
    license:
    - /usr/share/licenses/libsemanage/**
    config:
    - /etc/selinux/semanage.conf
    noreplace:
    - /etc/selinux/semanage.conf
  dependencies:
    run:
    - libselinux
    - libsepol
    - audit-libs
    - bzip2-libs
  tests:
  - name: runtime-linkage
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libsemanage.so.*"]
- name: libsemanage-devel
  files:
    license:
    - /usr/share/licenses/libsemanage-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/libsemanage-devel/**
  dependencies:
    run:
    - libsemanage = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists libsemanage
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libsemanage) "$TEST_FILES/behavior.c" $(pkg-config --libs libsemanage) -o behavior
      ./behavior
- name: libsemanage-static
  files:
    license:
    - /usr/share/licenses/libsemanage-static/**
    include:
    - '@static'
    - /usr/share/licenses/libsemanage-static/**
  dependencies:
    run:
    - libsemanage-devel = ${package.version}-${package.release}
    - audit-libs-devel
    - bzip2-devel
  tests:
  - name: static-api-behavior
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    - binutils
    - grep
    files: tests
    script: |
      pkg-config --exists libsemanage
      private_libs=()
      for flag in $(pkg-config --static --libs libsemanage); do
        if test "$flag" != -lsemanage; then private_libs+=("$flag"); fi
      done
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libsemanage) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir libsemanage)/libsemanage.a" "$${private_libs[@]}" -o behavior
      ./behavior
      readelf -d behavior > dynamic.txt
      if grep -E 'NEEDED.*\[libsemanage\.so' dynamic.txt; then
        echo "static test linked the shared library" >&2
        exit 1
      fi
- name: libsemanage-doc
  files:
    license:
    - /usr/share/licenses/libsemanage-doc/**
    include:
    - '@man'
    - /usr/share/licenses/libsemanage-doc/**
tests:
- name: hardening
  pipeline:
  - uses: test/hardening-check
patches:
- file: patches/0001-reject-relative-home-directories.patch
  strip: 2
  reason: Backport upstream ed3001e29f66ce63ccdbd21420c1447522fe2f83 from Fedora; reject invalid home directories before policy generation
