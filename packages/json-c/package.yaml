# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# JSON implementation in C.
schema: 2

package:
  name: json-c
  version: "0.19"
  release: 1
  summary: JSON implementation in C
  description: |
    JSON-C implements a reference counting object model that allows you to
    easily construct JSON objects in C, output them as JSON formatted strings
    and parse JSON formatted strings back into the C representation of JSON
    objects.
  license: MIT
  upstream: https://github.com/json-c/json-c
  cpe:
    vendor: json-c
    product: json-c

sources:
  - name: json-c-0.19-20260627.tar.gz
    kind: archive
    digest: "sha512:3be9058351acb3d9a66c7ae850391ebaa80472b42ee3f013f8b655743eb41b55513e0546c6798399af98ed049b80d11c93286ea3f5af26dc5f199905a28c4db1"
    locators:
      - kind: https
        url: https://github.com/json-c/json-c/archive/refs/tags/json-c-0.19-20260627.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [cmake, make, gcc, bash, coreutils]
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -DBUILD_SHARED_LIBS=ON
          - -DBUILD_APPS=OFF
          - -DBUILD_TESTING=ON
          - -DDISABLE_WERROR=ON
    - uses: cmake/build
    - uses: cmake/install
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [json-c, json-c-devel, json-c-static]
    - uses: strip

  tests:
    - name: upstream
      packages: [xxd]
      artifacts:
        - build/Testing
      pipeline:
        - runs: |
            # The CLI test needs json_parse, which production builds omit.
            # Build it after staging so it cannot change the package payload.
            cmake -S . -B build -DBUILD_APPS=ON
            cmake --build build --target json_parse --parallel "$JOBS"
        - uses: cmake/check

outputs:
  - name: json-c
    summary: JSON parsing library
    files:
      include:
        - /usr/lib*/libjson-c.so.*
        - /usr/share/licenses/json-c/**
      license:
        - /usr/share/licenses/json-c/**
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libjson-c.so.*"]
  - name: json-c-devel
    summary: Development files for json-c
    files:
      include:
        - "@dev"
        - /usr/share/licenses/json-c-devel/**
      license:
        - /usr/share/licenses/json-c-devel/**
    dependencies:
      run:
        - json-c = ${package.version}-${package.release}
    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists json-c
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags json-c) "$TEST_FILES/behavior.c" $(pkg-config --libs json-c) -o behavior
          ./behavior
  - name: json-c-static
    summary: Static json-c library
    files:
      include:
        - /usr/lib*/libjson-c.a
        - /usr/share/licenses/json-c-static/**
      license:
        - /usr/share/licenses/json-c-static/**
    dependencies:
      run:
        - json-c-devel = ${package.version}-${package.release}
    tests:
      - name: static-api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
          - binutils
          - grep
        files: tests
        script: |
          pkg-config --exists json-c
          private_libs=()
          for flag in $(pkg-config --static --libs json-c); do
            if test "$flag" != -ljson-c; then private_libs+=("$flag"); fi
          done
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags json-c) "$TEST_FILES/behavior.c" "$(pkg-config --variable=libdir json-c)/libjson-c.a" "$${private_libs[@]}" -o behavior
          ./behavior
          readelf -d behavior > dynamic.txt
          if grep -E 'NEEDED.*\[libjson-c\.so' dynamic.txt; then
            echo "static test linked the shared library" >&2
            exit 1
          fi
