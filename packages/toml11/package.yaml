# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Upstream publishes source tags but no separate release tarball.
# The header-only library needs only a development output.
schema: 1
package:
  name: toml11
  version: 4.4.0
  release: 1
  summary: Header-only C++ TOML parser
  description: Header-only C++ TOML parser.
  license: MIT
  upstream: https://github.com/ToruNiina/toml11
sources:
- name: toml11-4.4.0.tar.gz
  kind: archive
  digest: sha512:1779c6b21a0a4000f49e5bf3a8b1288989622eb4a4e365cd6c49d9a8cc859ad18514b94dca63bd8a49f554aa7387882a1a089fadde267cebdf2a8aa49aacd11b
  locators:
  - kind: https
    url: https://github.com/ToruNiina/toml11/archive/refs/tags/v4.4.0.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc-c++
  - cmake
  - make
  - bash
  - coreutils
  pipeline:
  - uses: cmake/configure
    with:
      args:
      - -DTOML11_PRECOMPILE=OFF
      - -DTOML11_BUILD_TESTS=OFF
      - -DTOML11_BUILD_EXAMPLES=OFF
      - -DCMAKE_INSTALL_LIBDIR=share
  - uses: cmake/build
  - uses: cmake/install
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - toml11-devel
outputs:
- name: toml11-devel
  files:
    license:
    - /usr/share/licenses/toml11-devel/**
  arch: noarch
  tests:
  - name: api-behavior
    stage: installed
    packages:
    - gcc-c++
    - glibc-devel
    files: tests
    script: |
      g++ -std=c++17 -Wall -Wextra  "$TEST_FILES/behavior.cc"  -o behavior
      ./behavior
