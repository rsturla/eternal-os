# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/py3-setuptools-scm.yaml
schema: 2
package:
  name: python-setuptools-scm
  version: 10.3.4
  release: 2
  summary: Setuptools versions from version control metadata
  license: MIT
  upstream: https://setuptools-scm.readthedocs.io/
sources:
- name: setuptools_scm-10.3.4.tar.gz
  kind: archive
  digest: sha512:e78e0563aec6b9ae5b1f445cee5515c4db85d9533d720d04a68edb3d1f0399c79ccefff0338a026ca0fb4bc6d4a57d7e22074a4560c875a64ec67f0369f527a0
  locators:
  - kind: https
    url: https://files.pythonhosted.org/packages/85/d8/fc143f88819ccf10ba2388ba86732ee2de193e578234e25a783f6cc14bf7/setuptools_scm-10.3.4.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
matrix:
  axes:
    python:
    - value: '3.11'
      version: '3.11'
      slug: py311
      package: python-3.11
    - value: '3.12'
      version: '3.12'
      slug: py312
      package: python-3.12
    - value: '3.13'
      version: '3.13'
      slug: py313
      package: python-3.13
    - value: '3.14'
      version: '3.14'
      slug: py314
      package: python3.14
    - value: '3.15'
      version: '3.15'
      slug: py315
      package: python-3.15
  max-cells: 5
  release-suffix: true
build:
  root:
    profile: ../../profiles/bootstrap-python.profile.yaml
  packages:
  - bash
  - coreutils
  - python3.14
  - ${matrix.python.package}
  - python-3.14-setuptools
  - python-3.14-vcs-versioning
  pipeline:
  - uses: python/build-wheel
    with:
      python: python3.14
      build-package: python-3.14-build
  - uses: python/install-wheel
    with:
      python: /usr/bin/python${matrix.python.version}
      pip-python: python3.14
      script-version: ${matrix.python.version}
      pip-package: python-3.14-pip
  - uses: license/copy
    with:
      files:
      - LICENSE
      outputs:
      - python-${matrix.python.version}-setuptools-scm
outputs:
- name: python-${matrix.python.version}-setuptools-scm
  arch: noarch
  files:
    license:
    - /usr/share/licenses/python-${matrix.python.version}-setuptools-scm/**
  dependencies:
    run:
    - python-${matrix.python.version}-setuptools
    - python-${matrix.python.version}-vcs-versioning
    - python-${matrix.python.version}-packaging
  tests:
  - name: behavior
    files: tests
    packages:
    - git
    script: |
      /usr/bin/python${matrix.python.version} -I "$TEST_FILES/test_behavior.py" "${matrix.python.version}" "setuptools-scm" "${package.version}"
