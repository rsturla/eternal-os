# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# libexslt has no fortifiable libc call. Check its other hardening properties.
# Check all properties on xsltproc and libxslt.
schema: 1
package:
  name: libxslt
  version: 1.1.45
  release: 1
  summary: XSLT transformation tools and libraries
  description: XSLT transformation tools and libraries.
  license: MIT
  upstream: https://gitlab.gnome.org/GNOME/libxslt
  cpe:
    vendor: xmlsoft
    product: libxslt
sources:
- name: libxslt-1.1.45.tar.xz
  kind: archive
  digest: sha512:8f0608aad7250ccfe62808169d464a1641535b41a73b4fbbc1eeec9c9e785bbd8f4860d571eb567ee1e7abbd89ac3d707a5f3e3a9e836ecaf38155793ce47d78
  locators:
  - kind: https
    url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.45.tar.xz
  extract:
    format: tar.xz
    strip-components: 1
build:
  root:
    # libxslt 1.1.45 needs libxml2 >= 2.15.1; the shared root still uses
    # Fedora's libxml2 for the rpm stack.
    profile: ../../profiles/bootstrap-libxslt.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - pkgconf
  sysroot:
  - libxml2-devel
  pipeline:
  - uses: autotools/configure
    with:
      args:
      - --disable-static
      - --without-python
      - --without-crypto
  - uses: make/build
  - uses: make/install
  - runs: |
      find "$STAGE" -name "*.la" -delete
      rm -f "$STAGE/usr/share/info/dir"
  - uses: license/copy
    with:
      files:
      - Copyright
      outputs:
      - libxslt
      - libxslt-libs
      - libxslt-devel
      - libxslt-doc
  - uses: strip
outputs:
- name: libxslt
  files:
    license:
    - /usr/share/licenses/libxslt/**
  dependencies:
    run:
    - libxslt-libs = ${package.version}-${package.release}
  tests:
  - name: transform
    stage: installed
    files: tests
    script: |
      test "$(xsltproc --nonet "$TEST_FILES/exslt.xsl" "$TEST_FILES/input.xml")" = 42
  - name: xslt-cli
    stage: installed
    files: tests
    script: |
      test "$(xsltproc --nonet "$TEST_FILES/transform.xsl" "$TEST_FILES/input.xml")" = 42
      if xsltproc --nonet "$TEST_FILES/input.xml" "$TEST_FILES/input.xml"; then
        echo "accepted an XML document as an XSLT stylesheet" >&2
        exit 1
      fi
- name: libxslt-libs
  files:
    license:
    - /usr/share/licenses/libxslt-libs/**
    include:
    - /usr/lib*/libxslt.so.*
    - /usr/lib*/libexslt.so.*
    - /usr/share/licenses/libxslt-libs/**
  dependencies:
    run:
    - libxml2
  tests:
  - name: runtime-linkage
    stage: installed
    pipeline:
      - uses: test/runtime-linkage
        with:
          libraries: ["libxslt.so.*", "libexslt.so.*"]
- name: libxslt-devel
  files:
    license:
    - /usr/share/licenses/libxslt-devel/**
    include:
    - '@dev'
    - /usr/bin/xslt-config
    - /usr/lib*/xsltConf.sh
    - /usr/share/licenses/libxslt-devel/**
  dependencies:
    run:
    - libxslt-libs = ${package.version}-${package.release}
  tests:
  - name: api-behavior
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    files: tests
    script: |
      pkg-config --exists libxslt libexslt
      gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libxslt libexslt) "$TEST_FILES/behavior.c" $(pkg-config --libs libxslt libexslt) -o behavior
      ./behavior
- name: libxslt-doc
  files:
    license:
    - /usr/share/licenses/libxslt-doc/**
    include:
    - '@doc'
    - '@man'
    - '@info'
    - /usr/share/licenses/libxslt-doc/**
    - /usr/share/gtk-doc/**
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
    with:
      skip:
      - fortify
  - uses: test/hardening-check
    with:
      paths:
      - /usr/bin/xsltproc
      - /usr/lib64/libxslt.so.${package.version}
      - /usr/lib/libxslt.so.${package.version}
