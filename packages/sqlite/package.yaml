# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# SQLite embedded database engine.
schema: 1

package:
  name: sqlite
  version: "3.54.1"
  release: 1
  summary: Library that implements an embeddable SQL database engine
  description: |
    SQLite is a C library that implements an embeddable SQL database engine.
    Programs that link with the SQLite library can have SQL database access
    without running a separate RDBMS process.
  license: blessing
  upstream: https://www.sqlite.org/
  cpe:
    vendor: sqlite
    product: sqlite

sources:
  - name: sqlite-autoconf-3540100.tar.gz
    kind: archive
    digest: "sha512:3df4348f54f5cd0554eec6d91e1d08a70535b7b78f497b2c6f24910b5087f6ef70483c9e35fa388bd8f38483cb8d1cb84e98ccdd58b9f525a10e0cf48c8c6742"
    locators:
      - kind: https
        url: https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, pkgconf]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --enable-shared
          - --enable-threadsafe
          - --enable-load-extension
          - --enable-fts3
          - --enable-fts4
          - --enable-fts5
          - --enable-rtree
          - --enable-session
          - --soname=legacy
    - uses: make/build
    - uses: make/install
    - uses: license/copy
      with:
        files: [README.txt]
        outputs: [sqlite, sqlite-libs, sqlite-devel, sqlite-doc]
    - uses: strip

outputs:
  - name: sqlite
    summary: SQLite command line shell
    files:
      include:
        - /usr/bin/sqlite3
        - /usr/share/licenses/sqlite/**
      license:
        - /usr/share/licenses/sqlite/**
    dependencies:
      run:
        - sqlite-libs = ${package.version}-${package.release}
    tests:
      - name: installed
        stage: installed
        packages: [bash-binsh, coreutils, gcc, pkgconf, grep]
        script: |
          sqlite3 /tmp/sqlite-test.db 'create table t(v text); insert into t values (char(111,107)); select v from t;' | grep -Fx ok
  - name: sqlite-libs
    summary: Shared libraries for SQLite
    files:
      include:
        - /usr/lib*/libsqlite3.so.*
        - /usr/share/licenses/sqlite-libs/**
      license:
        - /usr/share/licenses/sqlite-libs/**
    tests:
      - name: runtime-linkage
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libsqlite3.so.*"]
  - name: sqlite-devel
    summary: Development files for SQLite
    files:
      include:
        - "@dev"
        - /usr/share/licenses/sqlite-devel/**
      license:
        - /usr/share/licenses/sqlite-devel/**
    dependencies:
      run:
        - sqlite-libs = ${package.version}-${package.release}
    tests:
      - name: api-behavior
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists sqlite3
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags sqlite3) "$TEST_FILES/behavior.c" $(pkg-config --libs sqlite3) -o behavior
          ./behavior
  - name: sqlite-doc
    summary: Documentation for SQLite
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/sqlite-doc/**
      license:
        - /usr/share/licenses/sqlite-doc/**
