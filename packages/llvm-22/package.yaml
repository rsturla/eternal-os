        - /usr/lib/llvm-22/lib/libunwind.so.*
        - /usr/share/licenses/llvm-libunwind-22/**
      license:
        - /usr/share/licenses/llvm-libunwind-22/**
    tests:
      - name: load-library
        stage: installed
        argv:
          - bash
          - -eu
          - -c
          - |
            python3 -c 'import ctypes; ctypes.CDLL("libunwind.so.1")'
        packages:
          - python3
    dependencies:
      conflicts:
        - llvm-libunwind-23
  - name: llvm-libunwind-22-devel
    summary: LLVM 22 libunwind development files
    files:
      include:
        - /usr/lib/llvm-22/include/*unwind*.h
        - /usr/lib/llvm-22/include/mach-o/compact_unwind_encoding.h
        - /usr/lib/llvm-22/lib/libunwind.so
        - /usr/share/licenses/llvm-libunwind-22-devel/**
      license:
        - /usr/share/licenses/llvm-libunwind-22-devel/**
    dependencies:
      run:
        - llvm-libunwind-22 = ${package.version}-${package.release}
    tests:
      - name: unwind-context
        stage: installed
        packages:
          - gcc
          - glibc-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf '#include <libunwind.h>\nint main(void) { unw_context_t c; unw_cursor_t u; return unw_getcontext(&c) || unw_init_local(&u, &c); }\n' > main.c
            gcc -I/usr/lib/llvm-22/include main.c -L/usr/lib/llvm-22/lib -lunwind -o main
            ./main
  - name: llvm-libunwind-22-static
    summary: LLVM 22 libunwind static library
    files:
      include:
        - /usr/lib/llvm-22/lib/libunwind.a
        - /usr/lib/llvm-22/lib/libunwind_experimental.a
        - /usr/share/licenses/llvm-libunwind-22-static/**
      license:
        - /usr/share/licenses/llvm-libunwind-22-static/**
    dependencies:
      run:
        - llvm-libunwind-22-devel = ${package.version}-${package.release}
