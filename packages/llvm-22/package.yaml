  - name: clang-lld-lto
    stage: build
    argv:
      - bash
      - -eu
      - -c
      - |
        export LD_LIBRARY_PATH="$STAGE/usr/lib64:$STAGE/usr/lib"
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        printf 'int main(void) { return 0; }\n' > "$work/main.c"
        "$STAGE/usr/lib/llvm-22/bin/clang" -flto -fuse-ld="$STAGE/usr/lib/llvm-22/bin/ld.lld" "$work/main.c" -o "$work/main"
