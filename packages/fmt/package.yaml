# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# A modern C++ formatting library.
schema: 1

package:
  name: fmt
  version: "12.2.1"
  release: 1
  summary: A modern formatting library for C++
  description: |
    fmt is an open-source formatting library for C++. It can be used as a
    safe alternative to printf and provides a fast, header-only or compiled
    formatting API.
  license: MIT
  upstream: https://github.com/fmtlib/fmt
  cpe:
    vendor: fmtlib
    product: fmt

sources:
  - name: fmt-12.2.1.tar.gz
    kind: archive
    digest: "sha512:d00479330c8b8c6a61a9420ac86c855964c3b611c0989158921a1ff7d1cac09f91cdec56219aebfbca0c47a3bdea98139620d45edaf14641b73288dcb3a6cc1c"
    locators:
      - kind: https
        url: https://github.com/fmtlib/fmt/archive/refs/tags/12.2.1.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [cmake, make, gcc, gcc-c++, bash, coreutils]
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -DBUILD_SHARED_LIBS=ON
          - -DFMT_TEST=OFF
          - -DFMT_DOC=OFF
    - uses: cmake/build
    - uses: cmake/install
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [fmt, fmt-devel, fmt-static]
    - uses: strip

outputs:
  - name: fmt
    summary: Shared library for fmt
    files:
      include:
        - /usr/lib*/libfmt.so.*
        - /usr/share/licenses/fmt/**
      exclude:
        - /usr/lib*/lib*.a
      license:
        - /usr/share/licenses/fmt/**
    tests:
      - name: runtime-linkage
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libfmt.so.*"]
  - name: fmt-static
    summary: Static library for fmt
    files:
      include:
        - "@static"
        - /usr/share/licenses/fmt-static/**
      license:
        - /usr/share/licenses/fmt-static/**
    dependencies:
      run:
        - fmt-devel = ${package.version}-${package.release}
    tests:
      - name: static-c-binding
        stage: installed
        packages:
          - gcc-c++
          - glibc-devel
          - pkgconf
          - binutils
          - grep
        files: tests
        script: |
          pkg-config --exists fmt
          # Upstream builds the C binding as an archive backed by the shared C++ library.
          gcc -std=c17 $(pkg-config --cflags fmt) -c "$TEST_FILES/c-binding.c" -o c-binding.o
          g++ c-binding.o "$(pkg-config --variable=libdir fmt)/libfmt-c.a" $(pkg-config --libs fmt) -o behavior
          ./behavior
          nm --defined-only behavior > symbols.txt
          grep -E ' [Tt] fmt_vformat$' symbols.txt
  - name: fmt-devel
    summary: Development files for fmt
    files:
      include:
        - "@dev"
        - /usr/share/licenses/fmt-devel/**
      license:
        - /usr/share/licenses/fmt-devel/**
    dependencies:
      run:
        - fmt = ${package.version}-${package.release}
    tests:
      - name: api-behavior
        stage: installed
        packages:
          - gcc-c++
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists fmt
          g++ -std=c++17 -Wall -Wextra $(pkg-config --cflags fmt) "$TEST_FILES/behavior.cc" $(pkg-config --libs fmt) -o behavior
          ./behavior
