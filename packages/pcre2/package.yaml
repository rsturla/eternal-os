# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Perl-compatible regular expression library. A build dependency for grep and
# the rest of the minimal Eternal userland.
schema: 1

package:
  name: pcre2
  version: "10.49"
  release: 1
  summary: Perl-compatible regular expression library
  description: |
    PCRE2 is a library implementing Perl-compatible regular expressions.
  license: BSD-3-Clause
  upstream: https://github.com/PCRE2Project/pcre2
  cpe:
    vendor: pcre2
    product: pcre2

sources:
  - name: pcre2-10.49.tar.gz
    kind: archive
    digest: "sha512:6cfd9f824837078bea959ea89c1494950987892ec9b8546691b1aa94fde37c60429c4711c55f9a629c8a6a86bb6ebae738b3a0ebf6e42c70ab008ec6c394aca0"
    locators:
      - kind: https
        url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  dependencies:
    tools: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-pcre2-16
          - --enable-pcre2-32
          - --enable-jit
          - --disable-static
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [pcre2, pcre2-libs, pcre2-devel, pcre2-doc]
    - uses: strip

outputs:
  - name: pcre2
    summary: Perl-compatible regular expression library tools
    files:
      license:
        - /usr/share/licenses/pcre2/COPYING
    dependencies:
      run:
        - pcre2-libs = ${package.version}-${package.release}
        - filesystem
    tests:
      - name: installed
        stage: installed
        environment:
          contents:
            packages: [bash-binsh]
        argv:
          - sh
          - -c
          - |
            pcre2grep --version
            printf '%s\n' 'abc123' | pcre2grep '\d+'
            printf '%s\n' '/a+/' 'aaa' | pcre2test

  - name: pcre2-libs
    summary: PCRE2 runtime libraries
    files:
      include:
        - /usr/lib*/libpcre2-*.so.*
        - /usr/share/licenses/pcre2-libs/COPYING
      license:
        - /usr/share/licenses/pcre2-libs/COPYING
    dependencies:
      run:
        - filesystem
    tests:
      - name: installed
        stage: installed
        environment:
          contents:
            packages: [bash-binsh]
        argv:
          - sh
          - -c
          - |
            for lib in /usr/lib64/libpcre2-*.so.* /usr/lib/libpcre2-*.so.*; do
              test -e "$lib" && exit 0
            done
            exit 1

  - name: pcre2-devel
    summary: PCRE2 development files
    files:
      include:
        - "@dev"
        - /usr/bin/pcre2-config
        - /usr/share/licenses/pcre2-devel/COPYING
      license:
        - /usr/share/licenses/pcre2-devel/COPYING
    dependencies:
      run:
        - pcre2-libs = ${package.version}-${package.release}
        - filesystem

  - name: pcre2-doc
    summary: PCRE2 documentation
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/pcre2-doc/COPYING
      license:
        - /usr/share/licenses/pcre2-doc/COPYING
    dependencies:
      run:
        - filesystem

tests:
  - name: link
    stage: installed
    environment:
      contents:
        packages: [gcc, glibc-devel, bash-binsh]
    argv:
      - sh
      - -c
      - |
        cat > /tmp/test.c <<'EOF'
        #define PCRE2_CODE_UNIT_WIDTH 8
        #include <pcre2.h>
        int main(void) {
          int error;
          PCRE2_SIZE offset;
          pcre2_code *code = pcre2_compile((PCRE2_SPTR)"a+", 2, 0, &error, &offset, 0);
          if (code == 0) return 1;
          pcre2_code_free(code);
          return 0;
        }
        EOF
        gcc /tmp/test.c -lpcre2-8 -o /tmp/test
        /tmp/test
