# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Perl-compatible regular expression library. A build dependency for grep and
# the rest of the minimal Eternal userland.
schema: 1

package:
  name: pcre2
  version: "10.49"
  release: 1
  summary: Perl-compatible regular expression library
  description: |
    PCRE2 is a library implementing Perl-compatible regular expressions.
  license: BSD-3-Clause
  upstream: https://github.com/PCRE2Project/pcre2
  cpe:
    vendor: pcre2
    product: pcre2

sources:
  - name: pcre2-10.49.tar.gz
    kind: archive
    digest: "sha512:6cfd9f824837078bea959ea89c1494950987892ec9b8546691b1aa94fde37c60429c4711c55f9a629c8a6a86bb6ebae738b3a0ebf6e42c70ab008ec6c394aca0"
    locators:
      - kind: https
        url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-pcre2-16
          - --enable-pcre2-32
          - --enable-jit
          - --disable-static
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [pcre2, pcre2-libs, pcre2-devel, pcre2-doc]
    - uses: strip

outputs:
  - name: pcre2
    summary: Perl-compatible regular expression library tools
    files:
      license:
        - /usr/share/licenses/pcre2/COPYING
    dependencies:
      run:
        - pcre2-libs = ${package.version}-${package.release}
    tests:
      - name: regex-cli
        stage: installed
        script: |
          test "$(printf '%s\n' 'abc123' 'nomatch' | pcre2grep '\d+')" = abc123
          result=$(printf '%s\n' '/([a-z]+)-([0-9]+)/' 'hello-42' '' '/a+/' 'bbb' | pcre2test -q)
          [[ $result == *'0: hello-42'* && $result == *'1: hello'* && $result == *'2: 42'* && $result == *'No match'* ]]
          result=$(printf '%s\n' '/[/' | pcre2test -q)
          [[ $result == *'Failed: error'* ]]
      - name: no-match
        stage: installed
        argv:
          - pcre2grep
          - missing
          - /dev/null
        expect:
          exit-code: 1
          stdout: ''
          stderr: ''
  - name: pcre2-libs
    summary: PCRE2 runtime libraries
    files:
      include:
        - /usr/lib*/libpcre2-*.so.*
        - /usr/share/licenses/pcre2-libs/COPYING
      license:
        - /usr/share/licenses/pcre2-libs/COPYING
    tests:
      - name: runtime-linkage
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libpcre2-8.so.*", "libpcre2-16.so.*", "libpcre2-32.so.*", "libpcre2-posix.so.*"]
  - name: pcre2-devel
    summary: PCRE2 development files
    files:
      include:
        - "@dev"
        - /usr/bin/pcre2-config
        - /usr/share/licenses/pcre2-devel/COPYING
      license:
        - /usr/share/licenses/pcre2-devel/COPYING
    dependencies:
      run:
        - pcre2-libs = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists libpcre2-8
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libpcre2-8) "$TEST_FILES/behavior.c" $(pkg-config --libs libpcre2-8) -o behavior
          ./behavior
          for width in 16 32; do
            pkg-config --exists libpcre2-$width
            gcc -std=c17 -Wall -Wextra -Werror -DPCRE2_CODE_UNIT_WIDTH=$width "$TEST_FILES/wide.c" $(pkg-config --cflags --libs libpcre2-$width) -o wide
            ./wide
          done
  - name: pcre2-doc
    summary: PCRE2 documentation
    files:
      include:
        - "@man"
        - "@doc"
        - /usr/share/licenses/pcre2-doc/COPYING
      license:
        - /usr/share/licenses/pcre2-doc/COPYING

tests:
  - name: upstream
    stage: build
    packages:
      - diffutils
    artifacts:
      - test-suite.log
      - tests/test-suite.log
    pipeline:
      - uses: make/check
