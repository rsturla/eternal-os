# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Upstream publishes source tags but no separate release tarball.
# Build the client libraries only; containers do not need the audit daemon.
# audit-devel provides the Fedora audit-libs-devel capability.
schema: 2
package:
  name: audit
  version: 4.2.1
  release: 1
  summary: Linux audit userspace libraries
  description: Linux audit userspace libraries.
  license: LGPL-2.1-or-later
  upstream: https://github.com/linux-audit/audit-userspace
  cpe:
    vendor: linux_audit_project
    product: linux_audit
sources:
- name: audit-4.2.1.tar.gz
  kind: archive
  digest: sha512:71c4ac50b471138da866a82a0fa45970cf26181962f005ae570bdbb76e7cd15b66f8ebeba75a075bf04e52b20d039f012e2bbf8b1055f44641c36897f132894d
  locators:
  - kind: https
    url: https://github.com/linux-audit/audit-userspace/archive/refs/tags/v4.2.1.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - autoconf
  - automake
  - libtool
  - pkgconf
  sysroot:
  - libcap-ng-devel
  - kernel-headers
  pipeline:
  - runs: |
      autoreconf -fi
  - uses: autotools/configure
    with:
      args:
      - --disable-static
      - --without-python3
      - --without-golang
      - --disable-gssapi-krb5
      - --disable-tls
      - --with-aarch64
      - --with-arm
      - --disable-zos-remote
      - --disable-listener
      - --with-libcap-ng=yes
  - uses: make/build
    with:
      dir: common
  - uses: make/build
    with:
      dir: lib
  - uses: make/build
    with:
      dir: auparse
  - uses: make/build
    with:
      dir: audisp
      args:
      - libqueue.la
  - uses: make/build
    with:
      dir: auplugin
  - uses: make/install
    with:
      dir: lib
  - uses: make/install
    with:
      dir: auparse
  - uses: make/install
    with:
      dir: auplugin
  - runs: |
      find "$STAGE" -name "*.la" -delete
      rm -f "$STAGE/usr/share/info/dir"
  - uses: license/copy
    with:
      files:
      - COPYING.LIB
      outputs:
      - audit-libs
      - audit-devel
  - uses: strip
outputs:
- name: audit-libs
  files:
    license:
    - /usr/share/licenses/audit-libs/**
  tests:
    - name: minimal-runtime-dependencies
      pipeline:
        - uses: test/runtime-linkage
          with:
            libraries: ["libaudit.so.[0-9]*", "libauparse.so.[0-9]*"]
    - name: runtime
      packages:
        - python3
      files: tests
      script: |
        python3 "$TEST_FILES/runtime.py"

- name: audit-devel
  files:
    license:
    - /usr/share/licenses/audit-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/audit-devel/**
  dependencies:
    run:
    - audit-libs = ${package.version}-${package.release}
    provides:
    - audit-libs-devel = ${package.version}-${package.release}
  tests:
    - name: audit-api
      packages:
        - gcc
        - glibc-devel
        - coreutils
      files: tests
      script: |
        bash "$TEST_FILES/audit-api.sh"

tests:
  - name: hardening
    pipeline:
      - uses: test/hardening-check
