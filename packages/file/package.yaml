# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
schema: 2
package:
  name: file
  version: '5.48'
  release: 1
  summary: File type identification tools and library
  description: File type identification tools and library.
  license: BSD-2-Clause-Darwin AND BSD-2-Clause
  upstream: https://www.darwinsys.com/file/
  cpe:
    vendor: file_project
    product: file
sources:
- name: file-5.48.tar.gz
  kind: archive
  digest: sha512:9672504f9473e41ed047bb019f1a003965b3f12e16b77d090e819e094805e42d66d07582402eb9df6be98932161ee6a014a549dbcca9cef10c236b0a3a71a642
  locators:
  - kind: https
    url: https://astron.com/pub/file/file-5.48.tar.gz
  - kind: https
    url: https://www.astron.com/pub/file/file-5.48.tar.gz
  extract:
    format: tar.gz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  pipeline:
  - uses: autotools/configure
    with:
      args:
      - --disable-static
      - --disable-libseccomp
      - --disable-zlib
      - --disable-bzlib
      - --disable-xzlib
      - --disable-zstdlib
      - --disable-lzlib
  - uses: make/build
  - uses: make/install
  - runs: |
      find "$STAGE" -name "*.la" -delete
      rm -f "$STAGE/usr/share/info/dir"
  - uses: license/copy
    with:
      files:
      - COPYING
      outputs:
      - file
      - file-libs
      - file-devel
      - file-doc
  - uses: strip
outputs:
- name: file
  files:
    license:
    - /usr/share/licenses/file/**
  dependencies:
    run:
    - file-libs = ${package.version}-${package.release}
  tests:
    - name: classification
      packages:
        - coreutils
      files: tests
      script: |
        bash "$TEST_FILES/classification.sh"

- name: file-libs
  files:
    license:
    - /usr/share/licenses/file-libs/**
    include:
    - /usr/lib*/libmagic.so.*
    - /usr/share/misc/magic*
    - /usr/share/licenses/file-libs/**
  tests:
    - name: minimal-runtime-dependencies
      pipeline:
        - uses: test/runtime-linkage
          with:
            libraries: ["libmagic.so.[0-9]*"]
    - name: runtime
      packages:
        - python3
      files: tests
      script: |
        python3 "$TEST_FILES/runtime.py"

- name: file-devel
  files:
    license:
    - /usr/share/licenses/file-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/file-devel/**
  dependencies:
    run:
    - file-libs = ${package.version}-${package.release}
  tests:
    - name: magic-api
      packages:
        - gcc
        - glibc-devel
        - coreutils
      files: tests
      script: |
        bash "$TEST_FILES/magic-api.sh"

- name: file-doc
  files:
    license:
    - /usr/share/licenses/file-doc/**
    include:
    - '@doc'
    - '@man'
    - '@info'
    - /usr/share/licenses/file-doc/**

tests:
  - name: hardening
    pipeline:
      - uses: test/hardening-check
