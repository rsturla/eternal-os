# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# dnf5 package manager and the libdnf5 libraries. The build keeps the core
# package manager, the CLI library and libdnf5, and disables the daemon,
# modulemd, comps, systemd, Python/Perl/Ruby bindings, plugins, tests and docs.
schema: 1

package:
  name: dnf5
  version: "5.4.7.0"
  release: 2
  summary: Package manager based on libdnf5 and libsolv
  description: |
    dnf5 is the next generation of the DNF package manager. It uses libdnf5
    for package management and libsolv for dependency resolution. This build
    provides the dnf5 command, libdnf5 and libdnf5-cli without the daemon,
    module streams, comps groups or language bindings.
  license: GPL-2.0-or-later
  upstream: https://github.com/rpm-software-management/dnf5
  cpe:
    vendor: rpm-software-management
    product: dnf5

sources:
  - name: dnf5-5.4.7.0.tar.gz
    kind: archive
    digest: "sha512:6b06c9a0de52c9781ce20aaccc44ff46fe06203634f957400aeada60525f5eadba6b296db1e8d6ea8272835e9abdcc3a62f12380a36e0c4f6e2787237ffe8b75"
    locators:
      - kind: https
        url: https://github.com/rpm-software-management/dnf5/archive/refs/tags/5.4.7.0.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

patches:
  - file: patches/offline-plymouth-unused.patch
    strip: 1
    reason: "avoid -Werror=unused-parameter with -DWITH_SYSTEMD=OFF"
  - file: patches/json-c-unused-function.patch
    strip: 1
    reason: "avoid -Werror=unused-function from json-c 0.19 headers"

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [cmake, make, gcc, gcc-c++, bash, coreutils, pkgconf, python3]
  sysroot:
    - bzip2-devel
    - file-devel
    - fmt-devel
    - glib2-devel
    - json-c-devel
    - libacl-devel
    - libarchive-devel
    - libcap-devel
    - libcurl-devel
    - librepo-devel
    - libselinux-devel
    - libsolv-devel
    - libxml2-devel
    - lua-devel
    - openssl-devel
    - popt-devel
    - rpm-devel
    - sqlite-devel
    - toml11-devel
    - libsmartcols-devel
    - xz-devel
    - zchunk-devel
    - zlib-devel
    - zstd-devel
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -DWITH_DNF5DAEMON_CLIENT=OFF
          - -DWITH_DNF5DAEMON_SERVER=OFF
          - -DWITH_DNF5_PLUGINS=OFF
          - -DWITH_PLUGIN_ACTIONS=OFF
          - -DWITH_PLUGIN_APPSTREAM=OFF
          - -DWITH_PLUGIN_EXPIRED_PGP_KEYS=OFF
          - -DWITH_PLUGIN_RHSM_CONTAINER=OFF
          - -DWITH_PLUGIN_MANIFEST=OFF
          - -DWITH_PYTHON_PLUGINS_LOADER=OFF
          - -DWITH_PLUGIN_LOCAL=OFF
          - -DWITH_PLUGIN_SYSTEMD_INHIBIT=OFF
          - -DWITH_COMPS=ON
          - -DWITH_MODULEMD=OFF
          - -DWITH_SYSTEMD=OFF
          - -DWITH_HTML=OFF
          - -DWITH_MAN=OFF
          - -DWITH_TESTS=OFF
          - -DWITH_TRANSLATIONS=OFF
          - -DWITH_PERL5=OFF
          - -DWITH_PYTHON3=OFF
          - -DWITH_RUBY=OFF
          - -DWITH_GO=OFF
    - uses: cmake/build
    - uses: cmake/install
    - uses: license/copy
      with:
        files: [COPYING.md]
        outputs: [dnf5, libdnf5, libdnf5-cli, libdnf5-devel, libdnf5-cli-devel]
    - uses: strip

outputs:
  - name: dnf5
    summary: dnf5 package manager
    files:
      include:
        - /usr/bin/*
        - /etc/**
        - /usr/share/bash-completion/completions/*
        - /usr/share/licenses/dnf5/**
      license:
        - /usr/share/licenses/dnf5/**
    dependencies:
      run:
        - libdnf5 = ${package.version}-${package.release}
        - libdnf5-cli = ${package.version}-${package.release}
        - rpm
    tests:
      - name: offline-installed-query
        stage: installed
        packages:
          - bash
          - grep
        script: |
          # Installed roots are read-only. Keep DNF's query state in the workspace.
          state=(--setopt=persistdir="$PWD/persist" --setopt=cachedir="$PWD/cache" --setopt=logdir="$PWD/log")
          dnf5 "$${state[@]}" --version
          dnf5 "$${state[@]}" --disablerepo='*' --setopt=plugins=False repo list
          dnf5 "$${state[@]}" --disablerepo='*' --setopt=plugins=False list --installed dnf5 > installed.txt
          grep -F dnf5 installed.txt
          # Resolve the invalid request without requiring a writable transaction root.
          status=0
          dnf5 "$${state[@]}" --disablerepo='*' --setopt=plugins=False install --assumeno eternal-rpmx-missing >missing.stdout 2>missing.stderr || status=$?
          test "$status" = 1
          grep -F 'eternal-rpmx-missing' missing.stderr
        artifacts:
          - installed.txt
          - missing.stdout
          - missing.stderr
      - name: offline-local-package-transaction
        stage: transaction
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb "$TEST_FILES/probe.spec" --define "_topdir $PWD/rpmbuild" \
           --define 'probe_version 1' --define '__os_install_post %{nil}'
          dnf5 --disablerepo='*' --setopt=plugins=False --setopt=gpgcheck=False --setopt=localpkg_gpgcheck=False install -y rpmbuild/RPMS/noarch/eternal-rpmx-probe-1-1.noarch.rpm
          rpm -q eternal-rpmx-probe
          test "$(cat /usr/share/eternal-rpmx-probe/payload)" = payload-1
          dnf5 --disablerepo='*' --setopt=plugins=False --setopt=clean_requirements_on_remove=False remove -y eternal-rpmx-probe
          if rpm -q eternal-rpmx-probe; then exit 1; fi
          test ! -e /usr/share/eternal-rpmx-probe/payload
  - name: libdnf5
    summary: Core library for dnf5
    files:
      include:
        - /usr/lib*/libdnf5.so.*
        - /usr/share/licenses/libdnf5/**
      license:
        - /usr/share/licenses/libdnf5/**
    dependencies:
      run:
        - fmt
        - glib2
        - json-c
        - libacl
        - librepo
        - libsolv
        - libxml2
        - openssl-libs
        - rpm-libs
        - sqlite-libs
        - zchunk-libs
    tests:
      - name: runtime-loader
        stage: installed
        packages:
          - bash
          - python3
        script: |
          python3 -I -c 'import ctypes,glob,os; paths=glob.glob("/usr/lib*/libdnf5.so.*"); assert paths; ctypes.CDLL(paths[0],mode=os.RTLD_NOW)'
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libdnf5.so.*"]
  - name: libdnf5-devel
    summary: Development files for libdnf5
    files:
      include:
        - /usr/include/libdnf5/**
        - /usr/lib*/libdnf5.so
        - /usr/lib*/pkgconfig/libdnf5.pc
        - /usr/share/licenses/libdnf5-devel/**
      license:
        - /usr/share/licenses/libdnf5-devel/**
    dependencies:
      run:
        - libdnf5 = ${package.version}-${package.release}

    tests:
      - name: cxx-api
        stage: installed
        packages:
          - bash
          - gcc
          - gcc-c++
          - pkgconf
        files: tests
        script: |
          g++ -std=c++20 "$TEST_FILES/base.cc" $(pkg-config --cflags --libs libdnf5) -o api
          ./api
  - name: libdnf5-cli
    summary: Command line interface library for dnf5
    files:
      include:
        - /usr/lib*/libdnf5-cli.so.*
        - /usr/share/licenses/libdnf5-cli/**
      license:
        - /usr/share/licenses/libdnf5-cli/**
    dependencies:
      run:
        - libdnf5 = ${package.version}-${package.release}
        - fmt
        - json-c
        - libsmartcols
    tests:
      - name: runtime-loader
        stage: installed
        packages:
          - bash
          - python3
        script: |
          python3 -I -c 'import ctypes,glob,os; paths=glob.glob("/usr/lib*/libdnf5-cli.so.*"); assert paths; ctypes.CDLL(paths[0],mode=os.RTLD_NOW)'
      - name: runtime-closure
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libdnf5-cli.so.*"]
  - name: libdnf5-cli-devel
    summary: Development files for libdnf5-cli
    files:
      include:
        - /usr/include/libdnf5-cli/**
        - /usr/lib*/libdnf5-cli.so
        - /usr/lib*/pkgconfig/libdnf5-cli.pc
        - /usr/share/licenses/libdnf5-cli-devel/**
      license:
        - /usr/share/licenses/libdnf5-cli-devel/**
    dependencies:
      run:
        - libdnf5-cli = ${package.version}-${package.release}
        - libdnf5-devel = ${package.version}-${package.release}
    tests:
      - name: cxx-api
        stage: installed
        packages:
          - bash
          - gcc
          - gcc-c++
          - pkgconf
        files: tests
        script: |
          g++ -std=c++20 "$TEST_FILES/cli.cc" $(pkg-config --cflags --libs libdnf5-cli libdnf5) -o api
          ./api
