schema: 2

package:
  name: golang-1.26
  version: "1.26.11"
  release: 1
  summary: The Go programming language, version 1.26
  license: BSD-3-Clause
  upstream: https://go.dev/
  cpe:
    vendor: golang
    product: go

sources:
  - name: go1.26.11.src.tar.gz
    kind: archive
    digest: "sha512:e263b02a1b9af37dcbb9b26bc0d5f8ef6abc1d4eac319b32946c66a6fc77ee7e81d88e67a946eb92103e056e19c95186d77ebaea59d9ebbe7940e6da750db475"
    locators:
      - kind: https
        url: https://go.dev/dl/go1.26.11.src.tar.gz
      - kind: https
        url: https://dl.google.com/go/go1.26.11.src.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

# Hummingbird rpms at 6763fdaa373962399e8a3aff6e1fe863d3837579.
# See README.md for patch provenance and FIPS policy.
patches:
  - file: patches/0015-Default-GOFIPS140-certified-fips-auto.patch
    strip: 1
    reason: Select the certified snapshot and activate FIPS mode on FIPS hosts
  - file: patches/0016-strictfipsruntime.patch
    strip: 1
    reason: Provide an optional startup guard for FIPS hosts

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [golang-bin, gcc, bash, coreutils, findutils, sed, grep, diffutils, binutils]
  sysroot: [glibc-devel]
  environment:
    CGO_ENABLED: "1"
    CC: gcc
    CC_FOR_TARGET: gcc
    GOAMD64: v2
    GOARM64: v8.0
    GOENV: "off"
    GOTOOLCHAIN: local
    GOPROXY: "off"
    GOSUMDB: "off"
    GOTELEMETRY: "off"
  pipeline:
    - runs: |
        set -eu
        # Resolve Fedora's seed before make.bash changes GOROOT.
        export GOROOT_BOOTSTRAP="$(go env GOROOT)"
        export GOMAXPROCS="$JOBS"
        cd src
        bash ./make.bash
    - runs: |
        set -eu
        # Upstream builds static tools. Rebuild the shipped tools as PIE.
        ./bin/go install -p "$JOBS" -trimpath -buildmode=pie -ldflags='-s -B gobuildid' \
          cmd/go cmd/gofmt cmd/asm cmd/cgo cmd/compile cmd/cover cmd/fix \
          cmd/link cmd/preprofile cmd/vet
        sed -i 's/^GOTOOLCHAIN=auto$/GOTOOLCHAIN=local/' go.env
        printf '\nGOAMD64=v2\nGOARM64=v8.0\n' >> go.env
        install -d "$STAGE$LIBDIR/golang-1.26" "$STAGE$PREFIX/bin"
        cp -a bin pkg src lib go.env VERSION "$STAGE$LIBDIR/golang-1.26/"
        # The source tree is required to compile the standard library.
        # Keep module archives unchanged; discard only build intermediates.
        rm -rf "$STAGE$LIBDIR/golang-1.26/pkg/obj" \
          "$STAGE$LIBDIR/golang-1.26/pkg/bootstrap"
        rm -f "$STAGE$LIBDIR/golang-1.26/src/cmd/dist/dist"
        find "$STAGE$LIBDIR/golang-1.26/src" -type f -name '*_test.go' -delete
        find "$STAGE$LIBDIR/golang-1.26/src" -type d -name testdata -prune -exec rm -rf {} +
        # rpmx accepts only native ELF payloads, including source objects.
        goarch=$(./bin/go env GOARCH)
        find "$STAGE$LIBDIR/golang-1.26/src" -type f -name '*.syso' | while IFS= read -r object; do
          case "$object" in
            */goboringcrypto_linux_"$goarch".syso|*/race_linux_"$goarch".syso) ;;
            */amd64v1/race_linux.syso|*/amd64v3/race_linux.syso)
              if [ "$goarch" != amd64 ]; then rm -f "$object"; fi
              ;;
            *) rm -f "$object" ;;
          esac
        done
        for tool in go gofmt; do
          ln -s "$LIBDIR/golang-1.26/bin/$tool" "$STAGE$PREFIX/bin/$tool-1.26"
          ln -s "$tool-1.26" "$STAGE$PREFIX/bin/$tool"
        done
        install -d "$STAGE$PREFIX/share/doc/golang-1.26"
        cp -a doc misc "$STAGE$PREFIX/share/doc/golang-1.26/"
    - uses: license/copy
      with:
        files: [LICENSE, PATENTS]
        outputs: [golang-1.26, golang-1.26-default, golang-1.26-doc]

  tests:
    - name: upstream-fips-dependency-rules
      script: |
        GOFIPS140=off ./bin/go test -count=1 -json -p "$JOBS" crypto/fips140 crypto/internal/fips140deps/... go/build >upstream-fips-rules.json
        grep -F '"Action":"pass"' upstream-fips-rules.json | grep -F '"Test":'
      artifacts: [upstream-fips-rules.json]
      timeout: 1h
    - name: upstream-certified-crypto
      script: |
        GOFIPS140=certified ./bin/go test -short -count=1 -json -p "$JOBS" crypto/fips140 crypto/tls >upstream-certified-crypto.json
        grep -F '"Action":"pass"' upstream-certified-crypto.json | grep -F '"Test":'
      artifacts: [upstream-certified-crypto.json]
      timeout: 1h
    - name: upstream-standard-library
      script: |
        ./bin/go test -short -count=1 -json -p "$JOBS" archive/... bytes compress/... encoding/... errors fmt hash/... io/... math/... os/... path/... reflect regexp/... runtime/... slices strings sync/... testing/... time unicode/... >upstream-standard-library.json
        grep -F '"Action":"pass"' upstream-standard-library.json | grep -F '"Test":'
      artifacts: [upstream-standard-library.json]
      timeout: 2h

outputs:
  - name: golang-1.26
    # Source-generation scripts are data, as in Fedora's source exclusion.
    # The installed commands are ELF executables.
    generators:
      script: false
      perl: false
    files:
      license:
        - /usr/share/licenses/golang-1.26/LICENSE
        - /usr/share/licenses/golang-1.26/PATENTS
    dependencies:
      run: [ca-certificates]
    tests:
      - name: pure-go-runtime-and-diagnostics
        files: tests
        packages: [grep, diffutils]
        script: bash "$TEST_FILES/runtime.sh" go-1.26 gofmt-1.26 1.26.11
        artifacts: [unit-tests.log, invalid.stderr, vet.stderr]
        timeout: 15m
      - name: cgo-race-and-cross-compilation
        files: tests
        packages: [gcc, glibc-devel, grep]
        script: bash "$TEST_FILES/cgo-race.sh" go-1.26 gofmt-1.26 1.26.11
        artifacts: [race-clean.log, race.stderr, metadata-arm64.txt, metadata-amd64.txt]
        timeout: 20m
      - name: certified-fips-policy-and-startup-guard
        files: tests
        packages: [grep]
        script: bash "$TEST_FILES/fips.sh" go-1.26 gofmt-1.26 1.26.11
        artifacts: [fips-build-info.txt, guard-tag.stderr, guard-experiment.stderr]
        timeout: 20m
      - name: coinstall-fedora
        files: tests
        packages: [golang-bin]
        script: bash "$TEST_FILES/coinstall.sh" go-1.26 gofmt-1.26 1.26.11
        timeout: 15m
      - name: hardening
        pipeline:
          # Go has its own stack checks and internal linker; the compiler
          # tools do not use libc fortify, CET, a loader or BIND_NOW.
          - uses: test/hardening-check
            with:
              paths: [/usr/lib64/golang-1.26/bin, /usr/lib64/golang-1.26/pkg/tool]
              skip: [bind-now, stack-protector, fortify, cf-protection]

  - name: golang-1.26-default
    summary: Unversioned commands for Go 1.26
    files:
      include:
        - /usr/bin/go
        - /usr/bin/gofmt
        - /usr/share/licenses/golang-1.26-default/LICENSE
        - /usr/share/licenses/golang-1.26-default/PATENTS
      license:
        - /usr/share/licenses/golang-1.26-default/LICENSE
        - /usr/share/licenses/golang-1.26-default/PATENTS
    dependencies:
      run:
        - golang-1.26 = ${package.version}-${package.release}
      provides:
        - golang = ${package.version}-${package.release}
        - go = ${package.version}-${package.release}
      conflicts: [golang-1.27-default, golang-bin]
    tests:
      - name: default-selector-consumer
        files: tests
        packages: [diffutils]
        script: bash "$TEST_FILES/selector.sh" go gofmt 1.26.11
        timeout: 15m

  - name: golang-1.26-doc
    summary: Documentation and examples for Go 1.26
    files:
      include:
        - "@doc"
        - /usr/share/licenses/golang-1.26-doc/LICENSE
        - /usr/share/licenses/golang-1.26-doc/PATENTS
      license:
        - /usr/share/licenses/golang-1.26-doc/LICENSE
        - /usr/share/licenses/golang-1.26-doc/PATENTS
