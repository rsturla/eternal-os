        - /usr/lib/llvm-23/lib/libunwind.so.*
        - /usr/share/licenses/llvm-libunwind-23/**
      license:
        - /usr/share/licenses/llvm-libunwind-23/**
    tests:
      - name: load-library
        stage: installed
        argv:
          - bash
          - -eu
          - -c
          - |
            python3 -c 'import ctypes; ctypes.CDLL("libunwind.so.1")'
        packages:
          - python3
    dependencies:
      conflicts:
        - llvm-libunwind-22
  - name: llvm-libunwind-23-devel
    summary: LLVM 23 libunwind development files
    files:
      include:
        - /usr/lib/llvm-23/include/*unwind*.h
        - /usr/lib/llvm-23/include/mach-o/compact_unwind_encoding.h
        - /usr/lib/llvm-23/lib/libunwind.so
        - /usr/share/licenses/llvm-libunwind-23-devel/**
      license:
        - /usr/share/licenses/llvm-libunwind-23-devel/**
    dependencies:
      run:
        - llvm-libunwind-23 = ${package.version}-${package.release}
    tests:
      - name: unwind-context
        stage: installed
        packages:
          - gcc
          - glibc-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf '#include <libunwind.h>\nint main(void) { unw_context_t c; unw_cursor_t u; return unw_getcontext(&c) || unw_init_local(&u, &c); }\n' > main.c
            gcc -I/usr/lib/llvm-23/include main.c -L/usr/lib/llvm-23/lib -lunwind -o main
            ./main
  - name: llvm-libunwind-23-static
    summary: LLVM 23 libunwind static library
    files:
      include:
        - /usr/lib/llvm-23/lib/libunwind.a
        - /usr/lib/llvm-23/lib/libunwind_experimental.a
        - /usr/share/licenses/llvm-libunwind-23-static/**
      license:
        - /usr/share/licenses/llvm-libunwind-23-static/**
    dependencies:
      run:
        - llvm-libunwind-23-devel = ${package.version}-${package.release}
tests:
  - name: bind-callables
    stage: build
    argv:
      - bash
      - -eu
      - -c
      - |
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        printf '#include <llvm/ADT/STLForwardCompat.h>\ntemplate <typename T> int increment(T value) { return value + 1; }\nint main() { auto front = llvm::bind_front<increment<int>>(41); auto back = llvm::bind_back<increment<int>>(41); return front() == 42 && back() == 42 ? 0 : 1; }\n' > "$work/bind.cc"
        g++ -std=c++17 -fno-delete-null-pointer-checks -I"$STAGE/usr/lib/llvm-23/include" "$work/bind.cc" -o "$work/bind"
        "$work/bind"
  - name: hardening
    stage: build
    pipeline:
      - uses: test/hardening-check
        with:
          skip:
