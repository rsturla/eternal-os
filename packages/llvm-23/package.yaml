            - /usr/lib64/libmlir_c_runner_utils.so.23.1
            - /usr/lib64/libmlir_runner_utils.so.23.1
            - /usr/lib64/libmlir_async_runtime.so.23.1
            - /usr/lib64/libmlir_arm_sme_abi_stubs.so.23.1
            - /usr/lib64/libmlir_arm_runner_utils.so.23.1
            - /usr/lib64/libclang.so.${package.version}
            - /usr/lib64/libc++.so.1.0
            - /usr/lib64/libc++abi.so.1.0
            - /usr/lib64/libunwind.so.1.0
            - /usr/lib/libLLVM.so.23.1
            - /usr/lib/libLTO.so.23.1
            - /usr/lib/libRemarks.so.23.1
            - /usr/lib/libclang-cpp.so.23.1
            - /usr/lib/libMLIR.so.23.1
            - /usr/lib/libMLIRExecutionEngineShared.so.23.1
            - /usr/lib/libmlir_float16_utils.so.23.1
            - /usr/lib/libmlir_apfloat_wrappers.so.23.1
            - /usr/lib/libmlir_c_runner_utils.so.23.1
            - /usr/lib/libmlir_runner_utils.so.23.1
            - /usr/lib/libmlir_async_runtime.so.23.1
            - /usr/lib/libmlir_arm_sme_abi_stubs.so.23.1
            - /usr/lib/libmlir_arm_runner_utils.so.23.1
            - /usr/lib/libclang.so.${package.version}
            - /usr/lib/libc++.so.1.0
            - /usr/lib/libc++abi.so.1.0
            - /usr/lib/libunwind.so.1.0
      - uses: test/hardening-check
        with:
          paths:
            - /usr/lib/llvm-23/bin/llc
            - /usr/lib64/libLLVM.so.23.1
            - /usr/lib/libLLVM.so.23.1
  - name: clang-lld-lto
    stage: build
    argv:
      - bash
      - -eu
      - -c
      - |
        export LD_LIBRARY_PATH="$STAGE/usr/lib64:$STAGE/usr/lib"
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        printf 'int main(void) { return 0; }\n' > "$work/main.c"
        "$STAGE/usr/lib/llvm-23/bin/clang" -flto -fuse-ld="$STAGE/usr/lib/llvm-23/bin/ld.lld" "$work/main.c" -o "$work/main"
