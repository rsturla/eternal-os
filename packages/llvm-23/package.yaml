schema: 1
package:
  name: llvm-23
  version: 23.1.5
  release: 1
  summary: LLVM 23 compiler infrastructure and toolchain
  description: |
    LLVM provides libraries and tools for optimisation, code generation,
    bitcode processing and object-file inspection. This stream also builds
    Clang, Clang tools, the static analyzer, LLD, MLIR, compiler-rt, libc++,
    libc++abi and LLVM libunwind as separate component packages.
  license: Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND CC0-1.0 AND MIT AND Spencer-94 AND
    Unicode-DFS-2015 AND Unicode-DFS-2016 AND LicenseRef-LLVM-MD5
  upstream: https://llvm.org/
  cpe:
    vendor: llvm
    product: llvm
sources:
  - name: llvm-project-23.1.5.src.tar.xz
    kind: archive
    digest: sha512:fae39af451683ad864299f497167616e63d3a1bb5719f0d5123119e7398972cb602aef8cc271b8433910064afa88e1e7b8eede3fdd1ff58664c3189cf4ab5880
    locators:
      - kind: https
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/llvm-project-23.1.5.src.tar.xz
    extract:
      format: tar.xz
      strip-components: 1
patches:
  - file: patches/drop-bind-front-back-nonnull-static-assert.patch
    strip: 1
  - file: patches/separate-libclang-static-export.patch
    strip: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - gcc-c++
    - cmake
    - ninja-build
    - python3
    - bash
    - coreutils
    - findutils
    - grep
    - gawk
    - sed
    - binutils
    - perl
  sysroot:
    - zlib-devel
    - zstd-devel
    - libffi-devel
  pipeline:
    - uses: cmake/configure
      with:
        args:
          - -S llvm
          - -G Ninja
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DCMAKE_BUILD_TYPE=Release
          - -DCMAKE_SKIP_INSTALL_RPATH=ON
          - -DLLVM_VERSION_SUFFIX=
          - -DLLVM_APPEND_VC_REV=OFF
          - -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra;lld;mlir"
          - -DLLVM_ENABLE_RUNTIMES=compiler-rt
          - -DLLVM_TARGETS_TO_BUILD="AArch64;X86;BPF"
          - -DLLVM_BUILD_LLVM_DYLIB=ON
          - -DLLVM_LINK_LLVM_DYLIB=ON
          - -DLLVM_ENABLE_RTTI=ON
          - -DLLVM_ENABLE_FFI=ON
          - -DLLVM_ENABLE_ZLIB=FORCE_ON
          - -DLLVM_ENABLE_ZSTD=FORCE_ON
          - -DLLVM_ENABLE_LIBXML2=OFF
          - -DLLVM_ENABLE_LIBEDIT=OFF
          - -DLLVM_ENABLE_CURL=OFF
          - -DLLVM_ENABLE_HTTPLIB=OFF
          - -DLLVM_ENABLE_Z3_SOLVER=OFF
          - -DLLVM_ENABLE_BINDINGS=OFF
          - -DLLVM_INCLUDE_TESTS=OFF
          - -DLLVM_INCLUDE_BENCHMARKS=OFF
          - -DLLVM_INCLUDE_EXAMPLES=OFF
          - -DLLVM_INCLUDE_DOCS=OFF
          - -DLLVM_INSTALL_UTILS=ON
          - -DLLVM_TOOL_OPT_VIEWER_BUILD=OFF
          - -DLLVM_DISTRIBUTIONS="Shared;Static"
          - -DLLVM_Shared_DISTRIBUTION_COMPONENTS="LLVM;LTO;Remarks;llvm-config;llvm-headers;cmake-exports;clang-cpp;libclang;MLIR"
          - -DLLVM_Static_DISTRIBUTION_COMPONENTS="llvm-libraries;clang-libraries;libclang_static;lld-libraries;mlir-libraries"
          - -DLLVM_PARALLEL_LINK_JOBS=1
          - -DCLANG_LINK_CLANG_DYLIB=ON
          - -DCLANG_FORCE_MATCHING_LIBCLANG_SOVERSION=ON
          - -DLIBCLANG_BUILD_STATIC=ON
          - -DCLANG_VENDOR=Eternal
          - -DCLANG_INCLUDE_TESTS=OFF
          - -DMLIR_INCLUDE_TESTS=OFF
          - -DMLIR_INCLUDE_INTEGRATION_TESTS=OFF
          - -DMLIR_ENABLE_BINDINGS_PYTHON=OFF
          - -DMLIR_INSTALL_AGGREGATE_OBJECTS=OFF
          - -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF
          - -DCOMPILER_RT_INCLUDE_TESTS=OFF
          - -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON
          - -DCOMPILER_RT_BUILD_GWP_ASAN=OFF
          - -DLLVM_BUILD_EXAMPLES=OFF
          - -DCLANG_BUILD_EXAMPLES=OFF
    - name: build-llvm
      uses: cmake/build
      timeout: 2h
      with:
        args:
          - --target LLVM llvm-libraries
    - name: build-clang
      uses: cmake/build
      timeout: 2h
      with:
        args:
          - --target clang clang-cpp libclang
    - name: build-toolchain
      uses: cmake/build
      timeout: 4h
    - uses: cmake/install
    - name: preserve-llvm-build
      runs: |
        mv build llvm-build
    - name: configure-cxx-runtimes
      uses: cmake/configure
      with:
        args:
          - -DCMAKE_C_COMPILER=/usr/libexec/eternal/gcc/bin/gcc
          - -DCMAKE_CXX_COMPILER=/usr/libexec/eternal/gcc/bin/g++
          - -DCMAKE_ASM_COMPILER=/usr/libexec/eternal/gcc/bin/gcc
          - -S runtimes
          - -G Ninja
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DCMAKE_BUILD_TYPE=Release
          - -DCMAKE_SKIP_INSTALL_RPATH=ON
          - -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind"
          - -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF
          - -DLLVM_INCLUDE_TESTS=OFF
          - -DLIBCXX_INCLUDE_TESTS=OFF
          - -DLIBCXX_INCLUDE_BENCHMARKS=OFF
          - -DLIBCXX_ENABLE_ABI_LINKER_SCRIPT=OFF
          - -DLIBCXXABI_INCLUDE_TESTS=OFF
          - -DLIBCXXABI_USE_LLVM_UNWINDER=ON
          - -DLIBUNWIND_INCLUDE_TESTS=OFF
          - '-DLIBUNWIND_ENABLE_CET=$(test "$RPMX_TARGET_ARCH" = x86_64 && echo ON || echo OFF)'
          - -DCMAKE_CXX_FLAGS=-Wno-unknown-pragmas
    - name: build-cxx-runtimes
      uses: cmake/build
    - name: install-cxx-runtimes
      uses: cmake/install
    - runs: |
        # LLVM tools and CMake files support a relocatable installation prefix.
        # Keep that tree private so major streams can coexist.
        install -d "$STAGE/llvm-23"
        for directory in bin include lib libexec share; do
          if test -d "$STAGE/usr/$directory"; then
            mv "$STAGE/usr/$directory" "$STAGE/llvm-23/"
          fi
        done
        install -d "$STAGE/usr/lib"
        mv "$STAGE/llvm-23" "$STAGE/usr/lib/llvm-23"
        # Put versioned SONAMEs in the loader's library directory. Keep links
        # in the private prefix for llvm-config and the CMake import targets.
        install -d "$STAGE$LIBDIR" "$STAGE/usr/bin"
        for library in "$STAGE/usr/lib/llvm-23/lib/"*.so.*; do
          name=$(basename "$library")
          mv "$library" "$STAGE$LIBDIR/$name"
          ln -s "$LIBDIR/$name" "$library"
        done
        # Each implementation owns its versioned commands. The selector owns
        # only the unversioned links in /usr/bin.
        for tool in "$STAGE/usr/lib/llvm-23/bin/"*; do
          name=$(basename "$tool")
          case "$name" in
            *-23) public="$name" ;;
            *) public="$name-23" ;;
          esac
          ln -sf "../lib/llvm-23/bin/$name" "$STAGE/usr/bin/$public"
          if test "$name" != "$public"; then
            ln -s "$public" "$STAGE/usr/bin/$name"
          fi
        done
        # Keep script interpreters independent of the build root's Python minor.
        for file in "$STAGE/usr/lib/llvm-23/bin/"* "$STAGE/usr/lib/llvm-23/libexec/"*; do
          test -f "$file" || continue
          if test "$(head -c 2 "$file")" = '#!'; then
            sed -i '1s|^#!.*python3[.0-9]*$|#!/usr/bin/python3|' "$file"
          fi
        done
        # LLVM subprojects share these modules with external CMake consumers.
        install -d "$STAGE/usr/lib/llvm-23/share/cmake/Modules"
        cp -a cmake/Modules/. "$STAGE/usr/lib/llvm-23/share/cmake/Modules/"
        # Link the C++ ABI by SONAME so the shared SDK needs no other SDK outputs.
        printf 'INPUT( libc++.so.1 -l:libc++abi.so.1 -l:libunwind.so.1 )\n' > "$STAGE/cxx-linker-script"
        mv "$STAGE/cxx-linker-script" "$STAGE/usr/lib/llvm-23/lib/libc++.so"
    - runs: |
        # Preserve the notices for support code and installed SDK headers.
        cat llvm/lib/Support/COPYRIGHT.regex llvm/lib/Support/BLAKE3/LICENSE > THIRD-PARTY-NOTICES.txt
        for file in llvm/lib/Support/xxhash.cpp llvm/lib/Support/ConvertUTF.cpp llvm/lib/Support/UnicodeNameToCodepointGenerated.cpp llvm/include/llvm/WindowsDriver/MSVCSetupApi.h; do
          printf '\n%s\n' "$file" >> THIRD-PARTY-NOTICES.txt
          awk '/^#/{exit} {print}' "$file" >> THIRD-PARTY-NOTICES.txt
        done
        awk '/^#/{exit} {print}' llvm/lib/Support/MD5.cpp > LICENSE.LLVM-MD5
        for project in clang clang-tools-extra lld mlir compiler-rt libcxx libcxxabi libunwind; do
          printf '\n%s/LICENSE.TXT\n' "$project" >> THIRD-PARTY-NOTICES.txt
          cat "$project/LICENSE.TXT" >> THIRD-PARTY-NOTICES.txt
        done
    - uses: license/copy
      with:
        files:
          - llvm/LICENSE.TXT
          - THIRD-PARTY-NOTICES.txt
          - LICENSE.LLVM-MD5
        outputs:
          - llvm-23
          - llvm-23-libs
          - llvm-23-devel
          - llvm-23-static
          - llvm-cmake-23
          - llvm-23-default
          - clang-23
          - clang-23-libs
          - clang-23-devel
          - clang-23-static
          - clang-23-default
          - clang-tools-23
          - clang-tools-23-default
          - clang-analyzer-23
          - clang-analyzer-23-default
          - lld-23
          - lld-23-devel
          - lld-23-static
          - lld-23-default
          - mlir-23
          - mlir-23-libs
          - mlir-23-devel
          - mlir-23-static
          - mlir-23-default
          - compiler-rt-23
          - libcxx-23
          - libcxx-23-devel
          - libcxx-23-static
          - libcxxabi-23
          - libcxxabi-23-devel
          - libcxxabi-23-static
          - llvm-libunwind-23
          - llvm-libunwind-23-devel
          - llvm-libunwind-23-static
    - uses: strip
outputs:
  - name: llvm-23
    files:
      license:
        - /usr/share/licenses/llvm-23/**
    dependencies:
      run:
        - llvm-23-libs = ${package.version}-${package.release}
    tests:
      - name: compile-ir
        stage: installed
        packages:
          - gcc
          - glibc-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf 'define i32 @main() { ret i32 0 }\n' > main.ll
            llvm-as-23 main.ll -o main.bc
            opt-23 -passes=default\<O2\> main.bc -o optimised.bc
            lli-23 optimised.bc
            llc-23 -filetype=obj -relocation-model=pic optimised.bc -o main.o
            gcc main.o -o main
            ./main
            # All three backends must work on both supported host architectures.
            llc-23 -mtriple=x86_64-unknown-linux-gnu -filetype=obj main.bc -o x86.o
            llc-23 -mtriple=aarch64-unknown-linux-gnu -filetype=obj main.bc -o arm.o
            printf 'define i64 @filter() { ret i64 0 }\n' > bpf.ll
            llc-23 -mtriple=bpfel -filetype=obj bpf.ll -o bpf.o
            test ! -e /usr/bin/llvm-as
            test ! -e /usr/bin/llvm-config-23
  - name: llvm-23-libs
    summary: LLVM 23 shared runtime libraries
    files:
      include:
        - /usr/lib*/libLLVM*.so.*
        - /usr/lib*/libLTO*.so.*
        - /usr/lib*/libRemarks*.so.*
        - /usr/lib/llvm-23/lib/libLLVM*.so.*
        - /usr/lib/llvm-23/lib/libLTO*.so.*
        - /usr/lib/llvm-23/lib/libRemarks*.so.*
        - /usr/share/licenses/llvm-23-libs/**
      license:
        - /usr/share/licenses/llvm-23-libs/**
    tests:
      - name: load-library
        stage: installed
        packages:
          - python3
        argv:
          - python3
          - -c
          - |
            import ctypes
            llvm = ctypes.CDLL("libLLVM.so.23.1")
            llvm.LLVMContextCreate.restype = ctypes.c_void_p
            llvm.LLVMContextDispose.argtypes = [ctypes.c_void_p]
            llvm.LLVMContextDispose.restype = None
            context = llvm.LLVMContextCreate()
            assert context
            llvm.LLVMContextDispose(context)
  - name: llvm-23-devel
    summary: LLVM 23 headers and development tools
    files:
      include:
        - /usr/lib/llvm-23/include/llvm/**
        - /usr/lib/llvm-23/include/llvm-c/**
        - /usr/lib/llvm-23/lib/cmake/llvm/**
        - /usr/lib/llvm-23/lib/libLLVM*.so
        - /usr/lib/llvm-23/lib/libLTO*.so
        - /usr/lib/llvm-23/lib/libRemarks*.so
        - /usr/lib/llvm-23/bin/llvm-config
        - /usr/bin/llvm-config-23
        - /usr/share/licenses/llvm-23-devel/**
      exclude:
        - /usr/lib/llvm-23/lib/cmake/llvm/LLVMStaticExports*.cmake
      license:
        - /usr/share/licenses/llvm-23-devel/**
    dependencies:
      run:
        - llvm-23-libs = ${package.version}-${package.release}
        - llvm-cmake-23 = ${package.version}-${package.release}
    tests:
      - name: link-shared
        stage: installed
        packages:
          - gcc-c++
          - cmake
          - make
          - glibc-devel
          - zlib-devel
          - zstd-devel
          - libffi-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            test "$(llvm-config-23 --version)" = 23.1.5
            printf '#include <llvm-c/Core.h>\nint main(void) { LLVMContextRef c = LLVMContextCreate(); LLVMContextDispose(c); return 0; }\n' > main.c
            gcc $(llvm-config-23 --cflags) main.c $(llvm-config-23 --link-shared --ldflags --libs core) -o main
            ./main
            test ! -e /usr/bin/llvm-as-23
            printf 'cmake_minimum_required(VERSION 3.20)\nproject(llvm_smoke C CXX)\nfind_package(LLVM 23.1.0 REQUIRED CONFIG)\nadd_executable(smoke main.c)\ntarget_include_directories(smoke PRIVATE $${LLVM_INCLUDE_DIRS})\ntarget_link_libraries(smoke PRIVATE LLVM)\n' > CMakeLists.txt
            cmake -S . -B build -DLLVM_DIR="$(llvm-config-23 --cmakedir)"
            cmake --build build
            ./build/smoke
  - name: llvm-23-static
    summary: LLVM 23 static libraries
    files:
      include:
        - /usr/lib/llvm-23/lib/libLLVM*.a
        - /usr/lib/llvm-23/lib/cmake/llvm/LLVMStaticExports*.cmake
        - /usr/share/licenses/llvm-23-static/**
      license:
        - /usr/share/licenses/llvm-23-static/**
    dependencies:
      run:
        - llvm-23-devel = ${package.version}-${package.release}
    tests:
      - name: link-static
        stage: installed
        packages:
          - gcc-c++
          - libstdc++-devel
          - glibc-devel
          - zlib-devel
          - zstd-devel
          - libffi-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf '#include <llvm-c/Core.h>\nint main() { LLVMContextRef c = LLVMContextCreate(); LLVMContextDispose(c); }\n' > main.cc
            g++ $(llvm-config-23 --cxxflags) main.cc $(llvm-config-23 --link-static --ldflags --libs core --system-libs) -o main
            ./main
  - name: llvm-cmake-23
    summary: Shared CMake modules for LLVM 23
    files:
      include:
        - /usr/lib/llvm-23/share/cmake/Modules/**
        - /usr/share/licenses/llvm-cmake-23/**
      license:
        - /usr/share/licenses/llvm-cmake-23/**
  - name: llvm-23-default
    summary: Unversioned command names for LLVM 23
    files:
      include:
        - /usr/bin/*
        - /usr/share/licenses/llvm-23-default/**
      exclude:
        - /usr/bin/*-23
        - /usr/bin/clang
        - /usr/bin/clang++
        - /usr/bin/clang-cl
        - /usr/bin/clang-cpp
        - /usr/bin/clang-23
        - /usr/bin/scan-*
        - /usr/bin/analyze-*
        - /usr/bin/intercept-*
        - /usr/bin/mlir-*
        - /usr/bin/tblgen-lsp-server
        - /usr/bin/tblgen-to-irdl
        - /usr/bin/lld
        - /usr/bin/lld-link
        - /usr/bin/ld.lld
        - /usr/bin/ld64.lld
        - /usr/bin/wasm-ld
        - /usr/bin/clang*
        - /usr/bin/diagtool
        - /usr/bin/find-all-symbols
        - /usr/bin/git-clang-format
        - /usr/bin/hmaptool
        - /usr/bin/modularize
        - /usr/bin/pp-trace
        - /usr/bin/run-clang-tidy*
        - /usr/bin/c-index-test
        - /usr/bin/amdgpu-arch
        - /usr/bin/nvptx-arch
      license:
        - /usr/share/licenses/llvm-23-default/**
    dependencies:
      run:
        - llvm-23 = ${package.version}-${package.release}
        - llvm-23-devel = ${package.version}-${package.release}
      conflicts:
        - llvm-22-default
      provides:
        - llvm = ${package.version}-${package.release}
    tests:
      - name: selected-commands
        stage: installed
        argv:
          - bash
          - -eu
          - -c
          - |
            test "$(llvm-config --version)" = 23.1.5
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            printf 'define i32 @main() { ret i32 0 }\n' > "$work/main.ll"
            llvm-as "$work/main.ll" -o "$work/main.bc"
            lli "$work/main.bc"
  - name: clang-23
    summary: Clang 23 C and C++ compiler
    files:
      include:
        - /usr/lib/llvm-23/bin/clang
        - /usr/lib/llvm-23/bin/clang++
        - /usr/lib/llvm-23/bin/clang-cl
        - /usr/lib/llvm-23/bin/clang-cpp
        - /usr/lib/llvm-23/bin/clang-23
        - /usr/bin/clang-23
        - /usr/bin/clang++-23
        - /usr/bin/clang-cl-23
        - /usr/bin/clang-cpp-23
        - /usr/bin/clang-23-23
        - /usr/lib/llvm-23/lib/clang/23/include/**
        - /usr/lib/llvm-23/share/clang/**
        - /usr/share/licenses/clang-23/**
      license:
        - /usr/share/licenses/clang-23/**
      exclude:
        - /usr/lib/llvm-23/lib/clang/23/include/sanitizer/**
        - /usr/lib/llvm-23/lib/clang/23/include/fuzzer/**
        - /usr/lib/llvm-23/lib/clang/23/include/orc/**
        - /usr/lib/llvm-23/lib/clang/23/include/profile/**
        - /usr/lib/llvm-23/lib/clang/23/include/xray/**
    dependencies:
      run:
        - clang-23-libs = ${package.version}-${package.release}
        - gcc
        - binutils
    tests:
      - name: compile-c-and-cxx
        stage: installed
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf '#include <stdio.h>\nint main(void) { puts("clang"); }\n' > main.c
            clang-23 main.c -o main
            ./main
            printf '#include <vector>\nint main() { std::vector<int> v{42}; return v[0] != 42; }\n' > main.cc
            clang++-23 main.cc -o main-cxx
            ./main-cxx
            test ! -e /usr/bin/clang
        packages:
          - glibc-devel
          - libstdc++-devel
  - name: clang-23-libs
    summary: Clang 23 shared libraries
    files:
      include:
        - /usr/lib*/libclang*.so.*
        - /usr/lib/llvm-23/lib/libclang*.so.*
        - /usr/share/licenses/clang-23-libs/**
      license:
        - /usr/share/licenses/clang-23-libs/**
    dependencies:
      run:
        - llvm-23-libs = ${package.version}-${package.release}
    tests:
      - name: load-c-api
        stage: installed
        argv:
          - bash
          - -eu
          - -c
          - |
            python3 -c 'import ctypes; c = ctypes.CDLL("libclang.so.23.1"); c.clang_createIndex.restype = ctypes.c_void_p; c.clang_disposeIndex.argtypes = [ctypes.c_void_p]; i = c.clang_createIndex(0, 0); assert i; c.clang_disposeIndex(i)'
        packages:
          - python3
  - name: clang-23-devel
    summary: Clang 23 headers and shared development files
    files:
      include:
        - /usr/lib/llvm-23/include/clang*/**
        - /usr/lib/llvm-23/lib/libclang*.so
        - /usr/lib/llvm-23/lib/cmake/clang/**
        - /usr/share/licenses/clang-23-devel/**
      license:
        - /usr/share/licenses/clang-23-devel/**
      exclude:
        - /usr/lib/llvm-23/lib/cmake/clang/ClangStaticTargets*.cmake
    dependencies:
      run:
        - clang-23-libs = ${package.version}-${package.release}
        - llvm-23-devel = ${package.version}-${package.release}
    tests:
      - name: link-shared-and-cmake
        stage: installed
        packages:
          - gcc-c++
          - cmake
          - make
          - glibc-devel
          - zlib-devel
          - zstd-devel
          - libffi-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            cd "$work"
            printf '#include <clang-c/Index.h>\nint main() { CXIndex c = clang_createIndex(0, 0); clang_disposeIndex(c); }\n' > main.cc
            g++ -std=c++17 -I/usr/lib/llvm-23/include main.cc -L/usr/lib/llvm-23/lib -lclang -lLLVM -o main
            ./main
            printf 'cmake_minimum_required(VERSION 3.20)\nproject(sdk_smoke C CXX)\nfind_package(Clang 23.1.0 REQUIRED CONFIG)\nadd_executable(smoke main.cc)\ntarget_include_directories(smoke PRIVATE $${CLANG_INCLUDE_DIRS} $${LLVM_INCLUDE_DIRS})\ntarget_link_libraries(smoke PRIVATE libclang LLVM)\n' > CMakeLists.txt
            cmake -S . -B build -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23
            cmake --build build
            ./build/smoke
  - name: clang-23-static
    summary: Clang 23 static libraries
    files:
      include:
        - /usr/lib/llvm-23/lib/libclang*.a
        - /usr/lib/llvm-23/lib/cmake/clang/ClangStaticTargets*.cmake
        - /usr/share/licenses/clang-23-static/**
      license:
        - /usr/share/licenses/clang-23-static/**
    dependencies:
      run:
        - clang-23-devel = ${package.version}-${package.release}
        - llvm-23-static = ${package.version}-${package.release}
    tests:
      - name: link-static-api
        stage: installed
        packages:
          - gcc-c++
          - glibc-devel
          - libstdc++-devel
          - zlib-devel
          - zstd-devel
          - libffi-devel
        argv:
          - bash
          - -eu
          - -c
          - |
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
