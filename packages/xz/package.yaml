# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# XZ and LZMA compression tools and library. A dependency for the minimal Eternal build root.
schema: 1

package:
  name: xz
  version: "5.8.4"
  release: 1
  summary: XZ and LZMA compression tools and library
  description: |
    XZ Utils provide the xz and lzma command line tools and the liblzma compression library.
  license: 0BSD AND LGPL-2.1-or-later AND GPL-2.0-or-later
  upstream: https://tukaani.org/xz/
  cpe:
    vendor: tukaani
    product: xz

sources:
  - name: xz-5.8.4.tar.xz
    kind: archive
    digest: "sha512:6ade85c1bcff651cdb9543d0b9e7d932c50c9a45e362ada3ef5edf173cd6fb18786f24bc73058db37440f3d92d2178a4e24448f725f4f22146c9a63ed15be432"
    locators:
      - kind: https
        url: https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz
      - kind: https
        url: https://downloads.sourceforge.net/project/lzmautils/xz-5.8.4.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --disable-static
          - --disable-nls
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING, COPYING.0BSD, COPYING.GPLv2, COPYING.LGPLv2.1]
        outputs: [xz, xz-libs, xz-devel, xz-doc]
    - uses: strip

outputs:
  - name: xz
    summary: XZ and LZMA compression tools
    files:
      include:
        - /usr/bin/*
        - /usr/share/licenses/xz/COPYING
        - /usr/share/licenses/xz/COPYING.0BSD
        - /usr/share/licenses/xz/COPYING.GPLv2
        - /usr/share/licenses/xz/COPYING.LGPLv2.1
      license:
        - /usr/share/licenses/xz/COPYING
        - /usr/share/licenses/xz/COPYING.0BSD
        - /usr/share/licenses/xz/COPYING.GPLv2
        - /usr/share/licenses/xz/COPYING.LGPLv2.1
    dependencies:
      run:
        - xz-libs = ${package.version}-${package.release}
    tests:
      - name: roundtrip
        stage: installed
        packages:
          - coreutils
          - diffutils
        files: tests
        script: |
          bash "$TEST_FILES/roundtrip.sh"

  - name: xz-libs
    summary: XZ runtime library
    files:
      include:
        - /usr/lib*/liblzma.so.*
        - /usr/share/licenses/xz-libs/COPYING
        - /usr/share/licenses/xz-libs/COPYING.0BSD
        - /usr/share/licenses/xz-libs/COPYING.GPLv2
        - /usr/share/licenses/xz-libs/COPYING.LGPLv2.1
      license:
        - /usr/share/licenses/xz-libs/COPYING
        - /usr/share/licenses/xz-libs/COPYING.0BSD
        - /usr/share/licenses/xz-libs/COPYING.GPLv2
        - /usr/share/licenses/xz-libs/COPYING.LGPLv2.1
    tests:
      - name: minimal-runtime-dependencies
        stage: installed
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["liblzma.so.[0-9]*"]
      - name: runtime
        stage: installed
        packages:
          - python3
        files: tests
        script: |
          python3 "$TEST_FILES/runtime.py"

  - name: xz-devel
    summary: XZ development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/xz-devel/COPYING
        - /usr/share/licenses/xz-devel/COPYING.0BSD
        - /usr/share/licenses/xz-devel/COPYING.GPLv2
        - /usr/share/licenses/xz-devel/COPYING.LGPLv2.1
      license:
        - /usr/share/licenses/xz-devel/COPYING
        - /usr/share/licenses/xz-devel/COPYING.0BSD
        - /usr/share/licenses/xz-devel/COPYING.GPLv2
        - /usr/share/licenses/xz-devel/COPYING.LGPLv2.1
    dependencies:
      run:
        - xz-libs = ${package.version}-${package.release}
    tests:
      - name: compression-api
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - coreutils
        files: tests
        script: |
          bash "$TEST_FILES/compression-api.sh"

  - name: xz-doc
    summary: XZ documentation
    files:
      include:
        - "@man"
        - "@info"
        - "@doc"
        - /usr/share/licenses/xz-doc/COPYING
        - /usr/share/licenses/xz-doc/COPYING.0BSD
        - /usr/share/licenses/xz-doc/COPYING.GPLv2
        - /usr/share/licenses/xz-doc/COPYING.LGPLv2.1
      license:
        - /usr/share/licenses/xz-doc/COPYING
        - /usr/share/licenses/xz-doc/COPYING.0BSD
        - /usr/share/licenses/xz-doc/COPYING.GPLv2
        - /usr/share/licenses/xz-doc/COPYING.LGPLv2.1

tests:
  - name: upstream
    stage: build
    packages: [bash-binsh, coreutils, diffutils, grep, sed, gawk, perl]
    artifacts: [test-suite.log, tests/test-suite.log, testsuite/test-suite.log]
    pipeline:
      - uses: make/check
