# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Portable foreign function interface library. A dependency for the minimal Eternal build root.
schema: 2

package:
  name: libffi
  version: "3.8.0"
  release: 1
  summary: Portable foreign function interface library
  description: |
    libffi provides a portable, high level programming interface to various calling conventions.
  license: MIT
  upstream: https://github.com/libffi/libffi
  cpe:
    vendor: libffi
    product: libffi

sources:
  - name: libffi-3.8.0.tar.gz
    kind: archive
    digest: "sha512:a259d50f40b5dcde9cb6227bd105761e667290f107553b204a5a6cfdfbf2e6b022ed04be2ea4596da42961d11396125425def3cb67e2844a9eba90b6750c8c39"
    locators:
      - kind: https
        url: https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
      with:
        args: [--disable-static]
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [LICENSE]
        outputs: [libffi, libffi-devel, libffi-doc]
    - uses: strip

  tests:
    - name: upstream
      environment:
        USER: rpmx-test
        LOGNAME: rpmx-test
      packages:
        - dejagnu
        - diffutils
      artifacts:
        - test/test-suite.log
        - test-suite.log
        - testsuite/libffi.log
        - testsuite/libffi.sum
      pipeline:
        - uses: make/check

outputs:
  - name: libffi
    summary: Portable foreign function interface library
    files:
      license:
        - /usr/share/licenses/libffi/LICENSE
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libffi.so.*"]
  - name: libffi-devel
    summary: libffi development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/libffi-devel/LICENSE
      license:
        - /usr/share/licenses/libffi-devel/LICENSE
    dependencies:
      run:
        - libffi = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists libffi
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags libffi) "$TEST_FILES/behavior.c" $(pkg-config --libs libffi) -o behavior
          ./behavior
  - name: libffi-doc
    summary: libffi documentation
    files:
      include:
        - "@man"
        - "@info"
        - "@doc"
        - /usr/share/licenses/libffi-doc/LICENSE
      license:
        - /usr/share/licenses/libffi-doc/LICENSE
