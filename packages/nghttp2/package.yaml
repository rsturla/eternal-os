# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
# Reference: https://github.com/wolfi-dev/os/blob/bb1330c86b585488efc3b7789af3f03e3557f1c8/nghttp2.yaml
# Build the shared library needed by curl. Defer the server and proxy applications.
schema: 1
package:
  name: nghttp2
  version: 1.71.0
  release: 1
  summary: HTTP/2 protocol library
  description: HTTP/2 protocol library.
  license: MIT
  upstream: https://nghttp2.org/
sources:
- name: nghttp2-1.71.0.tar.xz
  kind: archive
  digest: sha512:3e8702d86ce7fd85e578bf04fcf1283a090d369e9d6530144212726c07c70a5efc53afde16bac877ffc7e8ea7eabc65868e9156e67ce7c424ab5849f4f79cac0
  locators:
  - kind: https
    url: https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz
  extract:
    format: tar.xz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - pkgconf
  pipeline:
  - uses: autotools/configure
    with:
      args:
      - --enable-lib-only
      - --disable-static
      - --disable-python-bindings
  - uses: make/build
  - uses: make/install
  - runs: |
      find "$STAGE" -name "*.la" -delete
  - uses: license/copy
    with:
      files:
      - COPYING
      outputs:
      - nghttp2
      - nghttp2-devel
      - nghttp2-doc
  - uses: strip
outputs:
- name: nghttp2
  files:
    license:
    - /usr/share/licenses/nghttp2/**
  dependencies:
    provides:
    - libnghttp2 = ${package.version}-${package.release}
  tests:
  - name: load
    stage: installed
    packages:
    - python3
    argv:
    - bash
    - -eu
    - -c
    - |
      python3 -c 'import ctypes; ctypes.CDLL("libnghttp2.so.14")'
- name: nghttp2-devel
  files:
    include:
    - '@dev'
    - /usr/share/licenses/nghttp2-devel/**
    license:
    - /usr/share/licenses/nghttp2-devel/**
  dependencies:
    run:
    - nghttp2 = ${package.version}-${package.release}
    provides:
    - libnghttp2-devel = ${package.version}-${package.release}
  tests:
  - name: compile-and-run
    stage: installed
    packages:
    - gcc
    - glibc-devel
    - pkgconf
    argv:
    - bash
    - -eu
    - -c
    - |
      cat > /tmp/test.c <<'EOF'
      #include <nghttp2/nghttp2.h>
      int main(void) { nghttp2_session_callbacks *c; if (nghttp2_session_callbacks_new(&c)) return 1; nghttp2_session_callbacks_del(c); return 0; }
      EOF
      gcc /tmp/test.c $(pkg-config --cflags --libs libnghttp2) -o /tmp/test
      /tmp/test
- name: nghttp2-doc
  files:
    include:
    - '@doc'
    - '@man'
    - /usr/share/licenses/nghttp2-doc/**
    license:
    - /usr/share/licenses/nghttp2-doc/**
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
