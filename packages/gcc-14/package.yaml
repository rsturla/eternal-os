# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GCC 14 has versioned commands and an optional exclusive default selector.
# GCC 16 supplies the public compiler runtimes. Older streams keep their
# link inputs private and use the public runtimes when compiled programs run.
schema: 2

package:
  name: gcc-14
  version: "14.4.0"
  release: 3
  summary: The GNU Compiler Collection, version 14
  description: |
    GCC 14 provides the C and C++ compilers, the GNU runtime libraries and the
    compiler support files used to build Eternal Linux.
  license: GPL-3.0-or-later WITH GCC-exception-3.1
  upstream: https://gcc.gnu.org/
  cpe:
    vendor: gnu
    product: gcc

sources:
  - name: gcc-14.4.0.tar.xz
    kind: archive
    digest: "sha512:725ed8bdd43ef1726ffe8b5e8615a13e247fac9575b7626ae013a2975d000ea213212dc414b2f2631ac4785c1c8beca85555222faf9904d3b2fa6a3807a83a15"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/gcc/gcc-14.4.0/gcc-14.4.0.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/gcc/gcc-14.4.0/gcc-14.4.0.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

patches:
  - file: patches/aarch64-pch-pie.patch
    reason: "Backport AArch64 PCH support for PIE compiler executables"
  - file: patches/aarch64-sve-float16-range.patch
    reason: "Backport upstream SVE half-precision test input correction"
  - file: patches/derived-type-module-attributes.patch
    reason: "Backport upstream derived-type module attributes"

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
    - gcc
    - gcc-c++
    # libcpp configure probes EUC-JP conversion before enabling iconv support.
    - glibc-iconv
    - make
    - bash
    - coreutils
    - bison
    - flex
    - file
    - gawk
    - sed
    - grep
    - diffutils
    - findutils
    - gettext
    - python3
    - texinfo
    - patch
    - tar
    - gzip
  sysroot:
    - libstdc++-devel
    - gmp-devel
    - mpfr-devel
    - libmpc-devel
    - isl-devel
    - zlib-devel
    - kernel-headers
    - glibc-devel
  environment:
    # Build this compiler with the policy it will itself apply, but keep its
    # own diagnostics non-fatal. The wrapper applies the arch baseline too.
    GCC_SPEC_FILE: openssf-soft-format-14.spec
  pipeline:
    - runs: |
        mkdir build
        # In-tree xgcc bypasses the OpenSSF wrapper. Protect target libraries
        # explicitly, while allowing upstream CRT/PIC and libgcc overrides.
        target_cflags='-O2 -g -pipe -Wall -Wformat -Wformat-security'
        target_cflags="$target_cflags -fexceptions -fasynchronous-unwind-tables -grecord-gcc-switches"
        target_cflags="$target_cflags -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -D_GLIBCXX_ASSERTIONS"
        target_cflags="$target_cflags -fstack-protector-strong -fstack-clash-protection -ftrivial-auto-var-init=zero"
        target_cflags="$target_cflags -fno-delete-null-pointer-checks -fno-strict-overflow -fno-strict-aliasing"
        target_cflags="$target_cflags -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
        target_ldflags='-Wl,--as-needed,-O1,--sort-common,-z,noexecstack,-z,relro,-z,now'
        target_ldflags="$target_ldflags -Wl,-z,pack-relative-relocs,--build-id=sha1,--error-rwx-segments,--error-execstack"
        case "$RPMX_TARGET_ARCH" in
          aarch64)
            target_cflags="$target_cflags -mbranch-protection=standard"
            target_ldflags="$target_ldflags -fuse-ld=bfd"
            ;;
          x86_64)
            target_cflags="$target_cflags -march=x86-64-v2 -fcf-protection=full"
            ;;
          *) echo "unsupported GCC target architecture: $RPMX_TARGET_ARCH" >&2; exit 1 ;;
        esac
        # C++ already enables exceptions by default. Do not override runtime
        # libraries such as libitm that deliberately compile with -fno-exceptions.
        # Keep -fexceptions for C and retain every other target hardening flag.
        target_cxxflags=$(printf '%s\n' "$target_cflags" | sed 's/ -fexceptions / /')
        printf '%s\n' "$target_cflags" > build/target-cflags
        printf '%s\n' "$target_cxxflags" > build/target-cxxflags
        printf '%s\n' "$target_ldflags" > build/target-ldflags
    - uses: autotools/configure
      with:
        dir: build
        configure: ../configure
        args:
          - --program-suffix=-14
          - '--with-pkgversion="Eternal gcc-14-2"'
          - --with-glibc-version=2.44
          - --with-sysroot=/
          - --enable-languages=c,c++
          - --enable-version-specific-runtime-libs
          - --with-gcc-major-version-only
          - --disable-bootstrap
          - --disable-nls
          - --disable-werror
          - --disable-multilib
          - --disable-libcc1
          - --disable-libsanitizer
          - --disable-libquadmath
          - --enable-shared
          - --enable-threads=posix
          - --enable-tls
          # Keep normal compiler commands hardened, including outside the wrapper.
          - --enable-default-pie
          - --enable-default-ssp
          - --enable-standard-branch-protection
          # Protect shipped runtime/startup objects with explicit production flags.
          - 'CFLAGS_FOR_TARGET="$(cat target-cflags)"'
          - 'CXXFLAGS_FOR_TARGET="$(cat target-cxxflags)"'
          - 'LDFLAGS_FOR_TARGET="$(cat target-ldflags)"'
          - '$(if [ "$RPMX_TARGET_ARCH" = x86_64 ]; then printf %s --enable-cet; fi)'
          - --enable-initfini-array
          - --enable-gnu-indirect-function
          - --enable-gnu-unique-object
          - --with-system-zlib
          - --with-linker-hash-style=gnu
    - uses: make/build
      with:
        dir: build
    - uses: make/install
      with:
        dir: build
    - name: relocate private libgcc
      runs: |
        # GCC's multilib suffix puts the private unwinder beside the major
        # directory. Keep it on this compiler's link search path, as in Wolfi.
        count=0
        for target in "$STAGE$LIBDIR/gcc/"*; do
          test -d "$target/14" || continue
          if ! test -f "$target/lib64/libgcc_s.so.1"; then
            echo "missing installed private unwinder: $target/lib64/libgcc_s.so.1" >&2
            exit 1
          fi
          mv "$target"/lib64/libgcc_s.* "$target/14/"
          rmdir "$target/lib64"
          count=$((count + 1))
        done
        if test "$count" != 1; then
          echo "expected one GCC 14 runtime directory under $STAGE$LIBDIR/gcc; found $count" >&2
          exit 1
        fi
    - runs: |
        # Like Wolfi and Fedora, drop libtool archives. They embed build paths
        # and are not needed at runtime or link time.
        find "$STAGE" -name '*.la' -delete
        # install-driver can leave a temporary hard link when mv sees the
        # same inode at the final name. It must not escape into a stream RPM.
        for temporary in "$STAGE"/usr/bin/*-gcc-tmp; do
          test -e "$temporary" || continue
          final="$${temporary%-tmp}-14"
          if ! test "$temporary" -ef "$final"; then
            echo "unexpected GCC installation temporary: $temporary" >&2
            exit 1
          fi
          rm "$temporary"
        done
    - uses: license/copy
      with:
        files: [COPYING3, COPYING3.LIB, COPYING.RUNTIME]
        outputs: [gcc-14, gcc-14-default, libstdc++-14, libstdc++-14-devel, libstdc++-14-static, libatomic-14, gcc-14-doc]
    - runs: |
        # The default package owns the stable command names. The versioned
        # names stay with gcc-14.
        install -d "$STAGE/usr/bin"
        for name in cpp gcc g++ gcc-ar gcc-nm gcc-ranlib gcov gcov-dump gcov-tool lto-dump; do
          ln -sf "$name-14" "$STAGE/usr/bin/$name"
        done
        # GCC does not install cc-14 or c++-14; point the generic names at the
        # compilers that actually exist.
        ln -sf gcc-14 "$STAGE/usr/bin/cc"
        ln -sf g++-14 "$STAGE/usr/bin/c++"
        ln -sf gcc-14 "$STAGE/usr/bin/c89"
        ln -sf gcc-14 "$STAGE/usr/bin/c99"
    - uses: strip

  tests:
    - name: upstream
      optional: true
      environment:
        USER: rpmx-test
        LOGNAME: rpmx-test
      packages:
        - dejagnu
        - expect
        # Resolver tests need localhost records and named TCP services.
        - setup
        # libstdc++ probes named locales and otherwise marks those tests unsupported.
        - glibc-locale-ca
        - glibc-locale-de
        - glibc-locale-en
        - glibc-locale-es
        - glibc-locale-fr
        - glibc-locale-extra
        # Exercise fully static programs as well as shared-library consumers.
        - glibc-static
      pipeline:
        - runs: |
            status=0
            # Upstream tests choose their own diagnostic and optimization flags.
            # Keep production hardening on the already built target libraries.
            # Exercise the compiler's normal hardened defaults on the unix board.
            printf 'Running GCC source tests: arch=%s jobs=%s\n' "$RPMX_TARGET_ARCH" "$JOBS"
            make -C build -j"$JOBS" -k check-gcc check-target-libstdc++-v3 \
              RUNTESTFLAGS='--target_board=unix' \
              CFLAGS_FOR_TARGET='-g -O2' CXXFLAGS_FOR_TARGET='-g -O2' \
              LDFLAGS_FOR_TARGET= || status=$?
            mkdir -p upstream-reports
            find build -type f \( -name '*.sum' -o -name '*.log' \) -exec cp --parents '{}' upstream-reports/ \;
            for suite in gcc g++ libstdc++; do
              find build -type f -name "$suite.sum" -exec cat '{}' + > "upstream-reports/$suite.summary"
              if ! grep -E '# of expected passes[[:space:]]+[1-9][0-9]*' "upstream-reports/$suite.summary"; then
                echo "no expected passes recorded for $suite" >&2
                status=1
              fi
              if grep -E '^(FAIL|XPASS|ERROR|UNRESOLVED):' "upstream-reports/$suite.summary"; then
                echo "unexpected DejaGNU result in $suite" >&2
                status=1
              fi
            done
            test "$status" = 0
      artifacts:
        - upstream-reports
      timeout: 5h

outputs:
  - name: gcc-14
    generators:
      elf: {provides: false}
    summary: GCC 14 compiler and link-time support
    # Keep compiler archives, CRT objects and the unversioned linker stub here.
    # Runtime SONAMEs stay private; installed programs use GCC 16 public runtimes.
    files:
      license:
        - /usr/share/licenses/gcc-14/COPYING3
        - /usr/share/licenses/gcc-14/COPYING3.LIB
        - /usr/share/licenses/gcc-14/COPYING.RUNTIME
    lint:
      allow:
        - static-archive
    dependencies:
      run:
        - binutils
        - glibc-devel
        # Compiler input/output character sets use the installed gconv modules.
        - glibc-iconv
        - libgcc >= ${package.version}
        - libstdc++ >= ${package.version}
        - libatomic >= ${package.version}
        - libatomic-14 = ${package.version}-${package.release}
        - libgomp >= ${package.version}
        - libitm >= ${package.version}
        - libstdc++-14-devel = ${package.version}-${package.release}
      provides:
        - gcc-14 = ${package.version}-${package.release}

    tests:
      - name: versioned-command-payload
        files: tests
        script: bash "$TEST_FILES/versioned-command-payload.sh" 14
      - name: private-compiler-payload
        files: tests
        script: bash "$TEST_FILES/private-compiler-payload.sh" 14
      - name: cxx-header-unit-import
        packages:
          - bash
          - coreutils
        files: tests
        script: CXX=g++-14 bash "$TEST_FILES/header-unit.sh"
      - name: source-character-set-conversion
        files: tests
        script: bash "$TEST_FILES/charset.sh" gcc-14
      - name: c-runtime
        packages:
          - bash
          - coreutils
          - grep
        files: tests
        script: |
          for optimization in -O0 -O2 -O3 -Os; do
            gcc-14 -std=c11 "$optimization" -Wall -Wextra -Werror -pthread "$TEST_FILES/runtime.c" -o runtime
            ./runtime
          done
          gcc-14 -fopenmp -O2 "$TEST_FILES/openmp.c" -o openmp
          ./openmp
          cp "$TEST_FILES/runtime.c" coverage.c
          gcc-14 --coverage -pthread coverage.c -o coverage
          ./coverage
          gcov-14 coverage.c
          grep -E '^[[:space:]]*1:[[:space:]]*[0-9]+:.*puts\("c-runtime-ok"\)' coverage.c.gcov
        artifacts:
          - coverage.c.gcov
      - name: linker-lto-and-diagnostics
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          gcc-14 -O2 -flto -c "$TEST_FILES/library.c" -o library.o
          gcc-ar-14 rcs libprobe.a library.o
          gcc-ranlib-14 libprobe.a
          gcc-14 -flto "$TEST_FILES/main.c" libprobe.a -o linked
          ./linked
          gcc-14 -fPIC -shared "$TEST_FILES/library.c" -o libprobe.so
          gcc-14 "$TEST_FILES/main.c" -L. -lprobe -Wl,-rpath,'$ORIGIN' -o dynamic
          ./dynamic
          if gcc-14 -Werror -c "$TEST_FILES/invalid.c" -o invalid.o >invalid.stdout 2>invalid.stderr; then
            echo 'invalid C unexpectedly compiled'; exit 1
          fi
          case "$(<invalid.stderr)" in
            *missing_identifier*) ;;
            *) echo 'compiler did not diagnose missing_identifier' >&2; exit 1 ;;
          esac
          gcc-14 -E "$TEST_FILES/main.c" > preprocessed.c
          gcc-14 preprocessed.c libprobe.a -o preprocessed
          ./preprocessed
        artifacts:
          - invalid.stderr
      - name: compiler-default-hardening
        packages: [bash, binutils, coreutils, grep]
        files: tests
        script: bash "$TEST_FILES/default-hardening.sh" /usr/bin/gcc-14 /usr/bin/g++-14
        artifacts:
          - default-hardening
      - name: target-runtime-branch-protection
        packages: [bash, binutils, coreutils, grep]
        files: tests
        script: |
          bash "$TEST_FILES/branch-protection.sh" /usr/bin/gcc-14
        artifacts:
          - branch-protection
      - name: private-link-and-public-runtime
        files: tests
        script: bash "$TEST_FILES/runtime-selection.sh" 14
        packages: [binutils, grep]
        artifacts: [runtime-selection]
  - name: gcc-14-default
    summary: Stable command names for GCC 14
    files:
      include:
        - /usr/bin/c++
        - /usr/bin/c89
        - /usr/bin/c99
        - /usr/bin/cc
        - /usr/bin/cpp
        - /usr/bin/g++
        - /usr/bin/gcc
        - /usr/bin/gcc-ar
        - /usr/bin/gcc-nm
        - /usr/bin/gcc-ranlib
        - /usr/bin/gcov
        - /usr/bin/gcov-dump
        - /usr/bin/gcov-tool
        - /usr/bin/lto-dump
        - /usr/share/licenses/gcc-14-default/**
      license:
        - /usr/share/licenses/gcc-14-default/COPYING3
        - /usr/share/licenses/gcc-14-default/COPYING3.LIB
        - /usr/share/licenses/gcc-14-default/COPYING.RUNTIME
    dependencies:
      run:
        - gcc-14 = ${package.version}-${package.release}
        - libstdc++-14-devel = ${package.version}-${package.release}
      conflicts:
        - gcc-13-default
        - gcc-15-default
        - gcc-16-default
      provides:
        - gcc = ${package.version}-${package.release}
        - gcc-c++ = ${package.version}-${package.release}
        - cpp = ${package.version}-${package.release}
        - cc = ${package.version}-${package.release}

    tests:
      - name: default-command-links
        packages:
          - bash
          - coreutils
        files: tests
        script: |
          for command in gcc cc c89 c99; do
           test "$(readlink /usr/bin/$command)" = gcc-14
           "$command" -std=c11 -pthread "$TEST_FILES/runtime.c" -o "probe-$command"
           ./"probe-$command"
          done
          for command in g++ c++; do
           test "$(readlink /usr/bin/$command)" = g++-14
           "$command" -std=c++17 -pthread "$TEST_FILES/containers.cc" -o "probe-$command"
           output=$(./"probe-$command")
           test "$output" = cxx-runtime-ok
          done
  - name: libstdc++-14
    generators:
      elf: {provides: false}
    summary: GCC 14 private C++ link-time runtime
    files:
      include:
        - /usr/lib*/gcc/*/14/libstdc++.so.*
        - /usr/share/licenses/libstdc++-14/**
      license:
        - /usr/share/licenses/libstdc++-14/COPYING3
        - /usr/share/licenses/libstdc++-14/COPYING3.LIB
        - /usr/share/licenses/libstdc++-14/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++ >= ${package.version}

    tests:
      - name: containers-exceptions-and-threads
        packages:
          - bash
          - gcc-14
          - libstdc++-14-devel
        files: tests
        script: |
          g++-14 -std=c++17 -O2 -Wall -Wextra -Werror -pthread "$TEST_FILES/containers.cc" -o containers
          ./containers
      - name: private-runtime-location-and-loadability
        files: tests
        script: bash "$TEST_FILES/private-runtime.sh" 14 libstdc++
  - name: libstdc++-14-devel
    summary: GNU Standard C++ Library development files
    files:
      include:
        - /usr/lib*/gcc/*/14/libstdc++*
        - /usr/lib*/gcc/*/14/include/c++/**
        - /usr/share/gcc-14/**
        - /usr/share/licenses/libstdc++-14-devel/**
      exclude:
        - /usr/lib*/gcc/*/14/libstdc++.so.*
        - /usr/lib*/lib*.a
        - /usr/lib*/gcc/*/14/libstdc++*.a
        - /usr/lib*/gcc/*/14/libsupc++.a
      license:
        - /usr/share/licenses/libstdc++-14-devel/COPYING3
        - /usr/share/licenses/libstdc++-14-devel/COPYING3.LIB
        - /usr/share/licenses/libstdc++-14-devel/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++-14 = ${package.version}-${package.release}
        - glibc-devel

    tests:
      - name: containers-exceptions-and-threads
        packages:
          - bash
          - gcc-14
        files: tests
        script: |
          g++-14 -std=c++17 -O2 -Wall -Wextra -Werror -pthread "$TEST_FILES/containers.cc" -o containers
          ./containers
  - name: libstdc++-14-static
    summary: GNU Standard C++ Library static archives
    files:
      include:
        - /usr/lib*/gcc/*/14/libstdc++*.a
        - /usr/lib*/gcc/*/14/libsupc++.a
        - /usr/share/licenses/libstdc++-14-static/**
      license:
        - /usr/share/licenses/libstdc++-14-static/COPYING3
        - /usr/share/licenses/libstdc++-14-static/COPYING3.LIB
        - /usr/share/licenses/libstdc++-14-static/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++-14-devel = ${package.version}-${package.release}

    tests:
      - name: static-cxx-runtime
        packages:
          - bash
          - gcc-14
          - binutils
          - grep
        files: tests
        script: |
          g++-14 -std=c++17 -pthread -static-libstdc++ -static-libgcc "$TEST_FILES/containers.cc" -o containers
          ./containers
          readelf -d containers > dynamic.txt
          if grep -F 'libstdc++' dynamic.txt; then exit 1; fi
  - name: libatomic-14
    generators:
      elf: {provides: false}
    summary: GCC 14 private atomic link-time runtime
    files:
      include:
        - /usr/lib*/gcc/*/14/libatomic.so.*
        - /usr/share/licenses/libatomic-14/**
      license:
        - /usr/share/licenses/libatomic-14/COPYING3
        - /usr/share/licenses/libatomic-14/COPYING3.LIB
        - /usr/share/licenses/libatomic-14/COPYING.RUNTIME
    dependencies:
      run:
        - libatomic >= ${package.version}

    tests:
      - name: non-lock-free-atomics
        packages:
          - bash
          - gcc-14
        files: tests
        script: |
          gcc-14 "$TEST_FILES/atomic.c" -latomic -o atomic
          ./atomic
      - name: private-runtime-location-and-loadability
        files: tests
        script: bash "$TEST_FILES/private-runtime.sh" 14 libatomic
  - name: gcc-14-doc
    summary: GCC 14 documentation
    files:
      include:
        - "@info"
        - "@man"
        - /usr/share/licenses/gcc-14-doc/**
      license:
        - /usr/share/licenses/gcc-14-doc/COPYING3
        - /usr/share/licenses/gcc-14-doc/COPYING3.LIB
        - /usr/share/licenses/gcc-14-doc/COPYING.RUNTIME
