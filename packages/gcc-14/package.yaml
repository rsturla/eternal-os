# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GCC 14, one of the supported side-by-side compiler streams. The version
# is part of the package name so streams can be installed alongside each
# other. `gcc-14-default` provides the unversioned `gcc` capability and the
# stable command names; only one default package can own those links.
#
# The compiler is built without bootstrap (the seed compiler is the build
# compiler) and without Fortran for the first import. The runtime libraries are
# split the same way Wolfi splits them: libstdc++, libatomic and the compiler
# proper are independent outputs.
schema: 1

package:
  name: gcc-14
  version: "14.4.0"
  release: 1
  summary: The GNU Compiler Collection, version 14
  description: |
    GCC 14 provides the C and C++ compilers, the GNU runtime libraries and the
    compiler support files used to build Eternal Linux.
  license: GPL-3.0-or-later WITH GCC-exception-3.1
  upstream: https://gcc.gnu.org/
  cpe:
    vendor: gnu
    product: gcc

sources:
  - name: gcc-14.4.0.tar.xz
    kind: archive
    digest: "sha512:725ed8bdd43ef1726ffe8b5e8615a13e247fac9575b7626ae013a2975d000ea213212dc414b2f2631ac4785c1c8beca85555222faf9904d3b2fa6a3807a83a15"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/gcc/gcc-14.4.0/gcc-14.4.0.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/gcc/gcc-14.4.0/gcc-14.4.0.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  dependencies:
    tools:
      - gcc
      - gcc-c++
      - make
      - bash
      - coreutils
      - bison
      - flex
      - gawk
      - sed
      - grep
      - diffutils
      - findutils
      - gettext
      - python3
      - texinfo
      - patch
      - tar
      - gzip
    host:
      - gmp-devel
      - mpfr-devel
      - libmpc-devel
      - isl-devel
      - zlib-ng-compat-devel
      - kernel-headers
      - glibc-devel
  flags:
    exclude:
      # GCC's own diagnostics should not become build failures while the
      # target compiler is still being assembled.
      - -Werror=format-security
  pipeline:
    - runs: |
        mkdir build
    - uses: autotools/configure
      with:
        dir: build
        configure: ../configure
        args:
          - --program-suffix=-14
          - '--with-pkgversion="Eternal gcc-14-1"'
          - --with-glibc-version=2.44
          - --with-sysroot=/
          - --enable-languages=c,c++
          - --disable-bootstrap
          - --disable-nls
          - --disable-werror
          - --disable-multilib
          - --disable-libsanitizer
          - --disable-libquadmath
          - --enable-shared
          - --enable-threads=posix
          - --enable-tls
          - --enable-default-pie
          - --enable-default-ssp
          - --enable-initfini-array
          - --enable-gnu-indirect-function
          - --enable-gnu-unique-object
          - --with-system-zlib
          - --with-linker-hash-style=gnu
    - uses: autotools/build
      with:
        dir: build
    - uses: autotools/install
      with:
        dir: build
    - runs: |
        # Like Wolfi and Fedora, drop libtool archives. They embed build paths
        # and are not needed at runtime or link time.
        find "$STAGE" -name '*.la' -delete
    - uses: license/copy
      with:
        files: [COPYING3, COPYING3.LIB, COPYING.RUNTIME]
        outputs: [gcc-14, gcc-14-default, libstdc++-14, libstdc++-14-dev, libatomic-14, gcc-14-doc]
    - runs: |
        # The default package owns the stable command names. The versioned
        # names stay with gcc-14.
        install -d "$STAGE/usr/bin"
        for name in cpp gcc g++ gcc-ar gcc-nm gcc-ranlib gcov gcov-dump gcov-tool lto-dump; do
          ln -sf "$name-14" "$STAGE/usr/bin/$name"
        done
        # GCC does not install cc-14 or c++-14; point the generic names at the
        # compilers that actually exist.
        ln -sf gcc-14 "$STAGE/usr/bin/cc"
        ln -sf g++-14 "$STAGE/usr/bin/c++"
        ln -sf gcc-14 "$STAGE/usr/bin/c89"
        ln -sf gcc-14 "$STAGE/usr/bin/c99"
    - uses: strip

outputs:
  - name: gcc-14
    summary: GCC 14 compiler and runtime
    # Main package: driver, cc1/cc1plus, runtime libraries, compiler
    # static archives and the license. libgcc.a and friends stay here because
    # GCC needs them at link time, even in the main package.
    files:
      license:
        - /usr/share/licenses/gcc-14/COPYING3
        - /usr/share/licenses/gcc-14/COPYING3.LIB
        - /usr/share/licenses/gcc-14/COPYING.RUNTIME
    dependencies:
      run:
        - binutils
        - filesystem
        - glibc-2.44-dev = 2.44-1
        - libstdc++-14 = ${package.version}-${package.release}
      provides:
        - gcc-14 = ${package.version}-${package.release}

  - name: gcc-14-default
    summary: Stable command names for GCC 14
    files:
      include:
        - /usr/bin/c++
        - /usr/bin/c89
        - /usr/bin/c99
        - /usr/bin/cc
        - /usr/bin/cpp
        - /usr/bin/g++
        - /usr/bin/gcc
        - /usr/bin/gcc-ar
        - /usr/bin/gcc-nm
        - /usr/bin/gcc-ranlib
        - /usr/bin/gcov
        - /usr/bin/gcov-dump
        - /usr/bin/gcov-tool
        - /usr/bin/lto-dump
        - /usr/share/licenses/gcc-14-default/**
      license:
        - /usr/share/licenses/gcc-14-default/COPYING3
        - /usr/share/licenses/gcc-14-default/COPYING3.LIB
        - /usr/share/licenses/gcc-14-default/COPYING.RUNTIME
    dependencies:
      run:
        - gcc-14 = ${package.version}-${package.release}
      conflicts:
        - gcc-13-default
        - gcc-15-default
        - gcc-16-default
      provides:
        - gcc = ${package.version}-${package.release}
        - cc = ${package.version}-${package.release}

  - name: libstdc++-14
    summary: GNU Standard C++ Library
    files:
      include:
        - /usr/lib*/libstdc++.so.*
        - /usr/share/licenses/libstdc++-14/**
      license:
        - /usr/share/licenses/libstdc++-14/COPYING3
        - /usr/share/licenses/libstdc++-14/COPYING3.LIB
        - /usr/share/licenses/libstdc++-14/COPYING.RUNTIME
    dependencies:
      run:
        - filesystem
        - glibc-2.44 = 2.44-1
      provides:
        - libstdc++ = ${package.version}-${package.release}
        - libstdc++-14 = ${package.version}-${package.release}

  - name: libstdc++-14-dev
    summary: GNU Standard C++ Library development files
    files:
      include:
        - /usr/include/c++/**
        - /usr/lib*/libstdc++.so
        - /usr/lib*/libstdc++.a
        - /usr/lib/gcc/**/libstdc++*
        - /usr/lib/gcc/**/include/c++/**
        - /usr/share/gcc-14/**
        - /usr/share/licenses/libstdc++-14-dev/**
      license:
        - /usr/share/licenses/libstdc++-14-dev/COPYING3
        - /usr/share/licenses/libstdc++-14-dev/COPYING3.LIB
        - /usr/share/licenses/libstdc++-14-dev/COPYING.RUNTIME
    dependencies:
      run:
        - libstdc++-14 = ${package.version}-${package.release}
        - glibc-2.44-dev = 2.44-1
        - filesystem
      provides:
        - libstdc++-dev = ${package.version}-${package.release}

  - name: libatomic-14
    summary: GCC atomic operations runtime
    files:
      include:
        - /usr/lib*/libatomic.so.*
        - /usr/lib/gcc/**/libatomic*
        - /usr/share/licenses/libatomic-14/**
      license:
        - /usr/share/licenses/libatomic-14/COPYING3
        - /usr/share/licenses/libatomic-14/COPYING3.LIB
        - /usr/share/licenses/libatomic-14/COPYING.RUNTIME
    dependencies:
      run:
        - filesystem
        - glibc-2.44 = 2.44-1
      provides:
        - libatomic = ${package.version}-${package.release}

  - name: gcc-14-doc
    summary: GCC 14 documentation
    files:
      include:
        - "@info"
        - "@man"
        - /usr/share/licenses/gcc-14-doc/**
      license:
        - /usr/share/licenses/gcc-14-doc/COPYING3
        - /usr/share/licenses/gcc-14-doc/COPYING3.LIB
        - /usr/share/licenses/gcc-14-doc/COPYING.RUNTIME
    dependencies:
      run:
        - filesystem

tests:
  - name: build
    stage: build
    argv:
      - sh
      - -c
      - |
        "$STAGE/usr/bin/gcc-14" --version | grep -q '14.4.0'
        "$STAGE/usr/bin/g++-14" --version | grep -q '14.4.0'
        "$STAGE/usr/bin/cc" --version | grep -q '14.4.0'
        "$STAGE/usr/bin/c++" --version | grep -q '14.4.0'
        printf '#include <stdio.h>\nint main(void) { puts("gcc-ok"); return 0; }\n' > /tmp/gcc-14-test.c
        "$STAGE/usr/bin/gcc-14" /tmp/gcc-14-test.c -o /tmp/gcc-14-test
        /tmp/gcc-14-test | grep -q gcc-ok
        "$STAGE/usr/bin/cc" /tmp/gcc-14-test.c -o /tmp/gcc-14-test-cc
        /tmp/gcc-14-test-cc | grep -q gcc-ok
        printf '#include <iostream>\nint main() { std::cout << "g++-ok\\n"; }\n' > /tmp/gcc-14-test.cc
        "$STAGE/usr/bin/g++-14" /tmp/gcc-14-test.cc -o /tmp/gcc-14-test-cxx
        /tmp/gcc-14-test-cxx | grep -q g++-ok
        "$STAGE/usr/bin/c++" /tmp/gcc-14-test.cc -o /tmp/gcc-14-test-cxx-default
        /tmp/gcc-14-test-cxx-default | grep -q g++-ok
