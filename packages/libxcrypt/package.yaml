# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
schema: 1
package:
  name: libxcrypt
  version: 4.5.2
  release: 1
  summary: Password hashing library
  description: Password hashing library.
  license: LGPL-2.1-or-later AND BSD-3-Clause AND BSD-2-Clause AND BSD-2-Clause-FreeBSD AND 0BSD AND CC0-1.0
    AND LicenseRef-Public-Domain
  upstream: https://github.com/besser82/libxcrypt
sources:
- name: libxcrypt-4.5.2.tar.xz
  kind: archive
  digest: sha512:87b363e2bdc03ea993a9d154eb59a75ef77edd0490a9b58d443de4e1b4eec5196408a1eb9b739718fd92f565fe5157469c1ea3d336a4a54ac0947750b16c44c1
  locators:
  - kind: https
    url: https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz
  extract:
    format: tar.xz
    strip-components: 1
build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages:
  - gcc
  - make
  - bash
  - coreutils
  - perl
  pipeline:
  - uses: autotools/configure
    with:
      args:
      - --disable-static
      - --enable-hashes=all
      - --disable-obsolete-api
      - --disable-failure-tokens
      - --disable-xcrypt-compat-files
  - uses: make/build
  - uses: make/install
  - runs: |
      find "$STAGE" -name "*.la" -delete
      rm -f "$STAGE/usr/share/info/dir"
  - uses: license/copy
    with:
      files:
      - COPYING.LIB
      - LICENSING
      outputs:
      - libxcrypt
      - libxcrypt-devel
      - libxcrypt-doc
  - uses: strip
outputs:
- name: libxcrypt
  files:
    license:
    - /usr/share/licenses/libxcrypt/**
  tests:
  - name: load
    stage: installed
    packages:
      - python3
    argv:
    - bash
    - -eu
    - -c
    - |
      python3 -c 'import ctypes; ctypes.CDLL("libcrypt.so.2")'
- name: libxcrypt-devel
  files:
    license:
    - /usr/share/licenses/libxcrypt-devel/**
    include:
    - '@dev'
    - /usr/share/licenses/libxcrypt-devel/**
  dependencies:
    run:
    - libxcrypt = ${package.version}-${package.release}
  tests:
  - name: compile-and-run
    stage: installed
    packages:
      - gcc
      - glibc-devel
    argv:
    - bash
    - -eu
    - -c
    - |
      cat > /tmp/test.c <<'EOF'
      #define _GNU_SOURCE
      #include <crypt.h>
      #include <string.h>
      int main(void) { char *p = crypt("password", "$6$test$"); return !p || strncmp(p, "$6$test$", 8); }
      EOF
      gcc /tmp/test.c -lcrypt -o /tmp/test
      /tmp/test
- name: libxcrypt-doc
  files:
    license:
    - /usr/share/licenses/libxcrypt-doc/**
    include:
    - '@doc'
    - '@man'
    - '@info'
    - /usr/share/licenses/libxcrypt-doc/**
tests:
- name: hardening
  stage: build
  pipeline:
  - uses: test/hardening-check
patches:
- file: patches/libxcrypt-4.5.2-Werror_discarded-qualifiers.patch
  strip: 1
  reason: Upstream 174c24d6e87a, carried by Fedora and Wolfi; preserve const qualification with current
    GCC headers
