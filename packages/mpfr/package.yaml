# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Multiple-precision floating-point library. A build dependency for the GNU toolchain and the
# rest of the minimal Eternal userland.
schema: 2

package:
  name: mpfr
  version: "4.2.2"
  release: 1
  summary: Multiple-precision floating-point library
  description: |
    MPFR is a portable C library for multiple-precision floating-point computations with correct rounding.
  license: LGPL-3.0-or-later
  upstream: https://www.mpfr.org/
  cpe:
    vendor: mpfr
    product: mpfr

sources:
  - name: mpfr-4.2.2.tar.xz
    kind: archive
    digest: "sha512:eb9e7f51b5385fb349cc4fba3a45ffdf0dd53be6dfc74932dc01258158a10514667960c530c47dd9dfc5aa18be2bd94859d80499844c5713710581e6ac6259a9"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/mpfr/mpfr-4.2.2.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, m4]
  sysroot: [gmp-devel]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-shared
          - --disable-static
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING.LESSER]
        outputs: [mpfr, mpfr-devel, mpfr-doc]
    - uses: strip

  tests:
    - name: upstream
      packages:
        - diffutils
      artifacts:
        - test-suite.log
        - tests/test-suite.log
      pipeline:
        - uses: make/check

outputs:
  - name: mpfr
    summary: Multiple-precision floating-point library
    files:
      license:
        - /usr/share/licenses/mpfr/COPYING.LESSER
    dependencies:
      run:
        - gmp
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libmpfr.so.*"]
  - name: mpfr-devel
    summary: MPFR development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/mpfr-devel/COPYING.LESSER
      license:
        - /usr/share/licenses/mpfr-devel/COPYING.LESSER
    dependencies:
      run:
        - mpfr = ${package.version}-${package.release}
        - gmp-devel

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists mpfr
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags mpfr) "$TEST_FILES/behavior.c" $(pkg-config --libs mpfr) -o behavior
          ./behavior
  - name: mpfr-doc
    summary: MPFR documentation
    files:
      include:
        - "@doc"
        - "@man"
        - "@info"
        - /usr/share/licenses/mpfr-doc/COPYING.LESSER
      license:
        - /usr/share/licenses/mpfr-doc/COPYING.LESSER
