# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# Multiple-precision C library. A build dependency for the GNU toolchain and the
# rest of the minimal Eternal userland.
schema: 2

package:
  name: mpc
  version: "1.4.1"
  release: 1
  summary: Multiple-precision C library
  description: |
    GNU MPC is a C library for the arithmetic of complex numbers with arbitrarily high precision and correct rounding of the result.
  license: LGPL-3.0-or-later
  upstream: https://www.multiprecision.org/mpc/
  cpe:
    vendor: mpc
    product: mpc

sources:
  - name: mpc-1.4.1.tar.xz
    kind: archive
    digest: "sha512:cdfbe64e80e30df64dbd536e8104a6bb10471582415d5b45a1dd30eb2a312781b38389a9531243413c14e0f88866a35159b20e77900718f28c1030253a1305b9"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz
      - kind: https
        url: https://mirrors.kernel.org/gnu/mpc/mpc-1.4.1.tar.xz
    extract:
      format: tar.xz
      strip-components: 1

build:
  root:
    profile: ../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils, m4]
  sysroot: [gmp-devel, mpfr-devel]
  pipeline:
    - uses: autotools/configure
      with:
        args:
          - --enable-shared
          - --disable-static
    - uses: make/build
    - uses: make/install
    - runs: |
        rm -f "$STAGE/usr/share/info/dir"
    - uses: license/copy
      with:
        files: [COPYING.LESSER]
        outputs: [mpc, mpc-devel, mpc-doc]
    - uses: strip

  tests:
    - name: upstream
      packages:
        - diffutils
      artifacts:
        - test-suite.log
        - tests/test-suite.log
      pipeline:
        - uses: make/check

outputs:
  - name: mpc
    summary: Multiple-precision C library
    files:
      license:
        - /usr/share/licenses/mpc/COPYING.LESSER
    dependencies:
      run:
        - mpfr
        - gmp
      provides:
        - libmpc = ${package.version}-${package.release}
    tests:
      - name: runtime-linkage
        pipeline:
          - uses: test/runtime-linkage
            with:
              libraries: ["libmpc.so.*"]
  - name: mpc-devel
    summary: MPC development files
    files:
      include:
        - "@dev"
        - /usr/share/licenses/mpc-devel/COPYING.LESSER
      license:
        - /usr/share/licenses/mpc-devel/COPYING.LESSER
    dependencies:
      run:
        - mpc = ${package.version}-${package.release}
        - gmp-devel
        - mpfr-devel
      provides:
        - libmpc-devel = ${package.version}-${package.release}

    tests:
      - name: api-behavior
        packages:
          - gcc
          - glibc-devel
          - pkgconf
        files: tests
        script: |
          pkg-config --exists mpc mpfr
          gcc -std=c17 -D_GNU_SOURCE -Wall -Wextra -Werror=implicit-function-declaration $(pkg-config --cflags mpc mpfr) "$TEST_FILES/behavior.c" $(pkg-config --libs mpc mpfr) -o behavior
          ./behavior
  - name: mpc-doc
    summary: MPC documentation
    files:
      include:
        - "@doc"
        - "@man"
        - "@info"
        - /usr/share/licenses/mpc-doc/COPYING.LESSER
      license:
        - /usr/share/licenses/mpc-doc/COPYING.LESSER
