# yaml-language-server: $schema=https://example.org/rpmx/package.schema.json
#
# GNU Make is part of the bootstrap toolchain. This bootstrap variant exists
# because the ladder hides the seed provider while a stage builds this package,
# so the EVR does not need to outrank Fedora's copy. Epoch 1 is make's upstream
# epoch. The production recipe is in packages/make/package.yaml.
schema: 1

package:
  name: make
  epoch: 1
  version: "4.4.1"
  release: 2
  summary: GNU Make build automation tool
  description: |
    GNU Make is a tool which controls the generation of executables and other
    non-source files of a program from the program's source files.
  license: GPL-3.0-or-later
  # Fallback for standalone `rpmx lint`/`rpmx build`; the ladder supplies
  # the effective timestamp and a stage may override it.
  upstream: https://www.gnu.org/software/make/
  cpe:
    vendor: gnu
    product: make

sources:
  - name: make-4.4.1.tar.gz
    kind: archive
    digest: "sha512:145260cbd6a8226cef3dfef0c8baba31847beaebc7e6b65d39d02715fd4f4cab9b139b6c3772e550088d4f9ae80c6d3ed20b9a7664c693644dfb96b4cb60e67c"
    locators:
      - kind: https
        url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
      - kind: https
        url: https://mirrors.kernel.org/gnu/make/make-4.4.1.tar.gz
    extract:
      format: tar.gz
      strip-components: 1

build:
  root:
    profile: ../../../profiles/bootstrap.profile.yaml
  packages: [gcc, make, bash, coreutils]
  pipeline:
    - uses: autotools/configure
    - uses: make/build
    - uses: make/install
    - uses: license/copy
      with:
        files: [COPYING]
        outputs: [make, make-devel, make-doc]
    - uses: strip

outputs:
  - name: make
    summary: GNU Make build automation tool
    dependencies:
      run:
        - /bin/sh
    # Main package: the make binary, translations and the license.
    files:
      license:
        - /usr/share/licenses/make/COPYING
    tests:
      - name: build-graph
        stage: installed
        packages:
          - coreutils
        files: tests
        script: |
          bash "$TEST_FILES/build-graph.sh"

  - name: make-devel
    summary: GNU Make development files
    files:
      include:
        - "@headers"
        - /usr/share/licenses/make-devel/COPYING
      license:
        - /usr/share/licenses/make-devel/COPYING
    tests:
      - name: make-api
        stage: installed
        packages:
          - gcc
          - glibc-devel
          - coreutils
          - make
        files: tests
        script: |
          bash "$TEST_FILES/make-api.sh"

  - name: make-doc
    summary: GNU Make documentation
    files:
      include:
        - "@info"
        - "@man"
        - /usr/share/licenses/make-doc/COPYING
      license:
        - /usr/share/licenses/make-doc/COPYING
