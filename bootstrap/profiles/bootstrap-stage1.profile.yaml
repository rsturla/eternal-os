# The build root for the first self-hosted bootstrap stage.
#
# It still starts from Fedora 44 for glibc and the seed compiler, but consumes
# Eternal bash, binutils, coreutils and make from the published rolling
# repository. The bootstrap manifest adds the stage 0 repository on top so
# packages built there win over their Fedora counterparts.
document: rpmx-profile
version: 1
name: bootstrap-stage1
releasever: "44"
dist-tag: .eternal
archs: [x86_64, aarch64]
builder:
  image: registry.fedoraproject.org/fedora:44
repositories:
  - id: eternal
    baseurl: https://packages.eternal.sturla.tech/rolling/$basearch
    # Only the userland packages that have completed the self-hosting switch
    # are consumed from here. Keep the seed compiler and C library out until
    # their exact-release dependencies are stable.
    exclude: [filesystem, basesystem, eternal-release, eternal-base, eternal-baselayout, glibc-*, gcc-*, ld-linux-*, libc-bin-*, libstdc++-*, libatomic-*, nss-db-*, expat*, zstd*]
  - id: fedora
    metalink: https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch
    # These package names are already produced by Eternal. Hiding the Fedora
    # copies is what makes the build root consume the published Eternal
    # repository instead of only using it for metadata.
    exclude: [bash, bash-binsh, binutils, coreutils, coreutils-single, make, pkgconf, pkgconf-m4, pkgconf-pkg-config, libpkgconf, zlib, zlib-devel, zlib-static, zlib-ng-compat, zlib-ng-compat-devel, zlib-ng-compat-static]
  - id: updates
    metalink: https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
    exclude: [bash, bash-binsh, binutils, coreutils, coreutils-single, make, pkgconf, pkgconf-m4, pkgconf-pkg-config, libpkgconf, zlib, zlib-devel, zlib-static, zlib-ng-compat, zlib-ng-compat-devel, zlib-ng-compat-static]
  - id: eternal-toolchain
    baseurl: file://../.work/toolchain-repo
packages:
  install:
    - openssf-compiler-options
    - bash
    - bash-binsh
    - binutils
    - coreutils
    - findutils
    - gcc
    - make
    - patch
    - tar
    - gzip
    - sed
    - grep
    - gawk
    - diffutils
    - pkgconf
sbom: true
options:
  weak_deps: false
  docs: false
paths:
  prefix: /usr
  libdir: /usr/lib64
