repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Patch files are applied verbatim: whitespace, blank lines and line
      # endings are part of the diff, not cosmetic drift.
      - id: end-of-file-fixer
        exclude: (^|/)patches/
      - id: trailing-whitespace
        exclude: (^|/)patches/
      - id: mixed-line-ending
        exclude: (^|/)patches/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: local
    hooks:
      # The message half of the commit rules, so a wrong subject is caught
      # before it is written. The package half needs the commit's diff and
      # runs in CI (scripts/check-commits.sh).
      - id: commit-message
        name: commit message
        entry: scripts/check-commits.sh --message-file
        language: script
        stages: [commit-msg]
        always_run: true
