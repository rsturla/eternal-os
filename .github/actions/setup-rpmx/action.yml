name: Setup rpmx
description: Install the pinned rpmx revision and the host tools it needs.

inputs:
  artifact:
    description: >-
      Name of an uploaded rpmx artifact to unpack instead of building the
      pinned revision. The `rpmx` job in _build-packages.yml produces it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install host tools
      shell: bash
      run: |
        # Keep the runner's Ubuntu URIs, architecture, suites and signing keys.
        # Do not refresh unrelated vendor repositories for these host tools.
        apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=- -o Acquire::Retries=3
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          bubblewrap podman fuse-overlayfs uidmap python3-yaml createrepo-c gnupg rpm rpm2cpio
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        # Ubuntu's separate Bubblewrap profile denies child capabilities,
        # including DAC access needed by private package transactions.
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
        fi
        # Host executable profiles also attach by path inside guest roots.
        # Permit private locale data without removing locale's confinement.
        if [ -f /etc/apparmor.d/locale ] &&
           sudo test -r /sys/kernel/security/apparmor/profiles &&
           sudo grep -Fxq 'locale (enforce)' /sys/kernel/security/apparmor/profiles; then
          echo 'locale (enforce): allow read-only rpmx workspace locale data'
          locale_rules=/etc/apparmor.d/local/locale
          sudo mkdir -p /etc/apparmor.d/local
          sudo touch "$locale_rules"
          if ! sudo grep -Fxq '/tmp/build/** r,' "$locale_rules"; then
            printf '%s\n' '/tmp/build/** r,' | sudo tee -a "$locale_rules"
          fi
          sudo apparmor_parser -r /etc/apparmor.d/locale
        fi

    - name: Install Rust
      if: inputs.artifact == ''
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable

    - name: Cache cargo and rpmx
      if: inputs.artifact == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.local/share/rpmx
        key: rpmx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.rpmx-revision') }}

    - name: Install rpmx
      if: inputs.artifact == ''
      shell: bash
      run: |
        root="$HOME/.local/share/rpmx"
        if [ ! -x "$root/bin/rpmx" ]; then
          ./scripts/install-rpmx.sh --root "$root"
        fi

    - name: Download rpmx
      if: inputs.artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/rpmx

    - name: Unpack rpmx
      if: inputs.artifact != ''
      shell: bash
      run: |
        install -d "$HOME/.local/share/rpmx"
        tar -xzf "$RUNNER_TEMP/rpmx/rpmx.tar.gz" \
          -C "$HOME/.local/share/rpmx"

    - name: Add rpmx to PATH
      shell: bash
      run: echo "$HOME/.local/share/rpmx/bin" >> "$GITHUB_PATH"
