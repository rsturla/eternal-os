name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx

      - name: pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/pip" install pre-commit
          "$RUNNER_TEMP/pre-commit/bin/pre-commit" run \
            --all-files --show-diff-on-failure

      - name: Lint recipes
        run: ./scripts/lint-all.sh
