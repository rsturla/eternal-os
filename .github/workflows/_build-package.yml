name: Build one source package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      wave:
        required: true
        type: number
      arches:
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Prepare ${{ inputs.package }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-x86_64
      - name: Download transaction view
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transaction-w${{ inputs.wave }}
          path: .work/transaction
      - name: Download completed candidates
        if: inputs.wave > 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-w*
          path: .work/candidates
      - name: Restore acquired inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rpmx/cas
          key: source-${{ inputs.package }}-${{ github.sha }}-${{ github.run_id }}-${{ inputs.wave }}
          restore-keys: |
            source-${{ inputs.package }}-
      - name: Prepare shared source RPMs
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(--package "$PACKAGE" --output .work/prepared
            --transaction .work/transaction/state.json --candidates .work/candidates)
          python3 ./scripts/package-artifacts.py prepare "${args[@]}"
      - name: Upload shared source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-w${{ inputs.wave }}-${{ inputs.package }}
          path: .work/prepared/bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload x86_64 dependencies
        if: contains(fromJSON(inputs.arches), 'x86_64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-w${{ inputs.wave }}-${{ inputs.package }}-x86_64
          path: .work/prepared/inputs/x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
      - name: Upload aarch64 dependencies
        if: contains(fromJSON(inputs.arches), 'aarch64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-w${{ inputs.wave }}-${{ inputs.package }}-aarch64
          path: .work/prepared/inputs/aarch64.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1
      - name: Upload source preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-evidence-w${{ inputs.wave }}-${{ inputs.package }}
          path: |
            .work/prepared/prepared/evidence/
            .work/prepared/prepared/*.lock.json
          overwrite: true
          retention-days: 7

  binaries:
    name: Rebuild ${{ inputs.package }} (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    uses: ./.github/workflows/_build-rpm.yml
    with:
      package: ${{ inputs.package }}
      wave: ${{ inputs.wave }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
