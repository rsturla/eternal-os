name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  packages:
    name: Packages
    needs: lint
    uses: ./.github/workflows/_build-packages.yml
    with:
      selection: affected
      base: ${{ github.event.pull_request.base.sha }}
