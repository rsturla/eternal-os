name: Build packages

# Fan-out workflow. The configure job reads the target architectures without
# rpmx; the rpmx matrix builds the pinned revision once per architecture and
# uploads it; prepare uses the x86_64 build to compute the package plan and
# content hashes. Selected foundation packages run first in dependency order.
# The consumer matrix downloads their verified RPMs and the matching rpmx build
# before building the remaining packages in parallel. The caller's fan-in
# assembles a repository from the uploaded package artifacts.
#
# Sharing one rpmx build per architecture keeps the plan and build stages from
# compiling the same revision independently, including every aarch64 matrix
# cell.
#
# GitHub's matrix job outputs merge cells into a map, but only for statically
# declared output names. A dynamic package matrix cannot name one output per
# package, so the plan and hashes are produced once by `prepare` and exposed as
# workflow outputs. The RPM binaries travel as artifacts; job outputs carry
# strings only.
on:
  workflow_call:
    inputs:
      selection:
        description: 'Either "affected" or "all".'
        required: false
        type: string
        default: affected
      base:
        description: Base ref for --affected (empty uses origin/HEAD).
        required: false
        type: string
        default: ""
      sign:
        description: Sign packages when RPMX_SIGNING_KEY is available.
        required: false
        type: boolean
        default: false
    outputs:
      packages:
        description: JSON array of package names in this build.
        value: ${{ jobs.prepare.outputs.packages }}
      arches:
        description: JSON array of target architectures.
        value: ${{ jobs.configure.outputs.arches }}
      hashes:
        description: JSON object mapping package name to content hash.
        value: ${{ jobs.prepare.outputs.hashes }}
      skip:
        description: "true when no package is selected."
        value: ${{ jobs.prepare.outputs.skip }}
      signed:
        description: "1 when a signing key is available, otherwise 0."
        value: ${{ jobs.configure.outputs.signed }}
      build_release:
        description: UTC Unix timestamp used as the rolling release counter.
        value: ${{ jobs.configure.outputs.build_release }}
    secrets:
      RPMX_SIGNING_KEY:
        required: false
  # Run the matrix directly from the Actions tab, without a pull request.
  # This only builds and uploads artifacts; publishing stays in release.yml.
  workflow_dispatch:
    inputs:
      selection:
        description: Build all packages or only those affected by a diff.
        required: false
        type: choice
        options: [all, affected]
        default: all
      base:
        description: Base ref for --affected (empty uses origin/HEAD).
        required: false
        type: string
        default: ""
      sign:
        description: Sign packages when RPMX_SIGNING_KEY is available.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-26.04
    outputs:
      arches: ${{ steps.configure.outputs.arches }}
      signed: ${{ steps.configure.outputs.signed }}
      build_release: ${{ steps.configure.outputs.build_release }}
    env:
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build configuration
        id: configure
        run: |
          arches=$(./scripts/list-arches.sh)
          build_release=$(date -u +%s)
          echo "arches=$arches" >>"$GITHUB_OUTPUT"
          echo "build_release=$build_release" >>"$GITHUB_OUTPUT"
          echo "arches: $arches"
          echo "build release: $build_release"

          if [ -n "${RPMX_SIGNING_KEY:-}" ]; then
            echo "signed=1" >>"$GITHUB_OUTPUT"
          else
            echo "signed=0" >>"$GITHUB_OUTPUT"
          fi

  rpmx:
    name: rpmx (${{ matrix.arch }})
    needs: configure
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx

      - name: Package rpmx
        run: |
          tar -czf "$RUNNER_TEMP/rpmx.tar.gz" \
            -C "$HOME/.local/share/rpmx" .

      - name: Upload rpmx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpmx-${{ matrix.arch }}
          path: ${{ runner.temp }}/rpmx.tar.gz
          if-no-files-found: error

  prepare:
    name: Plan
    needs: [configure, rpmx]
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      foundations: ${{ steps.plan.outputs.foundations }}
      compilers: ${{ steps.plan.outputs.compilers }}
      consumers: ${{ steps.plan.outputs.consumers }}
      hashes: ${{ steps.plan.outputs.hashes }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-x86_64

      - name: Plan
        id: plan
        env:
          SELECTION: ${{ inputs.selection }}
          BASE_REF: ${{ inputs.base }}
        run: |
          if [ "$SELECTION" = "affected" ]; then
            args=(--json)
            if [ -n "$BASE_REF" ]; then
              args+=(--base "$BASE_REF")
            fi
            packages=$(./scripts/affected.sh "${args[@]}")
          else
            packages=$(./scripts/list-packages.sh \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "packages=$packages" >>"$GITHUB_OUTPUT"
          compilers=$(jq -c 'map(select(test("^gcc-(13|14|15|16)$")))' <<<"$packages")
          foundations=$(jq -c --argjson compilers "$compilers" '
            map(select(. == "kernel-headers" or . == "glibc-2.44" or . == "rpm" or . == "openssl3"
              or test("^gcc-(13|14|15|16)$")
              or (. == "openssf-compiler-options" and ($compilers | length) > 0)))' <<<"$packages")
          consumers=$(jq -c --argjson foundations "$foundations" '
            map(. as $name | select($foundations | index($name) | not))' <<<"$packages")
          echo "compilers=$compilers" >>"$GITHUB_OUTPUT"
          echo "foundations=$foundations" >>"$GITHUB_OUTPUT"
          echo "consumers=$consumers" >>"$GITHUB_OUTPUT"
          echo "plan: $packages"

          if [ "$packages" = "[]" ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "hashes={}" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
            mapfile -t names < <(jq -r '.[]' <<<"$packages")
            hashes=$(./scripts/package-hash.sh "${names[@]}" \
              | jq -R -s -c '
                  split("\n")
                  | map(select(length > 0)
                        | split(" ")
                        | {key: .[0], value: .[1]})
                  | from_entries')
            echo "hashes=$hashes" >>"$GITHUB_OUTPUT"
            echo "hashes: $hashes"
          fi

  compiler-seed:
    name: Compiler seed (${{ matrix.arch }})
    needs: [configure, rpmx, prepare]
    if: needs.prepare.outputs.compilers != '[]' && needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ matrix.arch }}
      - name: Build quarantined compiler policy seed and retain source evidence
        env:
          SIGN: ${{ inputs.sign }}
          BUILD_RELEASE: ${{ inputs.sign && needs.configure.outputs.build_release || '' }}
        run: |
          args=(produce-seed --arch "${{ matrix.arch }}" --output "$RUNNER_TEMP/compiler-seed")
          if [ "$SIGN" = true ] && [ -n "${RPMX_SIGNING_KEY:-}" ]; then
            install -d -m 0700 "$RUNNER_TEMP/signing"
            printf '%s' "$RPMX_SIGNING_KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
            chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -n "$BUILD_RELEASE" ]; then args+=(--build-release "$BUILD_RELEASE"); fi
          python3 scripts/compiler-cohort.py "${args[@]}"
      - name: Upload quarantined compiler policy seed and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-seed-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiler-seed/
          if-no-files-found: error

  compiler-producers:
    name: Compiler producer ${{ matrix.package }} (${{ matrix.arch }})
    needs: [configure, rpmx, prepare, compiler-seed]
    if: needs.prepare.outputs.compilers != '[]' && needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        package: ${{ fromJSON(needs.prepare.outputs.compilers) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ matrix.arch }}
      - name: Download the single compiler policy seed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-seed-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiler-seed
      - name: Restore compiler source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rpmx/cas
          key: rpmx-compiler-sources-${{ matrix.arch }}-${{ matrix.package }}-${{ hashFiles('packages/gcc-*/**', '.rpmx-revision') }}
          restore-keys: |
            rpmx-compiler-sources-${{ matrix.arch }}-${{ matrix.package }}-
      - name: Build quarantined compiler and retain source evidence
        env:
          SIGN: ${{ inputs.sign }}
          BUILD_RELEASE: ${{ inputs.sign && needs.configure.outputs.build_release || '' }}
        run: |
          args=(produce --package "${{ matrix.package }}" --arch "${{ matrix.arch }}"
            --seed "$RUNNER_TEMP/compiler-seed" --output "$RUNNER_TEMP/compiler-producer")
          if [ "$SIGN" = true ] && [ -n "${RPMX_SIGNING_KEY:-}" ]; then
            install -d -m 0700 "$RUNNER_TEMP/signing"
            printf '%s' "$RPMX_SIGNING_KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
            chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -n "$BUILD_RELEASE" ]; then args+=(--build-release "$BUILD_RELEASE"); fi
          python3 scripts/compiler-cohort.py "${args[@]}"
      - name: Upload quarantined compiler and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-producer-${{ matrix.package }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiler-producer/
          if-no-files-found: error

  foundations:
    name: Test dependencies (${{ matrix.arch }})
    needs: [configure, rpmx, prepare, compiler-producers]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.foundations != '[]' && needs.prepare.outputs.skip != 'true' && (needs.prepare.outputs.compilers == '[]' || needs.compiler-producers.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ matrix.arch }}
      - name: Download compiler policy seed
        if: needs.prepare.outputs.compilers != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-seed-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiler-inputs/openssf-compiler-options
      - name: Download selected compiler producers
        if: needs.prepare.outputs.compilers != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compiler-producer-*-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiler-artifacts
      - name: Arrange the exact selected compiler cohort
        if: needs.prepare.outputs.compilers != '[]'
        env:
          COMPILERS: ${{ needs.prepare.outputs.compilers }}
        run: |
          mapfile -t names < <(jq -r '.[]' <<<"$COMPILERS")
          count=$(find "$RUNNER_TEMP/compiler-artifacts" -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$count" -eq "${#names[@]}"
          for name in "${names[@]}"; do
            mv "$RUNNER_TEMP/compiler-artifacts/compiler-producer-$name-${{ matrix.arch }}" \
              "$RUNNER_TEMP/compiler-inputs/$name"
          done
      - name: Restore source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rpmx/cas
          key: rpmx-foundation-sources-${{ matrix.arch }}-${{ hashFiles('packages/kernel-headers/**', 'packages/glibc-2.44/**', 'packages/rpm/**', 'packages/openssl3/**', '.rpmx-revision') }}
          restore-keys: |
            rpmx-foundation-sources-${{ matrix.arch }}-
      - name: Write signing key
        if: ${{ inputs.sign && env.RPMX_SIGNING_KEY != '' }}
        env:
          KEY: ${{ secrets.RPMX_SIGNING_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
          chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"
      - name: Build selected test dependencies
        env:
          FOUNDATIONS: ${{ needs.prepare.outputs.foundations }}
          BUILD_RELEASE: ${{ inputs.sign && needs.configure.outputs.build_release || '' }}
        run: |
          args=(--arch "${{ matrix.arch }}" --output out --rpms "$RUNNER_TEMP/foundation-rpms")
          mapfile -t names < <(jq -r '.[]' <<<"$FOUNDATIONS")
          for name in "${names[@]}"; do args+=(--package "$name"); done
          if [ -d "$RUNNER_TEMP/compiler-inputs" ]; then
            args+=(--compiler-inputs "$RUNNER_TEMP/compiler-inputs")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc" ]; then
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -n "${BUILD_RELEASE:-}" ]; then args+=(--build-release "$BUILD_RELEASE"); fi
          ./scripts/build-test-dependencies.sh "${args[@]}"
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-foundations-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
      - name: Upload verified dependency RPMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-rpms-${{ matrix.arch }}
          path: ${{ runner.temp }}/foundation-rpms/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.package }} (${{ matrix.arch }})
    needs: [configure, rpmx, prepare, foundations]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.consumers != '[]' && (needs.foundations.result == 'success' || (needs.prepare.outputs.foundations == '[]' && needs.foundations.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        package: ${{ fromJSON(needs.prepare.outputs.consumers) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ matrix.arch }}

      - name: Package hash
        id: hash
        env:
          HASHES: ${{ needs.prepare.outputs.hashes }}
        run: |
          hash=$(jq -r --arg package '${{ matrix.package }}' '.[$package]' <<<"$HASHES")
          echo "hash=$hash" >>"$GITHUB_OUTPUT"
          echo "${{ matrix.package }}: $hash"

      - name: Download verified test dependencies
        if: needs.prepare.outputs.foundations != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-rpms-${{ matrix.arch }}
          path: ${{ runner.temp }}/foundation-rpms

      - name: Restore source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rpmx/cas
          key: rpmx-sources-${{ runner.os }}-${{ matrix.package }}-${{ steps.hash.outputs.hash }}
          restore-keys: |
            rpmx-sources-${{ runner.os }}-${{ matrix.package }}-

      - name: Restore package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/
          key: rpm-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.package }}-${{ steps.hash.outputs.hash }}-signed${{ needs.configure.outputs.signed }}-${{ inputs.sign && 'release' || 'pr' }}-${{ hashFiles('.cache-generation') }}

      - name: Restore build root cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache an archive, not the tree: assembled roots contain mode-000
          # files such as /etc/shadow, which actions/cache cannot tar as the
          # unprivileged runner. podman unshare packs and unpacks them with the
          # right ownership.
          path: ${{ runner.temp }}/rpmx-cache.tar.gz
          key: rpmx-root-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('profiles/**', 'packages/openssf-compiler-options/**') }}
          restore-keys: |
            rpmx-root-${{ runner.os }}-${{ matrix.arch }}-

      - name: Unpack build root cache
        run: |
          archive="$RUNNER_TEMP/rpmx-cache.tar.gz"
          if [ ! -f "$archive" ]; then
            echo "no cached build root"
            exit 0
          fi
          mkdir -p "$HOME/.cache/rpmx"
          podman unshare tar --numeric-owner --acls --xattrs -xzf "$archive" \
            -C "$HOME/.cache/rpmx"

      - name: Write signing key
        if: ${{ inputs.sign && env.RPMX_SIGNING_KEY != '' }}
        env:
          KEY: ${{ secrets.RPMX_SIGNING_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
          chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"

      - name: Build
        env:
          BUILD_RELEASE: ${{ inputs.sign && needs.configure.outputs.build_release || '' }}
        run: |
          args=(--package "${{ matrix.package }}" --arch "${{ matrix.arch }}" --output out)
          if [ -d "$RUNNER_TEMP/foundation-rpms" ]; then
            args+=(--test-rpms "$RUNNER_TEMP/foundation-rpms")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc" ]; then
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -n "${BUILD_RELEASE:-}" ]; then
            args+=(--build-release "$BUILD_RELEASE")
          fi
          ./scripts/build-all.sh "${args[@]}"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.package }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

      - name: Pack build root cache
        run: |
          if [ ! -d "$HOME/.cache/rpmx" ]; then
            echo "no build root cache to pack"
            exit 0
          fi
          podman unshare tar --numeric-owner --acls --xattrs -czf \
            "$RUNNER_TEMP/rpmx-cache.tar.gz" -C "$HOME/.cache/rpmx" .
