name: Build a package transaction

# Source preparation starts native binary jobs independently for each package.
# Each following wave consumes a fixed view of the completed candidates.
on:
  workflow_call:
    inputs:
      selection:
        description: changed compares published hashes; affected compares Git refs.
        type: string
        default: affected
      base:
        type: string
        default: ""
      publish:
        type: boolean
        default: false
    secrets:
      RPMX_SIGNING_KEY:
        required: false
      RPMX_PUBLIC_KEY:
        required: false
      PACKAGES_S3_ACCESS_KEY_ID:
        required: false
      PACKAGES_S3_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:
    inputs:
      selection:
        type: choice
        options: [all, affected]
        default: all
      base:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-26.04
    outputs:
      arches: ${{ steps.configure.outputs.arches }}
      build_release: ${{ steps.configure.outputs.build_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build configuration
        id: configure
        run: |
          arches=$(./scripts/list-arches.sh)
          build_release=$(date -u +%s)
          echo "arches=$arches" >>"$GITHUB_OUTPUT"
          echo "build_release=$build_release" >>"$GITHUB_OUTPUT"
          echo "arches: $arches"
          echo "build release: $build_release"

  rpmx:
    name: rpmx (${{ matrix.arch }})
    needs: configure
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.configure.outputs.arches) }}
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx

      - name: Package rpmx
        run: |
          tar -czf "$RUNNER_TEMP/rpmx.tar.gz" \
            -C "$HOME/.local/share/rpmx" .

      - name: Upload rpmx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpmx-${{ matrix.arch }}
          path: ${{ runner.temp }}/rpmx.tar.gz
          if-no-files-found: error

  prepare:
    needs: [configure, rpmx]
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-x86_64
      - name: Start transaction against the published repository
        id: plan
        env:
          SELECTION: ${{ inputs.selection }}
          BASE_REF: ${{ inputs.base }}
          BUILD_RELEASE: ${{ needs.configure.outputs.build_release }}
          BASE_URL: ${{ vars.PACKAGES_BASE_URL || 'https://packages.eternal.sturla.tech' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--state .work/transaction/state.json --base-url "$BASE_URL" --build-release "$BUILD_RELEASE")
          case "$SELECTION" in
            changed)
              args+=(--packages changed --published "$BASE_URL") ;;
            affected)
              selection=(--json)
              if [ -n "$BASE_REF" ]; then selection+=(--base "$BASE_REF"); fi
              args+=(--packages "$(./scripts/affected.sh "${selection[@]}")") ;;
            all)
              args+=(--packages "$(./scripts/affected.sh --all --json)") ;;
            *) echo "unknown selection: $SELECTION" >&2; exit 2 ;;
          esac
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'publication requires main' >&2
            exit 1
          fi
          python3 ./scripts/build-transaction.py init "${args[@]}" >"$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "packages=$(jq -c .packages "$RUNNER_TEMP/plan.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transaction-w0
          path: .work/transaction/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  wave_0:
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      waves: '[0,1,2,3]'
      final: false

  wave_1:
    needs: wave_0
    if: needs.wave_0.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_0.outputs.packages }}
      waves: '[4,5,6,7]'
      final: false

  wave_2:
    needs: wave_1
    if: needs.wave_1.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_1.outputs.packages }}
      waves: '[8,9,10,11]'
      final: false

  wave_3:
    needs: wave_2
    if: needs.wave_2.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_2.outputs.packages }}
      waves: '[12,13,14,15]'
      final: false

  wave_4:
    needs: wave_3
    if: needs.wave_3.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_3.outputs.packages }}
      waves: '[16,17,18,19]'
      final: false

  wave_5:
    needs: wave_4
    if: needs.wave_4.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_4.outputs.packages }}
      waves: '[20,21,22,23]'
      final: false

  wave_6:
    needs: wave_5
    if: needs.wave_5.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_5.outputs.packages }}
      waves: '[24,25,26,27]'
      final: false

  wave_7:
    needs: wave_6
    if: needs.wave_6.outputs.packages != '[]'
    uses: ./.github/workflows/_build-window.yml
    with:
      packages: ${{ needs.wave_6.outputs.packages }}
      waves: '[28,29,30,31]'
      final: true

  repository:
    name: Assemble the completed candidate repository
    needs: [prepare, wave_0, wave_1, wave_2, wave_3, wave_4, wave_5, wave_6, wave_7]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      packages: ${{ steps.collect.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: transaction-w*
          path: .work/states
      - name: Select the finished transaction
        id: collect
        run: |
          python3 ./scripts/transaction-artifacts.py collect --states .work/states \
            --output .work/final >"$RUNNER_TEMP/complete.json"
          cat "$RUNNER_TEMP/complete.json"
          echo "matrix=$(jq -c .matrix "$RUNNER_TEMP/complete.json")" >>"$GITHUB_OUTPUT"
          echo "packages=$(jq -c .packages "$RUNNER_TEMP/complete.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.collect.outputs.packages != '[]'
        with:
          pattern: binary-w*
          path: .work/candidates
      - name: Seal the acceptance repository
        if: steps.collect.outputs.packages != '[]'
        run: |
          python3 ./scripts/build-transaction.py seal --state .work/final/state.json \
            --artifacts .work/candidates --output .work/repository
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.packages != '[]'
        with:
          name: transaction-final
          path: .work/final/
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.packages != '[]'
        with:
          name: acceptance-repository-x86_64
          path: .work/repository/x86_64/
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.packages != '[]'
        with:
          name: acceptance-repository-aarch64
          path: .work/repository/aarch64/
          overwrite: true
          retention-days: 1

  accept:
    needs: repository
    if: ${{ always() && needs.repository.result == 'success' && needs.repository.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.repository.outputs.matrix) }}
    uses: ./.github/workflows/_accept-rpm.yml
    with:
      package: ${{ matrix.package }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      wave: ${{ matrix.wave }}

  candidate:
    name: Export the accepted package transaction
    needs: [repository, accept]
    if: ${{ always() && !inputs.publish && needs.repository.result == 'success' && needs.accept.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transaction-final
          path: .work/final
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-w*
          path: .work/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accepted-*
          path: .work/artifacts
      - name: Verify and pack the final tested bytes
        run: |
          python3 ./scripts/transaction-artifacts.py pack --state .work/final/state.json \
            --artifacts .work/artifacts --output .work/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: .work/candidate/
          if-no-files-found: error
          overwrite: true
          retention-days: 1


  publish:
    needs: [repository, accept]
    if: ${{ always() && inputs.publish && needs.repository.result == 'success' && needs.accept.result == 'success' }}
    runs-on: ubuntu-26.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PACKAGES_S3_REGION || 'auto' }}
      PACKAGES_S3_ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
      PACKAGES_S3_BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
      PACKAGES_BASE_URL: ${{ vars.PACKAGES_BASE_URL || 'https://packages.eternal.sturla.tech' }}
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
      RPMX_PUBLIC_KEY: ${{ secrets.RPMX_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transaction-final
          path: .work/final
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-w*
          path: .work/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accepted-*
          path: .work/artifacts
      - name: Publish the tested repository
        run: ./scripts/publish-transaction.sh .work/final/state.json .work/artifacts .work/published
      - name: Retain signing receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-signing-receipt
          path: .work/published/signing.json
          overwrite: true
          retention-days: 7
