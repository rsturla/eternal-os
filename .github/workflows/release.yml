name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  packages:
    name: Packages
    needs: lint
    uses: ./.github/workflows/_build-packages.yml
    with:
      selection: all
      sign: true
    secrets: inherit

  repository:
    name: Repository
    needs: packages
    # All refs publish to the same rolling and archive prefixes.
    concurrency:
      group: package-repository
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PACKAGES_S3_REGION || 'auto' }}
      PACKAGES_S3_BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
      PACKAGES_S3_ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
      PACKAGES_BASE_URL: ${{ vars.PACKAGES_BASE_URL || 'https://packages.eternal.sturla.tech' }}
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
      RPMX_PUBLIC_KEY: ${{ secrets.RPMX_PUBLIC_KEY }}
      PACKAGES: ${{ needs.packages.outputs.packages }}
      ARCHES: ${{ needs.packages.outputs.arches }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rpmx
        uses: ./.github/actions/setup-rpmx

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-*
          path: out
          merge-multiple: true

      - name: Verify the plan is complete
        run: |
          mapfile -t planned < <(jq -r '.[]' <<<"$PACKAGES")
          mapfile -t arches < <(jq -r '.[]' <<<"$ARCHES")
          missing=0
          for package in "${planned[@]}"; do
            for arch in "${arches[@]}"; do
              if ! compgen -G "out/$package/$arch/*.rpm" >/dev/null; then
                echo "missing artifacts for $package on $arch" >&2
                missing=1
              fi
            done
          done
          ((missing == 0)) || exit 1
          echo "all ${#planned[@]} packages downloaded for ${arches[*]}"

      - name: Write keys
        env:
          PRIVATE_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
          PUBLIC_KEY: ${{ secrets.RPMX_PUBLIC_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/signing"
          if [ -n "$PRIVATE_KEY" ]; then
            printf '%s' "$PRIVATE_KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
            chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"
          fi
          if [ -n "$PUBLIC_KEY" ]; then
            printf '%s' "$PUBLIC_KEY" >"$RUNNER_TEMP/signing/rpmx.asc.pub"
            chmod 0644 "$RUNNER_TEMP/signing/rpmx.asc.pub"
          fi

      - name: Publish repository
        run: |
          args=(--packages out --output site --release rolling --archive archive
            --bucket "$PACKAGES_S3_BUCKET"
            --region "$AWS_DEFAULT_REGION"
            --base-url "$PACKAGES_BASE_URL")
          if [ -n "$PACKAGES_S3_ENDPOINT" ]; then
            args+=(--endpoint-url "$PACKAGES_S3_ENDPOINT")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc" ]; then
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc.pub" ]; then
            args+=(--public-key "$RUNNER_TEMP/signing/rpmx.asc.pub")
          fi
          ./scripts/publish-bucket.sh "${args[@]}"
