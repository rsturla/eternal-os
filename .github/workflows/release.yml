name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful CI run with the accepted candidate. Empty discovers the merged PR.
        type: string

permissions:
  contents: read

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  repository:
    name: Repository
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PACKAGES_S3_REGION || 'auto' }}
      PACKAGES_S3_BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
      PACKAGES_S3_ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
      PACKAGES_BASE_URL: ${{ vars.PACKAGES_BASE_URL || 'https://packages.eternal.sturla.tech' }}
      RPMX_SIGNING_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
      RPMX_PUBLIC_KEY: ${{ secrets.RPMX_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate accepted candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          args=(--commit "$TARGET_SHA")
          if [ -n "$CANDIDATE_RUN" ]; then args+=(--run "$CANDIDATE_RUN"); fi
          python3 ./scripts/actions-build.py candidate "${args[@]}"

      - name: Download accepted candidate
        if: steps.candidate.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: .work/candidate

      - name: Setup rpmx
        if: steps.candidate.outputs.skip != 'true'
        uses: ./.github/actions/setup-rpmx

      - name: Write keys
        if: steps.candidate.outputs.skip != 'true'
        env:
          PRIVATE_KEY: ${{ secrets.RPMX_SIGNING_KEY }}
          PUBLIC_KEY: ${{ secrets.RPMX_PUBLIC_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/signing"
          if [ -n "$PRIVATE_KEY" ]; then
            printf '%s' "$PRIVATE_KEY" >"$RUNNER_TEMP/signing/rpmx.asc"
            chmod 0600 "$RUNNER_TEMP/signing/rpmx.asc"
          fi
          if [ -n "$PUBLIC_KEY" ]; then
            printf '%s' "$PUBLIC_KEY" >"$RUNNER_TEMP/signing/rpmx.asc.pub"
            chmod 0644 "$RUNNER_TEMP/signing/rpmx.asc.pub"
          fi

      - name: Prepare signed release without rebuilding
        if: steps.candidate.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          args=(--candidate .work/candidate --output out --source-sha "$SOURCE_SHA"
            --base-url "$PACKAGES_BASE_URL")
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc" ]; then
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          python3 ./scripts/transaction-artifacts.py release "${args[@]}"

      - name: Publish repository
        if: steps.candidate.outputs.skip != 'true'
        run: |
          current=$(git ls-remote origin refs/heads/main)
          if [ "${current%%$'\t'*}" != "$(git rev-parse HEAD)" ]; then
            echo 'main moved; publish its newer candidate instead' >&2
            exit 1
          fi
          args=(--packages out --output site --release rolling --archive archive
            --bucket "$PACKAGES_S3_BUCKET"
            --region "$AWS_DEFAULT_REGION"
            --base-url "$PACKAGES_BASE_URL")
          if [ -n "$PACKAGES_S3_ENDPOINT" ]; then
            args+=(--endpoint-url "$PACKAGES_S3_ENDPOINT")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc" ]; then
            args+=(--signing-key "$RUNNER_TEMP/signing/rpmx.asc")
          fi
          if [ -f "$RUNNER_TEMP/signing/rpmx.asc.pub" ]; then
            args+=(--public-key "$RUNNER_TEMP/signing/rpmx.asc.pub")
          fi
          ./scripts/publish-bucket.sh "${args[@]}"

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/rpmx.asc" "$RUNNER_TEMP/signing/rpmx.asc.pub"
