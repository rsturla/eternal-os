name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  packages:
    name: Packages
    needs: lint
    uses: ./.github/workflows/_build-packages.yml
    with:
      selection: changed
      sign: true
      publish: true
    secrets: inherit
