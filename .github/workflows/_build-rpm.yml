name: Rebuild RPMs from a shared SRPM

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      wave:
        required: true
        type: number
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  rebuild:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
      - name: Download shared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-w${{ inputs.wave }}-${{ inputs.package }}
          path: .work/bundle
      - name: Download pinned target dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: .work/inputs
      - name: Rebuild with source tests
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          args=(--bundle .work/bundle --inputs .work/inputs --arch "$TARGET_ARCH" --output out
            --transaction .work/bundle/transaction.json)
          python3 ./scripts/package-artifacts.py rebuild "${args[@]}"
      - name: Upload candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: |
            out/*/*/*.rpm
            out/*/*/source-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Archive build evidence
        if: always()
        run: |
          if [[ -d out ]]; then
            mkdir -p .work
            find out -type d -name evidence -prune -print0 -o -type f -name '*.json' -print0 |
              tar --null --files-from=- --create --gzip --file=.work/build-evidence.tar.gz
          fi
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-evidence-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: .work/build-evidence.tar.gz
          include-hidden-files: true
          overwrite: true
          retention-days: 7
