name: Rebuild RPMs from a shared SRPM

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      wave:
        required: true
        type: number
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      sign:
        type: boolean
        default: false
    secrets:
      RPMX_SIGNING_KEY:
        required: false

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ inputs.arch }}
      - name: Download shared source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-w${{ inputs.wave }}-${{ inputs.package }}
          path: .work/bundle
      - name: Download pinned target dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: .work/inputs
      - name: Download transaction view
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transaction-w${{ inputs.wave }}
          path: .work/transaction
      - name: Download completed candidates
        if: inputs.wave > 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-w*
          path: .work/candidates
      - name: Rebuild with source tests
        env:
          TARGET_ARCH: ${{ inputs.arch }}
          SIGNING_KEY: ${{ inputs.sign && secrets.RPMX_SIGNING_KEY || '' }}
        run: |
          args=(--bundle .work/bundle --inputs .work/inputs --arch "$TARGET_ARCH" --output out
            --transaction .work/transaction/state.json --candidates .work/candidates)
          if [ -n "$SIGNING_KEY" ]; then
            install -d -m 0700 "$RUNNER_TEMP/signing"
            printf '%s' "$SIGNING_KEY" >"$RUNNER_TEMP/signing/key.asc"
            chmod 0600 "$RUNNER_TEMP/signing/key.asc"
            args+=(--signing-key "$RUNNER_TEMP/signing/key.asc")
          fi
          python3 ./scripts/package-artifacts.py rebuild "${args[@]}"
      - name: Upload candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: out/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-evidence-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: |
            out/**/evidence/
            out/**/*.json
            !out/**/*.rpm
          overwrite: true
          retention-days: 7
