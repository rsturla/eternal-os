name: Accept RPMs against the completed repository

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      arch:
        required: true
        type: string
      wave:
        required: true
        type: number
      runner:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rpmx
        with:
          artifact: rpmx-${{ inputs.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-w${{ inputs.wave }}-${{ inputs.package }}
          path: .work/bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-w${{ inputs.wave }}-${{ inputs.package }}-${{ inputs.arch }}
          path: .work/binaries
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-repository-${{ inputs.arch }}
          path: .work/repository/${{ inputs.arch }}
      - name: Run package acceptance
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          python3 ./scripts/package-artifacts.py accept --bundle .work/bundle \
            --binaries .work/binaries --arch "$TARGET_ARCH" --repository .work/repository --output out
      - name: Upload accepted package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-${{ inputs.package }}-${{ inputs.arch }}
          path: out/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence-${{ inputs.package }}-${{ inputs.arch }}
          path: out/${{ inputs.package }}/${{ inputs.arch }}/acceptance/
          overwrite: true
          retention-days: 7
